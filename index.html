elop?",[["Anxious-resistant","It develops from inconsistent caring from parents."],["Secure","This develops with reliable care and supports exploration."],["Anxious-avoidant","This develops when the caregiver doesn’t always provide the infant’s needs."],["Disorganized-disoriented","This is most prevalent with insensitive, intrusive, or abusive mothers."]]],["Which pair correctly contrasts anxious-resistant and anxious-avoidant behavior at reunion?",[["Resistant: seeks contact but rejects soothing. Avoidant: ignores or avoids the caregiver","Both are distressing patterns, but they differ on reunion."],["Resistant: ignores the caregiver. Avoidant: seeks contact but rejects soothing","This swaps the two styles."],["Both: enthusiastic when reunited","This describes secure attachment."],["Both: fearful behavior toward the returning mother","This describes disorganized-disoriented attachment."]]],["Which pairing correctly links attachment style with play and exploration?",[["Secure provides the foundation for play and exploration, and anxious-avoidant lacks the ability to engage in it effectively","This follows the notes on both styles."],["Anxious-avoidant provides the foundation, and secure lacks it","This reverses the two styles."],["Disorganized provides the foundation, and secure lacks it","Secure attachment provides the foundation."],["Anxious-resistant provides the foundation, and secure lacks it","Secure attachment provides the foundation."]]],["A student says disorganized-disoriented attachment is most common in babies with sensitive, responsive mothers. How should this be evaluated?",[["Incorrect: it is most prevalent in babies with insensitive, intrusive, or abusive mothers","The notes link this style to such caregiving."],["Correct: sensitive mothers produce contradictory behavior","Sensitive, responsive care is linked more to secure attachment."],["Correct: this style develops only from inconsistent caring","Inconsistent caring is linked to anxious-resistant attachment."],["Incorrect: it develops only when babies are calm at separation","Calm separation is linked to anxious-avoidant attachment."]]],["What does Ainsworth’s Strange Situation evaluate?",[["An infant’s attachment style, by observing behavior during brief separations and reunions with a caregiver","This is how the procedure works."],["A child’s stage of moral reasoning","That is Kohlberg’s theory."],["A toddler’s stage of separation-individuation","That is Mahler’s theory."],["An adolescent’s identity status","That is Marcia’s theory."]]],["Which psychologist studied attachment styles and conducted the Strange Situation experiment?",[["Mary Ainsworth","She identified secure, anxious-resistant, anxious-avoidant, and disorganized-disoriented styles."],["John Bowlby","He proposed attachment theory and the stages of separation anxiety."],["Margaret Mahler","She proposed separation-individuation theory."],["Erik Erikson","He proposed psychosocial stages."]]],["A toddler protests when her mother leaves, runs to hug her when she returns, and then resumes exploring the toys. Which attachment style is this?",[["Secure","Distressed when separated and enthusiastic when reunited, with a foundation for play and exploration."],["Anxious-resistant","She would seek contact but reject being soothed."],["Anxious-avoidant","She would ignore or avoid her mother."],["Disorganized-disoriented","She would show contradictory or misdirected behavior."]]],["An infant clings to her mother on return but kicks and resists when her mother tries to pick her up. Which attachment style is this?",[["Anxious-resistant","She initiates contact when reunited but rejects attempts at being soothed."],["Secure","A secure infant is enthusiastic and accepts comfort."],["Anxious-avoidant","An avoidant infant ignores and avoids the caregiver."],["Disorganized-disoriented","This shows contradictory behavior with no consistent pattern."]]],["A baby plays calmly with the stranger when her father leaves and turns away from him when he returns. Which attachment style is this?",[["Anxious-avoidant","She is calm when separated, accepts the stranger, and ignores or avoids the caregiver on reunion."],["Secure","A secure infant is distressed at separation and enthusiastic at reunion."],["Anxious-resistant","A resistant infant is distressed and seeks contact on reunion."],["Disorganized-disoriented","This shows contradictory or fearful behavior."]]],["When her mother returns, an infant moves toward her, then freezes and backs away fearfully. Which attachment style is this?",[["Disorganized-disoriented","Contradictory, repetitive, or misdirected behavior, such as a fear response upon the mother’s return."],["Anxious-resistant","The infant would seek contact but reject soothing."],["Anxious-avoidant","The infant would ignore the caregiver."],["Secure","The infant would be enthusiastic and comforted."]]],["A caregiver doesn’t always provide the infant’s needs. Which attachment style is this associated with?",[["Anxious-avoidant","It develops from inconsistent responses from the caregiver and lacks effective play and exploration."],["Secure","It develops with responsive care and supports exploration."],["Anxious-resistant","It develops from inconsistent caring such as alternating love and shouting."],["Disorganized-disoriented","It is most prevalent with insensitive, intrusive, or abusive mothers."]]],["Which attachment style is most prevalent in babies whose mothers are insensitive, intrusive, or abusive?",[["Disorganized-disoriented","It shows contradictory, repetitive, or misdirected behavior."],["Secure","It is associated with responsive, reliable care."],["Anxious-resistant","It develops from inconsistent caring."],["Anxious-avoidant","It develops from inconsistent caregiver response to needs."]]],["Which attachment style provides the foundation for play and exploration?",[["Secure","These infants are distressed when separated, enthusiastic when reunited, and ready to explore."],["Anxious-avoidant","These infants lack the ability to engage in effective play and exploration."],["Anxious-resistant","These infants are distressed and reject soothing on reunion."],["Disorganized-disoriented","These infants show contradictory behavior."]]],["How does the behavior of secure and anxious-avoidant infants differ at separation?",[["Secure: distressed. Anxious-avoidant: calm and accepting of strangers","The two styles react differently when the caregiver leaves."],["Secure: calm. Anxious-avoidant: distressed","This swaps the two styles."],["Both: calm and accepting of strangers","Only the avoidant infant behaves this way."],["Both: distressed and rejecting of soothing","This describes anxious-resistant infants."]]],["How does the behavior of anxious-resistant and disorganized-disoriented infants differ?",[["Resistant: seeks contact but rejects soothing. Disorganized: contradictory, repetitive, or misdirected behavior","Resistant behavior follows a consistent pattern, while disorganized behavior does not."],["Resistant: contradictory behavior. Disorganized: seeks contact but rejects soothing","This swaps the two styles."],["Both: calm when separated","Neither is described as calm."],["Both: enthusiastic when reunited","This describes secure attachment."]]],["How do the typical origins of anxious-resistant and disorganized-disoriented attachment differ?",[["Resistant: inconsistent caring. Disorganized: insensitive, intrusive, or abusive caregiving","These are the origins given for each style."],["Resistant: abusive caregiving. Disorganized: inconsistent caring","This swaps the two origins."],["Both: consistently responsive caregiving","Responsive care is linked to secure attachment."],["Both: absence of any caregiver","The styles concern the quality of care from a caregiver."]]],["Which row correctly matches an attachment style with its behavior?",[["Secure: distressed when separated, enthusiastic when reunited","This is how the notes describe secure attachment."],["Anxious-avoidant: distressed when separated, seeks contact, rejects soothing","That describes anxious-resistant."],["Anxious-resistant: calm when separated, accepts a stranger","That describes anxious-avoidant."],["Disorganized-disoriented: calm separation, enthusiastic reunion","That does not describe disorganized behavior."]]],["A student says an infant who stays calm at separation, accepts a stranger, and ignores his mother on return must be securely attached because he never gets upset. How should this be evaluated?",[["Incorrect: this pattern indicates anxious-avoidant attachment, while secure infants are distressed and enthusiastic when reunited","Secure infants show distress at separation and enthusiasm at reunion."],["Correct: calm infants are always secure","Calm separation with avoidance is anxious-avoidant."],["Correct: ignoring the mother shows secure attachment","Secure infants welcome the caregiver’s return."],["Incorrect: this is disorganized-disoriented attachment","That shows contradictory or fearful behavior."]]],["A student says anxious-resistant attachment develops from caregivers who are always harsh. How should this be evaluated?",[["Incorrect: it develops from inconsistent caring, such as love one moment and shouting the next","Inconsistency, not constant harshness, is the notes’ description."],["Correct: it develops from constant harshness","The key factor is inconsistency."],["Correct: it develops from perfectly responsive care","Responsive care is linked to secure attachment."],["Incorrect: it develops only after age 10","The styles are observed in infants."]]]]},{"id":10,"lec":2,"t":"Mahler’s Separation-Individuation Theory","q":[["Mahler says a child gradually becomes an individual separate from the primary caregiver, which ultimately leads to a sense of identity. What does she call this?",[["Psychological birth","It begins in the first week of postnatal life and continues for about three years."],["Maternal deprivation","This is Bowlby’s idea about the importance of a continuous caregiver relationship."],["Identity moratorium","This is Marcia’s status of crisis without commitment."],["Monotropy","This is Bowlby’s idea of attaching to one main figure."]]],["Which sequence gives the main phases of Mahler’s theory in order?",[["Normal autism, normal symbiosis, separation-individuation","The phases run from the newborn period to about 3 years."],["Normal symbiosis, normal autism, separation-individuation","The first two phases are swapped."],["Separation-individuation, normal autism, normal symbiosis","Separation-individuation comes last."],["Normal autism, separation-individuation, normal symbiosis","The last two phases are swapped."]]],["A 2-week-old’s needs are met automatically within her mother’s care, and she seems to feel all-powerful. Which phase is this?",[["Normal autism","Birth to 3 or 4 weeks, with subtle narcissism and a sense of omnipotence."],["Normal symbiosis","This begins later, when the infant acknowledges the mother as a source of need satisfaction."],["Differentiation","This begins around 5 months, with bodily breaking away."],["Practicing","This is later, when the child distinguishes her body from her mother’s."]]],["A 3-month-old recognizes her mother as the source of need-satisfaction, though other people remain pre-objects. Which phase is this?",[["Normal symbiosis","About 4 to 5 weeks to 4 to 5 months; not true symbiosis."],["Normal autism","This is the first weeks, before the mother is acknowledged."],["Rapprochement","This is later, when the child wants to bring herself and mother back together."],["Libidinal object constancy","This is the third year, with an inner representation of mother."]]],["An 8-month-old begins breaking away bodily from the mother-infant orbit and is curious about strangers. Which substage is this?",[["Differentiation","About 5 months to 7 to 10 months, and curiosity about strangers is psychologically healthy."],["Practicing","This is when the child easily distinguishes his body from his mother’s."],["Rapprochement","This is when the child wants to be reunited with the mother."],["Normal symbiosis","This is before the separation-individuation phase begins."]]],["A 12-month-old crawls away to explore and easily distinguishes his body from his mother’s. Which substage is this?",[["Practicing","About 7 to 10 months to 16 months."],["Differentiation","This is the earlier bodily breaking away from the orbit."],["Rapprochement","This is the later desire to bring child and mother back together."],["Libidinal object constancy","This is the third year of life."]]],["A 20-month-old, after exploring, now wants to bring herself and her mother back together. Which substage is this?",[["Rapprochement","About 16 to 25 months."],["Practicing","This is the earlier period of easy distinguishing and exploring."],["Differentiation","This is the earliest substage of breaking away."],["Libidinal object constancy","This comes later, with an inner representation of the mother."]]],["A 3-year-old tolerates being apart from her mother because she carries an inner representation of her. Which substage is this?",[["Libidinal object constancy","The third year of life, when the child can tolerate physical separation."],["Rapprochement","This is the earlier desire to bring child and mother back together."],["Practicing","This is earlier exploration with distinction of body from mother’s."],["Normal autism","This is the newborn phase, birth to 3 or 4 weeks."]]],["How does a psychologically healthy infant in the differentiation substage differ from an unhealthy one?",[["Healthy: curious about strangers. Unhealthy: fearful of strangers","The two respond differently to strangers during bodily breaking away."],["Healthy: fearful of strangers. Unhealthy: curious about strangers","This reverses the two."],["Healthy: cannot distinguish body from mother. Unhealthy: can","Distinguishing body from mother’s is the practicing substage."],["Healthy: no awareness of mother. Unhealthy: aware of her","Unawareness of mother is the normal autism phase."]]],["A student says a child who never develops libidinal object constancy will easily tolerate being apart from her mother. How should this be evaluated?",[["Incorrect: she will keep depending on her mother’s physical presence for security","Object constancy supplies the inner representation that makes separation tolerable."],["Correct: she will feel secure without her mother","Without constancy, security depends on mother’s physical presence."],["Correct: object constancy develops in the first month","It develops in the third year of life."],["Incorrect: it only matters in adolescence","It is a substage of the first three years."]]],["According to Mahler, when does an individual’s psychological birth begin, and how long does it continue?",[["It begins in the first week of postnatal life and continues for about 3 years","This is the span of the separation-individuation process."],["It begins at puberty and continues through adolescence","That is closer to identity formation in Marcia’s theory."],["It begins at 3 years and continues for 10 years","The process is complete by about age 3."],["It begins before birth and ends at birth","Mahler describes it as a postnatal process."]]],["A 6-month-old begins to break away bodily from her mother. Within which phase of Mahler’s theory is she?",[["Separation-individuation","This phase runs from about 4 to 5 months to 30 to 36 months."],["Normal autism","This phase runs from birth to 3 or 4 weeks."],["Normal symbiosis","This phase ends at about 4 to 5 months."],["Libidinal object constancy","This is the third year of life, a substage within separation-individuation."]]],["A 14-month-old crawls and walks away from his mother, easily telling his body apart from hers. Which age range matches his substage?",[["7 to 10 months to 16 months, practicing","This is the practicing substage."],["5 months to 7 to 10 months, differentiation","This is the earlier bodily breaking away."],["16 to 25 months, rapprochement","This is the later desire to reunite."],["The third year of life, libidinal object constancy","This is when the child holds an inner representation of the mother."]]],["An 18-month-old keeps returning to her mother’s side after exploring. Which age range matches her substage?",[["About 16 to 25 months, rapprochement","The child wants to bring herself and her mother back together."],["7 to 10 months to 16 months, practicing","This is the earlier exploring substage."],["5 months to 7 to 10 months, differentiation","This is the earliest substage."],["The third year of life, libidinal object constancy","This is later."]]],["Why does a newborn in the normal autism phase have a sense of omnipotence?",[["Her needs are cared for automatically within her mother’s all-powerful orbit","This period of subtle narcissism covers birth to 3 or 4 weeks."],["She understands that her mother is separate from her","She has not yet acknowledged her mother as separate."],["She has developed an inner representation of her mother","That comes in the third year of life."],["She has begun to distinguish her body from her mother’s","That happens in the practicing substage."]]],["How does the normal autism phase differ from the normal symbiosis phase?",[["In autism, needs are met within the mother’s orbit, and in symbiosis the infant acknowledges the mother as the source of need-satisfaction","The infant becomes aware of the mother’s role by symbiosis."],["In autism, the infant acknowledges the mother, and in symbiosis she does not","This reverses the two phases."],["Autism is the third year, and symbiosis is the second year","Both occur in the first months."],["They are the same phase","They are two separate phases."]]],["How do the practicing and rapprochement substages differ?",[["Practicing: the child easily distinguishes her body from her mother’s. Rapprochement: she wants to bring herself and her mother back together","The child first moves away, then seeks reunion."],["Practicing: she wants to reunite. Rapprochement: she distinguishes her body","This reverses the substages."],["Both: she fears strangers","Fear of strangers is the unhealthy form of differentiation."],["Both: she holds an inner representation of her mother","That is libidinal object constancy."]]],["How do differentiation and libidinal object constancy differ?",[["Differentiation is bodily breaking away from the symbiotic orbit, and object constancy is an inner representation of the mother that tolerates separation","One is physical separation, and the other is a lasting mental image."],["Differentiation is an inner representation of the mother, and object constancy is bodily breaking away","This reverses the two substages."],["Both occur in the first month of life","They occur much later."],["Both are the same as normal autism","Normal autism is a separate phase."]]],["A student says normal symbiosis is a true symbiosis in which others are fully recognized as people. How should this be evaluated?",[["Incorrect: it is not true symbiosis, and other people are pre-objects","The infant only acknowledges the mother as source of need-satisfaction."],["Correct: others are fully recognized","Other people are only pre-objects."],["Correct: it begins at birth","It begins at about 4 to 5 weeks."],["Incorrect: it lasts until age 3","It ends at about 4 to 5 months."]]],["A student says the separation-individuation phase ends at about 12 months. How should this be evaluated?",[["Incorrect: it lasts until about 30 to 36 months","It runs from 4 to 5 months to 30 to 36 months."],["Correct: it ends at 12 months","It continues well past the first year."],["Correct: it ends at 5 months","It begins at about 4 to 5 months."],["Incorrect: it ends at puberty","It is complete by about age 3."]]],["A student says rapprochement means the child wants to move farther away from her mother. How should this be evaluated?",[["Incorrect: rapprochement is the desire to bring herself and her mother back together","It occurs at about 16 to 25 months."],["Correct: the child wants more distance","The child wants closeness again."],["Correct: it is the phase of omnipotence","That is normal autism."],["Incorrect: it is the phase of inner representation","That is libidinal object constancy."]]],["A 3-year-old who has libidinal object constancy and one who lacks it are left with a babysitter. How do they differ?",[["The first tolerates the separation, and the second keeps depending on her mother’s physical presence for security","An inner representation of the mother makes separation bearable."],["The first depends on her mother’s presence, and the second tolerates separation","This reverses the two children."],["Both depend on her mother’s presence equally","The two children differ in this respect."],["Neither is affected by separation","Object constancy makes the difference."]]],["A 9-month-old shows curiosity about strangers, while another becomes fearful of them. Which substage and judgment fit?",[["Differentiation: curiosity is psychologically healthy and fear is unhealthy","This is how the notes describe the substage."],["Practicing: curiosity is unhealthy and fear is healthy","This reverses the judgment."],["Rapprochement: both are healthy","Rapprochement is later and concerns reunion."],["Normal symbiosis: both are unhealthy","Symbiosis comes before this substage."]]],["Which sequence lists the substages of separation-individuation in the correct order?",[["Differentiation, practicing, rapprochement, libidinal object constancy","These are the four substages in order."],["Practicing, differentiation, rapprochement, libidinal object constancy","The first two are swapped."],["Differentiation, rapprochement, practicing, libidinal object constancy","The middle two are swapped."],["Libidinal object constancy, rapprochement, practicing, differentiation","This reverses the order."]]],["Mahler’s theory describes how a child becomes separate from the primary caregiver. What does this ultimately lead to?",[["A sense of identity","Psychological birth leads to an individual identity."],["A secure attachment style","That is Ainsworth’s concept."],["A conventional level of moral reasoning","That is Kohlberg’s concept."],["A foreclosed identity status","That is one of Marcia’s statuses."]]]]},{"id":11,"lec":2,"t":"Marcia’s Identity Status Theory","q":[["A researcher studies how adolescents and young adults develop their sense of identity based on exploration and commitment. Whose theory is this?",[["Marcia’s identity status theory","It describes identity development through exploration and commitment."],["Erikson’s psychosocial theory","It has an identity stage, but the exploration-commitment statuses are Marcia’s."],["Kohlberg’s moral development theory","It concerns moral reasoning."],["Mahler’s separation-individuation theory","It concerns early childhood."]]],["In Marcia’s theory, what is a crisis?",[["A period of conscious decision making related to identity formation","It is the exploration part of identity development."],["A personal investment in an occupation or belief system","That is commitment."],["A conflict between id and superego","That is a Freudian idea."],["A fear of strangers","That is an unhealthy form of differentiation in Mahler’s theory."]]],["In Marcia’s theory, what is commitment?",[["A personal investment in an occupation or system of beliefs","It is the choice-making part of identity development."],["A period of conscious decision making about identity","That is crisis."],["A search for options","That is exploration."],["A disorganized attachment style","That is Ainsworth’s concept."]]],["Which list names Marcia’s four identity statuses?",[["Diffusion, foreclosure, moratorium, achievement","These are the four categories."],["Secure, resistant, avoidant, disorganized","These are Ainsworth’s attachment styles."],["Autism, symbiosis, practicing, rapprochement","These are terms from Mahler’s theory."],["Trust, autonomy, initiative, industry","These are early Erikson stages."]]],["A 19-year-old has not explored any careers or beliefs and has not committed to anything. Which identity status is this?",[["Identity diffusion","There is no crisis and no commitment."],["Identity foreclosure","This is commitment without crisis."],["Identity moratorium","This is crisis without commitment."],["Identity achievement","This is a crisis that leads to commitment."]]],["An 18-year-old plans to join the family business, as her parents always expected, and has never considered other options. Which identity status is this?",[["Identity foreclosure","There is commitment without crisis."],["Identity diffusion","There is neither commitment nor crisis."],["Identity moratorium","There is crisis without commitment."],["Identity achievement","The commitment follows a crisis."]]],["A 20-year-old keeps switching majors and trying out different beliefs but has not settled on anything. Which identity status is this?",[["Identity moratorium","There is crisis without commitment."],["Identity foreclosure","This is commitment without crisis."],["Identity diffusion","There is no crisis."],["Identity achievement","There is a commitment."]]],["A 24-year-old weighed several fields, tried a few, and has now committed firmly to a counseling career. Which identity status is this?",[["Identity achievement","A crisis led to commitment."],["Identity moratorium","There would be no commitment yet."],["Identity foreclosure","The commitment would come without a crisis."],["Identity diffusion","There would be no crisis and no commitment."]]],["A young adult drifts from job to job, shrugs when asked about values, and has no plans. Which identity status is this?",[["Identity diffusion","There is no crisis and no commitment."],["Identity moratorium","There would be active exploration."],["Identity foreclosure","There would be a commitment."],["Identity achievement","There would be a commitment after exploration."]]],["A teen adopts her parents’ religion and political views without ever questioning them. Which identity status is this?",[["Identity foreclosure","There is commitment without crisis."],["Identity achievement","There would have been a crisis first."],["Identity moratorium","There would be exploration without commitment."],["Identity diffusion","There would be no commitment."]]],["A student takes a gap year to explore different careers and belief systems, and returns still undecided. Which identity status is this?",[["Identity moratorium","There is crisis without commitment."],["Identity diffusion","There would be no exploration."],["Identity foreclosure","There would be a commitment."],["Identity achievement","There would be a commitment."]]],["A woman examined several belief systems, struggled over the choice, and is now firmly committed to the values she chose. Which identity status is this?",[["Identity achievement","A crisis led to commitment."],["Identity foreclosure","The commitment would not follow a crisis."],["Identity moratorium","She would still be undecided."],["Identity diffusion","She would have neither crisis nor commitment."]]],["How do identity diffusion and identity foreclosure differ?",[["Both lack a crisis, but foreclosure includes commitment and diffusion does not","Foreclosure is commitment without crisis."],["Both include crisis, but foreclosure lacks commitment","Neither includes a crisis."],["Diffusion includes commitment, and foreclosure does not","This reverses the two statuses."],["They are the same status","They differ in commitment."]]],["How do identity moratorium and identity achievement differ?",[["Both involve crisis, but only achievement ends in commitment","Moratorium is crisis without commitment, and achievement is crisis leading to commitment."],["Both involve commitment, but only moratorium involves crisis","Moratorium has no commitment."],["Moratorium ends in commitment, and achievement does not","This reverses the two statuses."],["Neither involves crisis","Both involve a crisis."]]],["How do identity foreclosure and identity achievement differ?",[["Both involve commitment, but achievement follows a crisis and foreclosure does not","Foreclosure is commitment without crisis."],["Both involve crisis, but foreclosure lacks commitment","Foreclosure has no crisis."],["Foreclosure follows a crisis, and achievement does not","This reverses the two statuses."],["Neither involves commitment","Both involve commitment."]]],["How do identity diffusion and identity moratorium differ?",[["Both lack commitment, but moratorium involves a crisis and diffusion does not","Moratorium is crisis without commitment."],["Both involve commitment, but diffusion lacks a crisis","Neither has a commitment."],["Diffusion involves a crisis, and moratorium does not","This reverses the two statuses."],["They are the same status","They differ in crisis."]]],["Which row correctly matches a status with its conditions?",[["Foreclosure: commitment without crisis","This is how foreclosure is defined."],["Moratorium: commitment without crisis","Moratorium is crisis without commitment."],["Diffusion: crisis leading to commitment","That is identity achievement."],["Achievement: no commitment, no crisis","That is identity diffusion."]]],["Marcia’s theory describes the development of identity in which group of people?",[["Adolescents and young adults","The theory concerns how they develop identity through exploration and commitment."],["Infants and toddlers","That is the focus of Mahler’s theory."],["Middle-aged adults only","The theory concerns adolescents and young adults."],["Older adults only","The theory does not focus on late adulthood."]]],["A student carefully weighs several occupations before deciding. Which Marcia term describes this period of conscious decision making?",[["Crisis","It is a period of conscious decision making related to identity formation."],["Commitment","This is the personal investment that follows."],["Foreclosure","This is a status with commitment but no crisis."],["Diffusion","This is a status with no crisis and no commitment."]]],["A woman invests herself fully in teaching and in a system of beliefs she chose. Which Marcia term describes this?",[["Commitment","It is a personal investment in an occupation or system of beliefs."],["Crisis","This is the period of conscious decision making."],["Moratorium","This is crisis without commitment."],["Diffusion","This is no crisis and no commitment."]]],["A student says foreclosure means exploring many options without choosing. How should this be evaluated?",[["Incorrect: that describes moratorium, and foreclosure is commitment without crisis","Moratorium is crisis without commitment."],["Correct: foreclosure involves exploration","It involves no crisis."],["Correct: foreclosure means no commitment","It has commitment."],["Incorrect: that describes achievement","Achievement involves a commitment."]]],["A student says identity diffusion is a crisis that leads to commitment. How should this be evaluated?",[["Incorrect: that describes achievement, and diffusion is no commitment and no crisis","Diffusion lacks both."],["Correct: diffusion ends in commitment","Diffusion lacks commitment."],["Correct: diffusion involves exploration","It involves no crisis."],["Incorrect: that describes foreclosure","Foreclosure is commitment without crisis."]]],["A student says identity achievement requires no crisis because the person is committed. How should this be evaluated?",[["Incorrect: achievement is a crisis leading to commitment","Without crisis, commitment would be foreclosure."],["Correct: achievement has commitment without crisis","That describes foreclosure."],["Correct: achievement has neither","That describes diffusion."],["Incorrect: achievement has crisis without commitment","That describes moratorium."]]],["A counselor says a teen who adopted her parents’ career plan without exploring has achieved her identity because she is committed. How should this be evaluated?",[["Incorrect: commitment without crisis is foreclosure, not achievement","Achievement requires a crisis first."],["Correct: any commitment is achievement","A crisis is also required."],["Correct: she is in moratorium","Moratorium has no commitment."],["Incorrect: she is in diffusion","Diffusion has no commitment."]]],["A teen begins with no exploration or commitment, then explores several paths, and finally commits to one. Which sequence of statuses does she pass through?",[["Diffusion, then moratorium, then achievement","No crisis or commitment, then crisis without commitment, then crisis leading to commitment."],["Foreclosure, then diffusion, then moratorium","This does not describe the path."],["Achievement, then moratorium, then diffusion","This reverses the path."],["Moratorium, then foreclosure, then diffusion","This does not describe the path."]]]]},{"id":12,"lec":2,"t":"Developmental Milestones, Tasks, Issues, and Challenges","q":[["Which term refers to specific, observable, and measurable achievements or behaviors that indicate a person’s progress at a particular age or stage?",[["Developmental milestone","It marks progress that can be observed and measured."],["Developmental task","This is an age-related goal individuals are expected to master."],["Developmental issue","This is a condition that interferes with or delays typical development."],["Developmental challenge","This is a normal difficulty or transition faced during development."]]],["Which term refers to age-related goals individuals are expected to master at different life stages to achieve adaptation, social approval, and future growth?",[["Developmental task","It is the expected goal for a life stage."],["Developmental milestone","This is a specific, observable, measurable achievement."],["Developmental issue","This is a condition that interferes with development."],["Developmental challenge","This is a normal obstacle faced while pursuing tasks."]]],["Which term refers to clinical, neurological, biological, or environmental conditions that interfere with or delay typical growth and development?",[["Developmental issue","It is a condition that interferes with typical development."],["Developmental challenge","This is a normal difficulty, not a condition that interferes."],["Developmental task","This is an expected goal for a life stage."],["Developmental milestone","This is a measurable sign of progress."]]],["Which term refers to normal difficulties, transitions, or obstacles people experience while achieving expected developmental tasks and milestones?",[["Developmental challenge","These are normal obstacles along the way."],["Developmental issue","This is a condition that interferes with or delays development."],["Developmental task","This is the expected goal itself."],["Developmental milestone","This is a measurable sign of progress."]]],["A 12-month-old takes her first independent steps. What is this?",[["A developmental milestone","It is a specific, observable, and measurable achievement at a particular age."],["A developmental task","A task is a broader age-related goal to master."],["A developmental issue","Nothing here interferes with typical development."],["A developmental challenge","Nothing here is a difficulty or obstacle."]]],["School-age children are expected to learn academic skills and get along with peers so they can adapt and gain social approval. What is this?",[["A developmental task","It is an age-related goal expected for a life stage."],["A developmental milestone","A milestone is a specific, measurable achievement."],["A developmental issue","This is not a condition interfering with development."],["A developmental challenge","This is a normal difficulty, not the expected goal."]]],["A child with a neurological condition shows delayed speech and motor development. What is this?",[["A developmental issue","It is a neurological condition that delays typical development."],["A developmental challenge","This is a normal difficulty, not a condition that interferes."],["A developmental milestone","A milestone is a measurable sign of progress."],["A developmental task","A task is an expected goal."]]],["A 15-year-old finds it hard to adjust to the normal transition into high school. What is this?",[["A developmental challenge","It is a normal difficulty or transition during development."],["A developmental issue","This would be a condition that interferes with development."],["A developmental milestone","A milestone is a measurable achievement."],["A developmental task","A task is an expected goal rather than the difficulty."]]],["A 2-year-old begins combining two words, as expected for her age. What is this?",[["A developmental milestone","It is an observable, measurable behavior at a particular age."],["A developmental task","A task is a broader goal to master."],["A developmental issue","Nothing here interferes with development."],["A developmental challenge","This is not an obstacle."]]],["Young adults are expected to establish a career and intimate relationships to adapt successfully and gain social approval. What is this?",[["A developmental task","It is an age-related goal for successful adaptation and growth."],["A developmental milestone","A milestone is specific and measurable."],["A developmental issue","This is not a condition that interferes with development."],["A developmental challenge","This is the difficulty experienced while pursuing tasks."]]],["A baby’s prenatal exposure to alcohol interferes with her growth and brain development. What is this?",[["A developmental issue","It is an environmental condition that interferes with typical development."],["A developmental challenge","This is a normal difficulty, not a harmful condition."],["A developmental milestone","This is a measurable sign of progress."],["A developmental task","This is an expected goal."]]],["A retiree struggles with the normal transition into retirement but gradually adjusts. What is this?",[["A developmental challenge","It is a normal transition or obstacle experienced in a life stage."],["A developmental issue","This would be a condition that interferes with development."],["A developmental milestone","This is a measurable achievement."],["A developmental task","This is the expected goal, not the difficulty."]]],["How does a developmental milestone differ from a developmental task?",[["A milestone is a specific, measurable achievement at an age, and a task is a broader age-related goal to master","One is a sign of progress, and the other is an expected goal."],["A milestone is a goal to master for social approval, and a task is a measurable behavior","This reverses the two terms."],["A milestone is a condition that delays development, and a task is a normal obstacle","Those describe an issue and a challenge."],["They mean the same thing","They are distinct terms."]]],["How does a developmental issue differ from a developmental challenge?",[["An issue is a condition that interferes with or delays typical development, and a challenge is a normal difficulty or transition","One is a condition, and the other is a normal obstacle."],["An issue is a normal transition, and a challenge is a condition that delays development","This reverses the two terms."],["Both are measurable achievements","Those are milestones."],["Both are expected age-related goals","Those are tasks."]]],["How does a developmental task differ from a developmental challenge?",[["A task is an expected goal to master, and a challenge is a normal difficulty experienced while working toward it","The challenge is the obstacle along the way to the task."],["A task is a normal difficulty, and a challenge is the expected goal","This reverses the two terms."],["A task is a clinical condition, and a challenge is a milestone","Neither term describes these."],["They mean the same thing","They are distinct terms."]]],["How does a developmental milestone differ from a developmental issue?",[["A milestone indicates progress in development, and an issue is a condition that interferes with or delays it","One shows typical progress, and the other disrupts it."],["A milestone is a condition that delays development, and an issue shows progress","This reverses the two terms."],["Both are normal difficulties","Those are challenges."],["Both are expected goals","Those are tasks."]]],["Which is the best example of a developmental milestone?",[["Smiling socially at about 2 months","It is specific, observable, and measurable."],["Coping with a parent’s divorce","This is a difficulty, which is a challenge."],["A hearing impairment that delays language","This is a condition that interferes, which is an issue."],["Building friendships expected of school-age children","This is an age-related goal, which is a task."]]],["Which is the best example of a developmental task?",[["Developing a sense of identity as expected during adolescence","It is an age-related goal for adaptation and growth."],["Taking first steps at 12 months","This is a measurable milestone."],["A genetic condition that delays growth","This is an issue."],["Feeling stressed during a normal transition","This is a challenge."]]],["Which is the best example of a developmental issue?",[["Malnutrition that delays a child’s growth","It is a biological or environmental condition that interferes with typical development."],["Walking independently at 12 months","This is a milestone."],["Adjusting to a new school","This is a challenge."],["Learning to read in school","This is a task."]]],["Which is the best example of a developmental challenge?",[["A new parent struggling with the normal transition to parenthood","It is a normal difficulty experienced during a life-stage transition."],["A neurological condition delaying speech","This is an issue."],["Saying a first word at about 12 months","This is a milestone."],["Mastering skills expected in school-age years","This is a task."]]],["A student says a developmental issue is any normal difficulty experienced while learning developmental tasks. How should this be evaluated?",[["Incorrect: that describes a challenge, and an issue is a condition that interferes with or delays typical development","Issues are clinical, neurological, biological, or environmental conditions."],["Correct: issues are normal difficulties","Normal difficulties are challenges."],["Correct: issues are measurable achievements","Those are milestones."],["Incorrect: issues are expected age-related goals","Those are tasks."]]],["A student says developmental milestones are age-related goals expected for successful adaptation and social approval. How should this be evaluated?",[["Incorrect: that describes tasks, and milestones are specific, observable, measurable achievements","A task is the goal, and a milestone is a measurable sign of progress."],["Correct: milestones are expected goals","Expected goals are tasks."],["Correct: milestones are normal obstacles","Those are challenges."],["Incorrect: milestones are conditions that delay development","Those are issues."]]],["A student says a developmental challenge is a condition that delays typical development. How should this be evaluated?",[["Incorrect: that describes an issue, and a challenge is a normal difficulty, transition, or obstacle","Challenges occur while learning tasks and milestones."],["Correct: challenges are delaying conditions","Delaying conditions are issues."],["Correct: challenges are measurable achievements","Those are milestones."],["Incorrect: challenges are expected goals","Those are tasks."]]],["A counselor says a child’s temporary struggle adjusting to a new school is a developmental issue requiring clinical intervention. How should this be evaluated?",[["Incorrect: a normal transition is a developmental challenge, whereas an issue is a condition that interferes with development","Adjustment to a new school is a normal obstacle."],["Correct: any struggle is an issue","Issues are conditions that interfere with or delay development."],["Correct: it is a developmental milestone","A milestone is a measurable achievement."],["Incorrect: it is a developmental task","A task is an expected goal."]]],["Toddlers are expected to learn to control their bladder and bowels so they can adapt and gain social approval. What is this?",[["A developmental task","It is an age-related goal expected for a life stage."],["A developmental milestone","A milestone is a specific, measurable achievement."],["A developmental issue","This is not a condition interfering with development."],["A developmental challenge","This is a normal difficulty, not the expected goal."]]]]},{"id":13,"lec":2,"t":"Lecture 2 Comprehensive Review","q":[["A boy’s father is promoted and works abroad. The boy never visits his father’s office, but his family’s routines change. Which system is the father’s workplace for the boy?",[["Exosystem","He is not an active participant, yet events there affect his setting."],["Microsystem","This is a setting he takes part in directly."],["Mesosystem","This links settings in which he participates."],["Macrosystem","This is the economic and political system and dominant beliefs."]]],["A child bounces back from setbacks and keeps trying until she succeeds. Which person characteristic does this show?",[["Dispositions","Temperament, motivation, and persistence."],["Demand features","Age, gender, skin color, physical disability, and body type."],["Resources","Cognitive, emotional, physical, psychosocial, material, and social resources."],["Time","Change in the person and the systems over the years."]]],["A teenager’s part-time job conflicts with her school schedule, and the two settings keep affecting each other. Which system does this relationship represent?",[["Mesosystem","It is the interrelation among settings in which she actively participates."],["Exosystem","She is an active participant in both settings."],["Macrosystem","This is the economic and political system and beliefs."],["Microsystem","This is a single setting, not the relationship between settings."]]],["A government’s education policy and the culture’s beliefs about schooling shape how every school operates. Which system is this?",[["Macrosystem","It includes economic and political systems and dominant beliefs and ideologies."],["Microsystem","This is a direct setting such as the family."],["Exosystem","This is a setting that affects the person indirectly."],["Mesosystem","This is the link among settings the person participates in."]]],["A student says the microsystem is the broadest level of Bronfenbrenner’s context. How should this be evaluated?",[["Incorrect: the microsystem is the setting the person takes part in directly, and the macrosystem covers the economic and political system and beliefs","The macrosystem is the broad cultural level."],["Correct: the microsystem includes the economic and political system","That belongs to the macrosystem."],["Correct: the microsystem excludes family","Family is part of the microsystem."],["Incorrect: the microsystem is the same as time","Time is a separate element."]]],["A frightened toddler runs to her mother for comfort, then returns to play. Which assumption of Bowlby’s theory does this illustrate?",[["The first: a responsive, accessible caregiver creates a secure base","The child can explore because the caregiver is a reliable base."],["The second: the bond becomes a mental working model","That concerns later friendships and love relationships."],["Maternal deprivation","That concerns lacking a warm, continuous relationship."],["Detachment","This is a stage of separation anxiety."]]],["An adult’s relationships follow patterns she learned from her bond with her caregiver in infancy. Which Bowlby concept is this?",[["The mental working model","The early bond serves as the model for later relationships."],["Monotropy","This is the need to attach to one main figure."],["Protest","This is the first stage of separation anxiety."],["The secure base","This is what a responsive caregiver provides."]]],["A baby in a long hospital stay first cries and resists the nurses, later becomes quiet and listless, and finally is unresponsive to everyone. Which order of stages is this?",[["Protest, despair, detachment","This is the sequence of separation anxiety stages."],["Despair, protest, detachment","The first two are swapped."],["Protest, detachment, despair","The last two are swapped."],["Detachment, despair, protest","This reverses the sequence."]]],["Which statement best describes monotropy?",[["A child’s inborn need to attach to one main attachment figure","This is Bowlby’s concept."],["A child’s need to attach to many figures equally","Monotropy concerns one main figure."],["A caregiver’s absence harming development","That is the maternal deprivation hypothesis."],["A bond serving as a model for later relationships","That is the mental working model."]]],["A student says the stages of separation anxiety are protest, detachment, and despair. How should this be evaluated?",[["Incorrect: the order is protest, despair, detachment","Detachment is the final stage."],["Correct: the order is protest, detachment, despair","Despair comes before detachment."],["Correct: the first stage is despair","Protest is the first stage."],["Incorrect: there are only two stages","There are three."]]],["A boy shares his lunch only because he is afraid of getting detention. Which Kohlberg stage is this?",[["Stage 1: avoidance of punishment","He acts to avoid punishment."],["Stage 2: self-interest or reciprocity","This would be for personal reward."],["Stage 3: good boy, good girl","This would be for social approval."],["Stage 4: law and order","This would be for respect for authority."]]],["An employee follows every workplace rule because obeying authority keeps the organization running smoothly. Which Kohlberg stage is this?",[["Stage 4: law and order","Reasoning is based on obeying law and respecting authority to maintain order."],["Stage 3: good boy, good girl","This is about social approval."],["Stage 5: well-being over laws","This allows laws to change for the greater good."],["Stage 2: self-interest or reciprocity","This is about personal benefit."]]],["An activist breaks an unjust law, guided by a self-chosen principle of justice that she believes applies to everyone. Which Kohlberg stage is this?",[["Stage 6: ethical universal principles","Reasoning rests on abstract, self-chosen principles that apply universally."],["Stage 5: well-being over laws","This rests on social contracts and the greater good."],["Stage 4: law and order","This rests on obeying the law."],["Stage 3: good boy, good girl","This rests on approval from others."]]],["A 30-year-old makes moral decisions mostly by considering what others will think of her. Which Kohlberg level is this?",[["Conventional","It is other-centered, asking what others will think."],["Preconventional","This is self-centered."],["Postconventional","This is value- and principle-oriented."],["Prepostconventional","This is not a Kohlberg level."]]],["A student says Stage 2 is conventional because it involves exchanges with other people. How should this be evaluated?",[["Incorrect: Stage 2 is preconventional because it rests on self-interest or reward","The reciprocity is for personal benefit."],["Correct: Stage 2 is conventional","It belongs to the first level."],["Correct: Stage 2 is postconventional","That level is principle-oriented."],["Incorrect: Stage 2 is based on punishment","That is Stage 1."]]],["An infant is distressed when her mother leaves and greets her enthusiastically on return. Which attachment style is this?",[["Secure","Distressed when separated, enthusiastic when reunited."],["Anxious-avoidant","This infant would stay calm and ignore the caregiver."],["Anxious-resistant","This infant would seek contact but reject soothing."],["Disorganized-disoriented","This infant would show contradictory behavior."]]],["An infant stays calm when her mother leaves and avoids her when she returns. Which attachment style is this?",[["Anxious-avoidant","Calm when separated and avoids the caregiver on reunion."],["Secure","A secure infant is distressed and enthusiastic."],["Anxious-resistant","This infant would be distressed and reject soothing."],["Disorganized-disoriented","This infant would show contradictory behavior."]]],["A mother alternates unpredictably between affection and shouting at her baby. Which attachment style is most likely?",[["Anxious-resistant","It develops from inconsistent caring from parents."],["Secure","It develops with reliable care."],["Anxious-avoidant","It develops when the caregiver does not always provide needs."],["Disorganized-disoriented","It is most prevalent with insensitive, intrusive, or abusive mothers."]]],["An infant approaches the stranger for closeness, then shows fear when her mother returns. Which attachment style is this?",[["Disorganized-disoriented","Contradictory or misdirected behavior."],["Anxious-resistant","This infant would seek contact but reject soothing."],["Anxious-avoidant","This infant would ignore the caregiver."],["Secure","This infant would be enthusiastic and comforted."]]],["A student says the Strange Situation evaluates a child’s moral reasoning. How should this be evaluated?",[["Incorrect: it evaluates an infant’s attachment style through brief separations and reunions with a caregiver","This is Ainsworth’s procedure."],["Correct: it evaluates moral reasoning","That is Kohlberg’s area."],["Correct: it evaluates identity status","That is Marcia’s area."],["Incorrect: it evaluates separation-individuation","That is Mahler’s area."]]],["A 3-week-old’s needs are met automatically within her mother’s all-powerful orbit. Which Mahler phase is this?",[["Normal autism","Birth to 3 or 4 weeks, with subtle narcissism and omnipotence."],["Normal symbiosis","This is when the infant acknowledges the mother as source of need-satisfaction."],["Practicing","This is when the child distinguishes her body from her mother’s."],["Rapprochement","This is when the child wants to be back with her mother."]]],["A 9-month-old is curious about strangers while breaking away bodily from her mother. Which Mahler substage and judgment fit?",[["Differentiation, psychologically healthy","Curiosity about strangers is healthy in this substage."],["Differentiation, psychologically unhealthy","Fear of strangers would be unhealthy."],["Practicing, psychologically healthy","Practicing is the next substage."],["Rapprochement, psychologically unhealthy","This is a later substage."]]],["A 20-month-old, after exploring, keeps returning to her mother and wants to be close again. Which Mahler substage is this?",[["Rapprochement","About 16 to 25 months, the desire to bring herself and her mother back together."],["Practicing","This is easy distinguishing of body from mother’s."],["Differentiation","This is the first bodily breaking away."],["Libidinal object constancy","This is the inner representation of mother in the third year."]]],["A 3-year-old tolerates being separated from her mother because she carries an inner image of her. Which Mahler substage is this?",[["Libidinal object constancy","Third year of life: an inner representation allows separation."],["Rapprochement","This is the earlier desire to reunite."],["Practicing","This is earlier exploration."],["Normal symbiosis","This is in early infancy."]]],["A student says the practicing substage is when the child first acknowledges her mother as the source of need-satisfaction. How should this be evaluated?",[["Incorrect: that happens in normal symbiosis, and practicing is when the child easily distinguishes her body from her mother’s","They are separate phases."],["Correct: practicing is when the mother is first acknowledged","That is normal symbiosis."],["Correct: practicing is the newborn phase","That is normal autism."],["Incorrect: practicing is the third year","That is object constancy."]]],["A student chose nursing because her mother is a nurse, and she has never considered other fields. Which Marcia status is this?",[["Identity foreclosure","Commitment without crisis."],["Identity diffusion","No commitment and no crisis."],["Identity moratorium","Crisis without commitment."],["Identity achievement","Crisis leading to commitment."]]],["A student keeps exploring different majors and hobbies but has not committed to any. Which Marcia status is this?",[["Identity moratorium","Crisis without commitment."],["Identity diffusion","No crisis and no commitment."],["Identity foreclosure","Commitment without crisis."],["Identity achievement","Crisis leading to commitment."]]],["A man tried several careers, reflected on his values, and is now committed to teaching. Which Marcia status is this?",[["Identity achievement","Crisis leading to commitment."],["Identity moratorium","There would be no commitment yet."],["Identity foreclosure","There would be no crisis."],["Identity diffusion","There would be no crisis or commitment."]]],["A young adult has no plans, no strong values, and has not explored options. Which Marcia status is this?",[["Identity diffusion","No commitment and no crisis."],["Identity foreclosure","There would be a commitment."],["Identity moratorium","There would be exploration."],["Identity achievement","There would be a commitment after exploration."]]],["A student says a crisis in Marcia’s theory is an emotional breakdown. How should this be evaluated?",[["Incorrect: a crisis is a period of conscious decision making related to identity formation","It is the exploration part of identity development."],["Correct: a crisis is an emotional breakdown","Marcia uses the term for decision making."],["Correct: a crisis is a personal investment in beliefs","That is commitment."],["Incorrect: a crisis is a status","It is one of the two factors, along with commitment."]]],["A 10-month-old pulls herself up to stand. What is this?",[["A developmental milestone","It is an observable, measurable achievement at an age."],["A developmental task","A task is a broader goal to master."],["A developmental issue","Nothing interferes with development here."],["A developmental challenge","Nothing here is a difficulty."]]],["Adolescents are expected to develop a sense of identity so they can adapt and gain social approval. What is this?",[["A developmental task","It is an age-related goal for a life stage."],["A developmental milestone","A milestone is a specific, measurable achievement."],["A developmental issue","This is a condition interfering with development."],["A developmental challenge","This is a normal difficulty."]]],["A child with a biological condition shows delayed motor development. What is this?",[["A developmental issue","It is a biological condition that interferes with typical development."],["A developmental challenge","This is a normal difficulty."],["A developmental milestone","This is a measurable sign of progress."],["A developmental task","This is an expected goal."]]],["A new parent struggles with the normal transition to parenthood but gradually adjusts. What is this?",[["A developmental challenge","It is a normal difficulty or transition during a life stage."],["A developmental issue","This is a condition that interferes with development."],["A developmental milestone","This is a measurable achievement."],["A developmental task","This is the expected goal itself."]]],["A student says developmental tasks and developmental milestones are the same thing. How should this be evaluated?",[["Incorrect: a milestone is a specific, measurable achievement, and a task is an age-related goal to master","They are distinct concepts."],["Correct: both are normal obstacles","Those are challenges."],["Correct: both are conditions that delay development","Those are issues."],["Incorrect: both are theories","They are concepts, not theories."]]],["A girl who uses a wheelchair is approached by others differently than her classmates. Which person characteristic of Bronfenbrenner’s model is at work?",[["Demand features","Physical disability and other visible traits can invite or discourage interactions."],["Dispositions","These are temperament, motivation, and persistence."],["Resources","These are assets such as material and social resources."],["Process","This is the interaction itself."]]],["Which pairing of Bronfenbrenner’s system and example is correct?",[["Mesosystem: the link between a teen’s home and school","It is the interrelation among settings she takes part in."],["Exosystem: the teen’s own classroom","She takes part in it directly, so it is a microsystem."],["Macrosystem: the teen’s close friendship group","A friendship group is part of the microsystem."],["Microsystem: the national economy","The economic system belongs to the macrosystem."]]],["After three days apart from his mother, a toddler stops crying, withdraws, and shows little interest in play. Which stage of Bowlby’s separation anxiety is this?",[["Despair","Infants become quiet, sad, passive, listless, and apathetic."],["Protest","This is crying, resisting soothing, and searching."],["Detachment","This is emotional detachment from everyone, including the caregiver."],["Secure base","This is what a responsive caregiver provides."]]],["How do the contributions of Bowlby and Ainsworth differ?",[["Bowlby proposed that attachment is pre-programmed for survival, and Ainsworth studied attachment styles with the Strange Situation","One is the general theory, and the other classified styles."],["Bowlby studied attachment styles, and Ainsworth proposed the separation anxiety stages","This swaps their contributions."],["Both studied moral reasoning","That is Kohlberg’s area."],["Both proposed stages of separation-individuation","That is Mahler’s theory."]]],["A teenager refrains from cheating because his friends and family would disapprove. Which Kohlberg stage and level fit?",[["Stage 3, conventional","Reasoning guided by social approval and relationships is conventional."],["Stage 1, preconventional","This would be about avoiding punishment."],["Stage 5, postconventional","This would be about social contracts and the greater good."],["Stage 2, preconventional","This would be about personal reward."]]],["Which row correctly matches a Kohlberg level with its orientation?",[["Conventional: other-centered, asking what others will think","This describes Stages 3 and 4."],["Preconventional: other-centered","The preconventional level is self-centered."],["Postconventional: self-centered","This level is value- and principle-oriented."],["Conventional: value- and principle-oriented","That describes the postconventional level."]]],["An infant is distressed at separation, seeks contact on reunion, but rejects soothing, and her caregiver is unpredictably loving and harsh. Which attachment style and origin fit?",[["Anxious-resistant, from inconsistent caring","This style develops from inconsistent caring from parents."],["Anxious-avoidant, from inconsistent response to needs","This infant would stay calm and ignore the caregiver."],["Secure, from responsive care","This infant would accept comfort."],["Disorganized-disoriented, from abusive care","This infant would show contradictory or fearful behavior."]]],["Which attachment style is associated with a lack of ability to engage in effective play and exploration?",[["Anxious-avoidant","These infants lack effective play and exploration, unlike secure infants."],["Secure","This style provides the foundation for play and exploration."],["Anxious-resistant","The notes do not link this style to lack of play."],["Disorganized-disoriented","The notes describe contradictory behavior for this style."]]],["A 6-week-old acknowledges her mother as the source of need-satisfaction, though other people are only pre-objects. Which Mahler phase is this?",[["Normal symbiosis","About 4 to 5 weeks to 4 to 5 months, though not true symbiosis."],["Normal autism","This is birth to 3 or 4 weeks."],["Differentiation","This begins around 5 months."],["Rapprochement","This is about 16 to 25 months."]]],["Which row correctly matches a Mahler substage with its age and feature?",[["Practicing: 7 to 10 months to 16 months, easily distinguishing body from mother’s","This is how the notes describe the substage."],["Differentiation: 16 to 25 months, bringing mother and child back together","That describes rapprochement."],["Rapprochement: 5 to 7 months, bodily breaking away","That describes differentiation."],["Libidinal object constancy: first month, omnipotence","That describes normal autism."]]],["Which two Marcia statuses lack commitment?",[["Identity diffusion and identity moratorium","Diffusion has no commitment and no crisis, and moratorium has crisis without commitment."],["Identity foreclosure and identity achievement","Both involve commitment."],["Identity diffusion and identity foreclosure","Foreclosure involves commitment."],["Identity moratorium and identity achievement","Achievement involves commitment."]]],["How does Marcia’s approach to identity differ from Erikson’s identity stage?",[["Marcia classifies identity by exploration and commitment, and Erikson frames it as Identity vs Identity Confusion with fidelity as the ego strength","One gives statuses, and the other gives a stage conflict."],["Marcia’s theory is about infants, and Erikson’s is about adults","Both concern adolescence and identity."],["Marcia’s statuses are Erikson’s ego strengths","They are separate concepts."],["They are the same theory","They are different theories."]]],["A child with a genetic condition has delayed growth. What is this?",[["A developmental issue","It is a biological condition that interferes with typical development."],["A developmental challenge","This is a normal difficulty."],["A developmental milestone","This is a measurable sign of progress."],["A developmental task","This is an expected goal."]]],["A 6-year-old learns to share and cooperate with classmates, as expected for her age to gain approval. What is this?",[["A developmental task","It is an age-related goal for adaptation and social approval."],["A developmental milestone","This is a specific, measurable achievement."],["A developmental issue","This is a condition interfering with development."],["A developmental challenge","This is a normal difficulty, not the expected goal."]]],["A teen feels stressed while adjusting to the normal transition to college. What is this?",[["A developmental challenge","It is a normal difficulty or transition."],["A developmental issue","This is a condition that interferes with development."],["A developmental milestone","This is a measurable achievement."],["A developmental task","This is the expected goal."]]]]},{"id":14,"lec":3,"t":"Prenatal Development - Conception Basics","q":[["A biology student describes the rupture of a mature follicle in an ovary and the release of its ovum. Which process is this?",[["Ovulation","It is the rupture of a mature follicle in either ovary and the expulsion of its ovum."],["Fertilization","This is when a sperm and an ovum combine, which happens after the ovum is released."],["Ejaculation","This releases sperm in semen, and it is part of the male reproductive process."],["Cell division","This is mitosis in the zygote, which comes after fertilization."]]],["Where are sperm produced, and about how many are made each day?",[["In the testes, several hundred million a day","The testes are the reproductive glands of a mature male, producing sperm in huge numbers."],["In the testes, one a month","One cell a month describes ovulation, not sperm production."],["In the cervix, several hundred million a day","The cervix is the opening of the uterus, not a place where sperm are made."],["In the ovaries, one a month","The ovaries release one ovum at ovulation, and they do not produce sperm."]]],["After sperm are deposited in the vagina, which opening of the uterus must they swim through?",[["The cervix","It is the opening of the uterus that sperm try to swim through."],["The testes","These produce sperm and are not part of the female reproductive tract."],["The follicle","This is the structure in the ovary that ruptures at ovulation."],["The ovum","This is the female sex cell, not a passageway."]]],["What are the male and female sex cells involved in reproduction collectively called?",[["Gametes","Sperm and ovum are the male and female gametes."],["Zygotes","A zygote is the single cell that results when two gametes combine."],["Autosomes","These are the 22 pairs of regular body chromosomes."],["Karyotypes","These are standardized visual profiles of a person’s chromosomes."]]],["A sperm and an ovum combine to form a single cell. Which process occurred, and what is the new cell called?",[["Fertilization, which forms a zygote","Fertilization unites sperm and egg into a one-celled organism called a zygote."],["Ovulation, which forms a zygote","Ovulation only releases the ovum from the ovary."],["Fertilization, which forms a gamete","Gametes are the sperm and the ovum that combine, not the result."],["Ovulation, which forms a gamete","Ovulation releases an ovum, which is itself a gamete."]]],["Moments after a sperm unites with an ovum, the result is a one-celled organism carrying genetic material from both parents. What is it called?",[["A zygote","A zygote is a one-celled organism that results from fertilization."],["An ovum","This is the female gamete that combines with the sperm."],["A karyogram","This is a visual profile of chromosomes, not an organism."],["A follicle","This is the structure in the ovary that releases the ovum."]]],["Two separate eggs are fertilized by two different sperm. The babies do not look exactly alike, are different sexes, and have separate placentas. Which twins are these?",[["Dizygotic twins","They come from two eggs and two sperm and are genetically distinct."],["Monozygotic twins","These come from the division of a single zygote and are genetically similar."],["Identical twins","This is another name for monozygotic twins."],["A single zygote","Dizygotic twins start as two separate zygotes."]]],["A single zygote divides after fertilization and results in two babies who are genetically similar. Which twins are these?",[["Monozygotic twins","They result from the division of a single zygote and are genetically similar."],["Dizygotic twins","These come from two eggs fertilized by two different sperm."],["Fraternal twins","Another name for dizygotic twins, who are genetically distinct."],["Two separate placentas only","This describes dizygotic twins rather than naming the type."]]],["What is another name for monozygotic twins?",[["Identical twins","Both terms describe twins that result from the division of a single zygote."],["Dizygotic twins","These come from two separate eggs and two different sperm."],["Multiple births","This is the umbrella term for births with more than one baby."],["Sex-linked twins","This is not a type of twin in the notes."]]],["Which statement correctly contrasts dizygotic and monozygotic twins?",[["Dizygotic twins come from two eggs and two sperm and are genetically distinct, while monozygotic twins come from one zygote and are genetically similar","This is the key difference in origin and genetic similarity."],["Dizygotic twins come from one zygote, while monozygotic twins come from two eggs and two sperm","This reverses the two types."],["Both come from a single zygote","Only monozygotic twins do."],["Both are genetically identical","Only monozygotic twins are genetically similar in this way."]]],["Researchers compare identical twins to help separate genetic influences from environmental influences on personality and mental health. Which method is this?",[["Twin studies","They frequently use monozygotic twins to separate nature from nurture."],["Genetic counseling","This is a service that advises people about genetic conditions."],["Karyotyping","This produces a visual profile of chromosomes."],["Fertilization","This is the process that creates a zygote."]]],["A student counts the regular body chromosome pairs, leaving out the pair that determines sex. How many pairs does she count?",[["22 pairs","These are the autosomes, which are similar in length."],["23 pairs","This is the total, including the sex chromosomes."],["21 pairs","Humans have 22 pairs of autosomes."],["1 pair","This is the number of sex chromosome pairs."]]],["Which pair of chromosomes determines genetic sex?",[["The 23rd pair","These are the sex chromosomes."],["The 1st pair","This is an autosome pair."],["The 22nd pair","This is the last autosome pair."],["All 23 pairs together","Only the 23rd pair determines sex."]]],["A person’s sex chromosomes are XY. What is her or his genetic sex?",[["Genetic male","An XY combination makes an individual a genetic male."],["Genetic female","This is an XX combination."],["Undetermined","The sex chromosome pair determines genetic sex."],["Both male and female","An XY combination corresponds to a genetic male."]]],["Embryos normally start producing which male hormone about 6 to 8 weeks after conception?",[["Testosterone","It is the male hormone that embryos normally begin producing at that time."],["Insulin","This is a hormone for blood sugar, not male sexual development."],["Oxytocin","This is not the hormone described in the notes."],["Estrogen","This is a female hormone, not the male hormone described."]]],["A lab isolates, stains, and arranges a person’s chromosomes by size, shape, and banding pattern under a microscope. What does it produce?",[["A karyotype, shown as a karyogram","It is the standardized visual profile of a person’s chromosomes."],["A zygote","This is a one-celled organism formed at fertilization."],["A genotype","This is genetic makeup, not a visual profile."],["A gamete","This is a sex cell."]]],["Which description fits a karyogram?",[["A standardized visual profile of chromosomes arranged by size, shape, and banding","It is the picture of an individual’s chromosomes."],["A service that explains genetic conditions","That describes genetic counseling."],["A one-celled organism formed at fertilization","That describes a zygote."],["A male hormone produced about 6 to 8 weeks after conception","That describes testosterone."]]],["A couple with a family history of a hereditary condition meets a specialist who helps identify, test for, and explain potential genetic conditions. Which service is this?",[["Genetic counseling","It assists people in identifying, testing for, and explaining genetic conditions that could affect them or their offspring."],["A twin study","This compares twins to separate genetic and environmental effects."],["A karyogram","This is a picture of chromosomes, not a service."],["Fertilization","This is the process that unites sperm and egg."]]],["How many pairs of chromosomes do humans have, and how are they divided?",[["23 pairs: 22 pairs of autosomes and 1 pair of sex chromosomes","This is the complete human chromosome count."],["22 pairs: 21 pairs of autosomes and 1 pair of sex chromosomes","Humans have 22 pairs of autosomes."],["23 pairs: all autosomes","One of the 23 pairs is the sex chromosomes."],["46 pairs: 23 from each parent","Humans have 23 pairs in total, 46 chromosomes."]]],["How do autosomes differ from sex chromosomes?",[["Autosomes are the 22 pairs of regular body chromosomes, and sex chromosomes are the 23rd pair that determines genetic sex","One group is the regular body chromosomes, and the other decides sex."],["Autosomes are the 23rd pair that determines sex, and sex chromosomes are the 22 regular pairs","This reverses the two terms."],["Both are the pair that determines genetic sex","Only the sex chromosomes do."],["They are the same","They are two different groups of chromosomes."]]],["Which sequence correctly shows the order of events?",[["Ovulation, fertilization, zygote","The ovum is released, a sperm unites with it, and a zygote forms."],["Fertilization, ovulation, zygote","An ovum must be released before it can be fertilized."],["Zygote, fertilization, ovulation","This reverses the order."],["Ovulation, zygote, fertilization","A zygote forms only through fertilization."]]],["A student says dizygotic twins are genetically identical because they shared a womb. How should this be evaluated?",[["Incorrect: they come from two eggs and two sperm, so they are genetically distinct","Dizygotic twins are genetically distinct individuals."],["Correct: sharing a womb makes them identical","Genetic similarity comes from the division of a single zygote."],["Correct: they come from a single zygote","Only monozygotic twins do."],["Incorrect: they have no genetic similarity at all","They are genetically distinct, though they come from the same parents."]]],["A student says monozygotic twins come from two eggs fertilized by two different sperm. How should this be evaluated?",[["Incorrect: they result from the division of a single zygote and are genetically similar","This describes monozygotic twins."],["Correct: they are the product of two separate eggs","That describes dizygotic twins."],["Correct: they have separate placentas","Separate placentas are described for dizygotic twins."],["Incorrect: they are not twins","They are twins, called identical twins."]]],["A student says the cervix is where sperm are produced. How should this be evaluated?",[["Incorrect: sperm are produced in the testes, and the cervix is the opening of the uterus that they swim through","This separates the two structures."],["Correct: the cervix produces sperm","The testes produce sperm."],["Correct: the cervix releases the ovum","The ovum is released from a follicle in the ovary at ovulation."],["Incorrect: sperm are produced in the ovaries","The ovaries release ova."]]],["Which term refers to births involving more than one baby, such as twins?",[["Multiple births","This is the umbrella term for twins and similar births."],["Gametes","These are sex cells."],["Karyograms","These are chromosome profiles."],["Zygotes","These are one-celled organisms formed at fertilization."]]]]},{"id":15,"lec":3,"t":"Prenatal Development - Genetics Fundamentals","q":[["Which researcher proposed that products of evolution, such as genes and hormones, interact with environmental factors to guide development?",[["Gilbert Gottlieb","He is associated with the epigenetic principle."],["John Bowlby","He proposed attachment theory."],["Albert Bandura","He proposed social cognitive theory."],["Jean Piaget","He proposed cognitive development theory."]]],["A psychologist argues that genes and hormones interact with environmental factors to guide an individual’s development. Which idea is this?",[["The epigenetic principle","It is Gilbert Gottlieb’s idea about interaction between evolutionary products and environment."],["Passive genotype-environment correlation","This is when children inherit both genes and the environment their family provides."],["Niche picking","This is when people select environments consistent with their genetic tendencies."],["Genetic risk","This is inherited susceptibility passed on by biological parents."]]],["A researcher says development is not controlled solely by genes. Instead, it unfolds through continuous interaction among genes, neural activity, behavior, and environment, and it is flexible and not predetermined. Which view is this?",[["Epigenesis","It sees development as continuous interaction, flexible rather than predetermined."],["Predeterminism","This is the opposite view, in which genes alone control development."],["Reactive correlation","This is when others react to a person’s inherited characteristics."],["Genetic counseling","This is a service for prospective parents."]]],["Which list names the four interacting factors in epigenesis?",[["Genes, neural a

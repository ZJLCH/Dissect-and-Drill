al underpinnings."],["The mechanistic approach","This views humans as machines operated by the environment."]]],["A student says IQ tests measure intelligence by comparing a child’s score with her own earlier scores. How should this be evaluated?",[["Incorrect: IQ tests compare an individual’s performance with standardized norms","The comparison group is the standardized norm."],["Correct: they compare a child only with herself","They compare performance with standardized norms."],["Correct: they measure only motor coordination","They measure intelligence."],["Incorrect: they are used only for newborns","The notes describe them as measures of intelligence in general."]]],["A clinician wants a tool that can assess a child anywhere from 1 month to 3½ years of age. Which tool fits?",[["The Bayley Scales of Infant and Toddler Development","The BSITD assesses children from 1 month to 3½ years."],["The HOME inventory","This measures how the home environment influences cognitive growth."],["The APGAR score","This assesses a newborn at 1 and 5 minutes after birth."],["An IQ test for school-age children","The notes describe the Bayley scales for infants and toddlers."]]],["Which list names the developmental areas covered by the Bayley Scales?",[["Cognitive, language, adaptive behavior, motor, and socio-emotional","These are the five areas."],["Cognitive, language, physical, motor, and moral","Moral development is not one of the five areas."],["Language, motor, temperament, attachment, and emotional","Temperament and attachment are not Bayley areas."],["Sensory, motor, adaptive, language, and personality","Sensory and personality are not listed areas."]]],["A Bayley item checks whether a toddler can think through a problem and use mental processes to find a hidden toy. Which developmental area is this?",[["Cognitive","It involves thinking and mental processes."],["Language","This involves communication and understanding language."],["Motor","This involves movement and physical coordination."],["Adaptive behavior","This involves practical skills and adjustment to the environment."]]],["A Bayley item checks whether a toddler understands simple requests and uses words to communicate. Which developmental area is this?",[["Language","It involves communication and understanding language."],["Cognitive","This involves thinking and mental processes."],["Socio-emotional","This involves social interaction and emotional functioning."],["Motor","This involves movement and physical coordination."]]],["A Bayley item checks whether a toddler can feed herself and adjust to daily routines. Which developmental area is this?",[["Adaptive behavior","It involves practical skills and adjustment to the environment."],["Motor","This involves movement and physical coordination."],["Language","This involves communication."],["Cognitive","This involves thinking and mental processes."]]],["A Bayley item checks whether a toddler can reach, grasp, and coordinate her movements. Which developmental area is this?",[["Motor","It involves movement and physical coordination."],["Adaptive behavior","This involves practical skills and adjustment to the environment."],["Socio-emotional","This involves social interaction and emotional functioning."],["Language","This involves communication."]]],["A Bayley item checks how a toddler responds to other people and shows her feelings. Which developmental area is this?",[["Socio-emotional","It involves social interaction and emotional functioning."],["Cognitive","This involves thinking and mental processes."],["Motor","This involves movement and physical coordination."],["Adaptive behavior","This involves practical skills."]]],["Researchers observe a home to measure how the environment influences a child’s cognitive growth. Which measure are they using?",[["HOME (Home Observation for Measurement of the Environment)","It measures how the home environment influences cognitive growth."],["The Bayley Scales","These assess a child’s development, not the home."],["The APGAR score","This assesses a newborn’s condition."],["An IQ test","This compares performance with standardized norms."]]],["A mother quickly and consistently responds to her baby’s cries and behaviors. Which HOME feature is she showing?",[["Parental responsiveness","It is the extent to which parents respond to a child’s needs and behaviors."],["Educational playthings","These are toys and materials that provide learning opportunities."],["Symbols","These are intentional representations of reality."],["Pictorial competence","This is the ability to understand pictures."]]],["A household has blocks, books, and puzzles that give a toddler many opportunities to learn. Which HOME feature does this show?",[["Educational playthings","They are toys and materials in the home that provide learning opportunities."],["Parental responsiveness","This is how much parents respond to a child’s needs."],["Scale error","This is a momentary misperception of the relative sizes of objects."],["Habituation","This is reduced responsiveness to a familiar stimulus."]]],["A toddler uses a banana as a pretend telephone, intentionally representing something in reality. What is the banana an example of?",[["A symbol","Symbols are intentional representations of reality."],["A scale error","This is a momentary misperception of relative sizes."],["A holophrase","This is a single word used to express a complete thought."],["Dishabituation","This is increased responsiveness to a new stimulus."]]],["A toddler pats a photograph of a dog and says “woof,” showing she understands what the picture means. Which ability is this?",[["Pictorial competence","It is the ability to understand the nature and meaning of pictures."],["Scale error","This is a misperception of relative sizes."],["Habituation","This is reduced responsiveness to a familiar stimulus."],["Telegraphic speech","This is an early form of sentence use with a few essential words."]]],["A toddler tries to climb into a tiny toy car and sit down in it, momentarily misjudging the sizes of the objects. What is this called?",[["A scale error","It is a momentary misperception of the relative sizes of objects."],["Pictorial competence","This is understanding the meaning of pictures."],["Dishabituation","This is increased responsiveness to a new stimulus."],["A holophrase","This is a single word that expresses a complete thought."]]],["An infant stares at a mobile at first but gradually looks at it less as it becomes familiar. What is this called?",[["Habituation","It is reduced responsiveness to a familiar stimulus, indicating familiarity."],["Dishabituation","This is increased responsiveness after a new stimulus."],["Cooing","This is the repetition of vowel sounds."],["A scale error","This is a misperception of relative sizes."]]],["After an infant stops looking at a familiar mobile, a new mobile is shown and she begins looking again. What is this called?",[["Dishabituation","It is increased responsiveness following the presentation of a new stimulus."],["Habituation","This is reduced responsiveness to a familiar stimulus."],["Babbling","This is the repetition of consonant sounds."],["Pictorial competence","This is understanding pictures."]]],["How do habituation and dishabituation differ?",[["Habituation is reduced responsiveness to a familiar stimulus, and dishabituation is increased responsiveness to a new stimulus","One indicates familiarity, and the other indicates noticing something new."],["Habituation is increased responsiveness to a new stimulus, and dishabituation is reduced responsiveness to a familiar one","This reverses the two."],["Both are reduced responsiveness to a new stimulus","Dishabituation is increased responsiveness."],["They mean the same thing","They are opposite responses."]]],["An infant produces sounds that are not words. Which kind of speech is this?",[["Prelinguistic speech","It is the production of sounds that are not words."],["Linguistic speech","This is verbal expressions intended to convey meaning."],["Telegraphic speech","This is an early form of sentence use."],["A holophrase","This is a single word used to express a complete thought."]]],["Which sequence correctly orders the forms of prelinguistic speech from earliest to latest?",[["Crying, cooing at 6 to 8 weeks, babbling at 6 to 10 months","They emerge in this order."],["Babbling, cooing, crying","This reverses the order."],["Cooing, crying, babbling","Crying is the earliest form."],["Crying, babbling, cooing","Cooing comes before babbling."]]],["A 3-month-old repeats long vowel sounds like “ooo” and “aaah,” while a 9-month-old repeats consonant sounds like “ba-ba-ba.” Which pair of terms describes them?",[["Cooing and babbling","Cooing repeats vowel sounds, and babbling repeats consonant sounds."],["Babbling and cooing","This reverses the two."],["Crying and cooing","Neither child is crying."],["Holophrases and telegraphic speech","These are linguistic speech, not sounds."]]],["A toddler says “up!” to mean “pick me up and put me on the chair.” What is this called?",[["A holophrase","It is a single word used to express a complete thought."],["Telegraphic speech","This uses a few essential words in a sentence."],["Babbling","This is the repetition of consonant sounds."],["Cooing","This is the repetition of vowel sounds."]]],["A toddler says “Mommy go store,” using only the essential words. What is this called?",[["Telegraphic speech","It is an early form of sentence use consisting only of a few essential words."],["A holophrase","This is a single word that expresses a complete thought."],["Babbling","This is the repetition of consonant sounds."],["Crying","This is the earliest form of vocal communication."]]],["How do a holophrase and telegraphic speech differ?",[["A holophrase is a single word expressing a complete thought, while telegraphic speech uses a few essential words as an early sentence","One is a single word, and the other combines a few words."],["A holophrase is a few essential words, while telegraphic speech is a single word","This reverses the two."],["Both are repetitions of vowel sounds","That describes cooing."],["Both are prelinguistic speech","Both are linguistic speech."]]],["A student says babbling is the repetition of vowel sounds that emerges between 6 and 8 weeks of age. How should this be evaluated?",[["Incorrect: that describes cooing, and babbling is the repetition of consonant sounds that emerges between 6 and 10 months","The two forms of speech differ in sounds and timing."],["Correct: babbling is the repetition of vowel sounds","Babbling repeats consonant sounds."],["Correct: babbling emerges at 6 to 8 weeks","Cooing emerges at 6 to 8 weeks."],["Incorrect: babbling is the earliest form of vocal communication","Crying is the earliest form."]]]]},{"id":23,"lec":3,"t":"Infancy & Toddlerhood - Psychosocial Development","q":[["A baby’s subjective response to an experience is linked with changes in her body and behavior. What is this called?",[["An emotion","Emotions are subjective responses to experiences, associated with physiological and behavioral changes."],["A temperament","This is a biologically based tendency to respond to the environment in predictable ways."],["A symbol","This is an intentional representation of reality."],["A holophrase","This is a single word that expresses a complete thought."]]],["Which list names six of the first emotions displayed by a child?",[["Disgust, fear, joy, sadness, anger, and surprise","These are the first emotions listed."],["Pride, guilt, shame, envy, joy, and fear","Pride, guilt, shame, and envy come later in development."],["Joy, fear, jealousy, anger, pride, and surprise","Jealousy and pride are not on the list."],["Disgust, boredom, joy, sadness, anger, and embarrassment","Boredom and embarrassment are not on the list."]]],["Which of the following is not one of the first emotions displayed by a child?",[["Pride","It is not among disgust, fear, joy, sadness, anger, and surprise."],["Joy","This is one of the first emotions."],["Anger","This is one of the first emotions."],["Surprise","This is one of the first emotions."]]],["A baby wrinkles her nose and pushes away a sour food. Which early emotion is she showing?",[["Disgust","It is one of the first emotions displayed by a child."],["Joy","This would show as smiling and laughing."],["Surprise","This would show as wide eyes at something unexpected."],["Sadness","This would show as a downturned face and whimpering."]]],["A baby cries and clings to her mother when an unfamiliar person approaches. Which early emotion is she showing?",[["Fear","It is one of the first emotions displayed by a child."],["Anger","This would show as a red face and protest at a blocked goal."],["Joy","This would show as smiling and laughing."],["Disgust","This would show as a reaction to an unpleasant taste or smell."]]],["A baby smiles and laughs when her father plays peekaboo. Which early emotion is she showing?",[["Joy","It is one of the first emotions displayed by a child."],["Sadness","This would show as a downturned face and whimpering."],["Fear","This would show as crying and clinging."],["Anger","This would show as a red face and protest."]]],["A baby whimpers with a downturned mouth after her mother leaves the room. Which early emotion is she showing?",[["Sadness","It is one of the first emotions displayed by a child."],["Anger","This would show as protest and a red face."],["Surprise","This would show as wide eyes at something unexpected."],["Joy","This would show as smiling."]]],["A baby’s face turns red and she screams when a toy is taken away. Which early emotion is she showing?",[["Anger","It is one of the first emotions displayed by a child."],["Fear","This would show as clinging and crying at a threat."],["Disgust","This would show as a wrinkled nose."],["Sadness","This would show as whimpering and a downturned face."]]],["A baby’s eyes widen and her eyebrows rise when a jack-in-the-box suddenly pops up. Which early emotion is she showing?",[["Surprise","It is one of the first emotions displayed by a child."],["Joy","This would show as smiling and laughing."],["Fear","This would show as crying and clinging."],["Disgust","This would show as a wrinkled nose."]]],["A baby cries in a rhythmic pattern that is not always caused by hunger. Which type of cry is this?",[["The hunger cry","It is a rhythmic cry that is not always associated with hunger."],["The anger cry","This forces excess air through the vocal cords."],["The pain cry","This begins suddenly with loud crying and no moaning."],["The frustration cry","This is two to three drawn-out cries."]]],["A baby’s cry forces excess air through her vocal cords. Which type of cry is this?",[["The anger cry","It is a cry in which excess air is forced through the vocal cords."],["The hunger cry","This is a rhythmic cry that is not always associated with hunger."],["The pain cry","This begins suddenly without preliminary moaning."],["The frustration cry","This is two to three drawn-out cries."]]],["A baby bursts into loud crying without any preliminary moaning, and she sometimes holds her breath afterward. Which type of cry is this?",[["The pain cry","It is a sudden onset of loud crying without preliminary moaning, sometimes followed by breath-holding."],["The hunger cry","This is rhythmic."],["The anger cry","This forces excess air through the vocal cords."],["The frustration cry","This is two to three drawn-out cries without prolonged breath-holding."]]],["A baby lets out two to three drawn-out cries without prolonged breath-holding. Which type of cry is this?",[["The frustration cry","It is two to three drawn-out cries without prolonged breath-holding."],["The pain cry","This is sudden and may be followed by breath-holding."],["The hunger cry","This is rhythmic."],["The anger cry","This forces excess air through the vocal cords."]]],["Which row correctly matches each type of cry with its description?",[["Hunger: rhythmic. Anger: excess air through the vocal cords. Pain: sudden and loud. Frustration: two to three drawn-out cries","This matches each cry to its description."],["Hunger: sudden and loud. Anger: rhythmic. Pain: two to three drawn-out cries. Frustration: excess air through the vocal cords","The descriptions are mismatched."],["Hunger: excess air through the vocal cords. Anger: two to three drawn-out cries. Pain: rhythmic. Frustration: sudden and loud","The descriptions are mismatched."],["Hunger: two to three drawn-out cries. Anger: sudden and loud. Pain: excess air through the vocal cords. Frustration: rhythmic","The descriptions are mismatched."]]],["How does the pain cry differ from the frustration cry?",[["The pain cry begins suddenly and loudly without moaning and may be followed by breath-holding, while the frustration cry is two to three drawn-out cries without prolonged breath-holding","One is sudden and intense, and the other is drawn out and less intense."],["The pain cry is two to three drawn-out cries, while the frustration cry begins suddenly and loudly","This reverses the two."],["Both are rhythmic cries","Only the hunger cry is rhythmic."],["Both force excess air through the vocal cords","Only the anger cry does."]]],["A student says temperament is learned entirely from how parents treat the child. How should this be evaluated?",[["Incorrect: temperament consists of biologically based tendencies to respond to the environment in predictable ways","It has a biological basis."],["Correct: it is learned entirely from parents","It is biologically based."],["Correct: it appears only after age five","The notes describe it as a characteristic disposition from early on."],["Incorrect: it consists of cries and emotions","These are different concepts."]]],["A baby has positive moods, adapts to change, keeps regular routines, accepts new foods, is friendly to strangers, and tolerates frustration. Which temperament is this?",[["Easy temperament","These are its characteristics."],["Slow-to-warm-up temperament","This shows mild reactions and slow adaptation to change."],["Difficult temperament","This is the third major temperament category."],["Behavioral inhibition","This is the degree of caution toward unfamiliar situations."]]],["A baby shows mild reactions, adapts slowly to change, reacts mildly negatively to new things at first, and gradually accepts new experiences. Which temperament is this?",[["Slow-to-warm-up temperament","These are its characteristics."],["Easy temperament","This is marked by quick adaptation and positive moods."],["Difficult temperament","This is the third major temperament category."],["Extraversion","This is an energetic approach to new experiences."]]],["A baby reacts intensely to change, has irregular routines, and takes a long time to accept new situations, which makes her care challenging. Which temperament category is this?",[["Difficult temperament","It is the third of the three major temperament categories."],["Easy temperament","This is marked by adaptability and positive moods."],["Slow-to-warm-up temperament","This is marked by mild reactions rather than intense ones."],["Effortful control","This is the ability to focus attention and control behavior."]]],["Which statement correctly compares the three major temperament categories?",[["Easy babies adapt readily with positive moods, slow-to-warm-up babies react mildly and adapt gradually, and difficult babies are the third category","The three types are easy, slow-to-warm-up, and difficult."],["Easy babies are cautious, and difficult babies adapt readily","This does not match the notes."],["Slow-to-warm-up babies are friendly to strangers, and easy babies adapt slowly","This reverses the descriptions."],["All three adapt equally to change","They differ in how they adapt."]]],["A toddler hangs back and watches before she approaches an unfamiliar toy or person. Which temperament dimension is this?",[["Behavioral inhibition","It is the degree of caution a child shows when approaching unfamiliar objects and situations."],["Extraversion/surgency","This is an energetic, positive approach to new experiences."],["Negative affectivity","This is the tendency to be sad, fearful, easily frustrated, or irritated."],["Effortful control","This is the ability to focus attention and regulate behavior."]]],["A toddler rushes up to a new playmate with a big smile and eagerly tries every new activity. Which temperament dimension is this?",[["Extraversion/surgency","It is the tendency to actively and energetically approach new experiences in a positive emotional manner."],["Behavioral inhibition","This is caution toward unfamiliar situations."],["Negative affectivity","This is a tendency to be sad, fearful, or irritated."],["Effortful control","This is the ability to regulate attention and behavior."]]],["A toddler is easily frustrated, often fearful, and quickly irritated by small changes. Which temperament dimension is this?",[["Negative affectivity","It is the tendency to be sad, fearful, easily frustrated, or irritated."],["Extraversion/surgency","This is a positive and energetic approach to new experiences."],["Behavioral inhibition","This is the degree of caution toward unfamiliar situations."],["Effortful control","This is the ability to focus attention and regulate behavior."]]],["A toddler can pay attention to a story, shift her attention when asked, control her impulses, and calm herself when upset. Which temperament dimension is this?",[["Effortful control (self-regulation)","It is the ability to focus and shift attention, control behavior, plan actions, and regulate emotions."],["Negative affectivity","This is a tendency to be sad, fearful, or irritated."],["Extraversion/surgency","This is an energetic approach to new experiences."],["Behavioral inhibition","This is caution toward unfamiliar objects and situations."]]],["A student says the anger cry is two to three drawn-out cries without prolonged breath-holding. How should this be evaluated?",[["Incorrect: that describes the frustration cry, while the anger cry forces excess air through the vocal cords","The two cries have different descriptions."],["Correct: that describes the anger cry","That describes the frustration cry."],["Correct: the anger cry is a rhythmic cry","That describes the hunger cry."],["Incorrect: that describes the pain cry","The pain cry begins suddenly and loudly."]]]]},{"id":24,"lec":3,"t":"Early Childhood - Growth, Skills, and Safety","q":[["A preschooler refuses to go to bed, takes a long time to fall asleep, and wakes frequently at night. What is this?",[["Sleep pattern problems","Problems may include refusing to go to bed, taking a long time to fall asleep, and frequent night waking."],["Night terrors","This is a sleep disturbance that children often forget once comforted."],["Nightmares","This is a sleep disturbance remembered vividly by the child."],["Sleeptalking","This is talking while asleep."]]],["A 5-year-old gets out of bed in the night and walks around the house while still asleep. Which sleep-related behavior is this?",[["Sleepwalking","It is a sleep-related behavior that may occur during early childhood."],["Sleeptalking","This is talking while asleep."],["Night terrors","This is a sleep disturbance that children often forget once comforted."],["Nightmares","This is a sleep disturbance remembered vividly by the child."]]],["A 4-year-old mumbles full sentences in her sleep, though she never wakes up. What is this?",[["Sleeptalking","It is talking while asleep."],["Sleepwalking","This is walking while still asleep."],["Nightmares","This is a vividly remembered sleep disturbance."],["Night terrors","This is a sleep disturbance forgotten once the child is comforted."]]],["A child cries out in the night, calms down once her father comforts her, and remembers nothing in the morning. Which sleep disturbance is this?",[["Night terrors","They are a less dysfunctional sleep disturbance that children often forget once comforted."],["Nightmares","These are more dysfunctional and are remembered vividly."],["Sleepwalking","This is a sleep-related behavior that involves walking while asleep."],["Sleeptalking","This is talking while asleep."]]],["A child wakes up and describes in detail the frightening dream she just had. Which sleep disturbance is this?",[["Nightmares","They are a more dysfunctional sleep disturbance that is remembered more vividly by the child."],["Night terrors","These are forgotten once the child is comforted."],["Sleepwalking","This is walking while asleep."],["Sleeptalking","This is talking while asleep."]]],["How do night terrors and nightmares differ?",[["Night terrors are less dysfunctional and often forgotten once the child is comforted, while nightmares are more dysfunctional and remembered more vividly","One is forgotten, and the other is remembered."],["Night terrors are more dysfunctional and remembered vividly, while nightmares are forgotten once the child is comforted","This reverses the two."],["Both are forms of sleeptalking","They are sleep disturbances, not sleeptalking."],["Both are always remembered vividly","Only nightmares are remembered vividly."]]],["Which term describes the rapid and profound growth of the brain during the first few years of life?",[["Brain development","It is the rapid and profound growth of the brain in the first few years."],["Systems of action","These are complex combinations of skills."],["Handedness","This is a preference for one hand over the other."],["Gross motor skills","These are coordination of larger muscle groups."]]],["A 4-year-old begins making simple plans and setting goals for a drawing. Which brain regions are showing the most rapid growth at this age?",[["The frontal areas","They show the most rapid growth between ages 3 and 6 and are responsible for planning and goal setting."],["The sensory areas","The notes name the frontal areas for planning and goal setting."],["The motor areas","These are not the regions named for planning."],["The visual areas","These are not the regions named for planning."]]],["Which statement correctly describes the frontal areas of the brain in early childhood?",[["They show the most rapid growth between ages 3 and 6 and are responsible for planning and goal setting","This is the key idea."],["They show the most rapid growth between ages 10 and 12 and are responsible for balance","This does not match the notes."],["They show no growth until adolescence","They grow rapidly from ages 3 to 6."],["They are responsible only for hand coordination","They support planning and goal setting."]]],["A 4-year-old uses her fingers to pick up a tiny bead and string it on a thread. Which skill is she using?",[["Fine motor skills","They are the coordination of small muscles in the hands and fingers for precise movements."],["Gross motor skills","These involve larger muscle groups, such as in running and jumping."],["Systems of action","These are complex combinations of skills."],["Handedness","This is a preference for one hand over the other."]]],["A 5-year-old runs across the playground, jumps over a puddle, and throws a ball. Which skill is she using?",[["Gross motor skills","They are the coordination of larger muscle groups for movements that require balance, strength, and coordination."],["Fine motor skills","These involve the small muscles of the hands and fingers."],["Handedness","This is a preference for one hand over the other."],["Brain development","This is the growth of the brain."]]],["How do fine motor skills differ from gross motor skills?",[["Fine motor skills coordinate small muscles of the hands and fingers for precise movements, while gross motor skills coordinate larger muscle groups for balance, strength, and movement","One is precise and small-scale, and the other is whole-body."],["Fine motor skills coordinate larger muscle groups for running, while gross motor skills coordinate the fingers for writing","This reverses the two."],["Both coordinate only the muscles of the hands","Only fine motor skills do."],["They are the same skill","They are distinct sets of skills."]]],["A toddler combines her ability to grasp with her new ability to walk and carries a toy across the room. What does this show?",[["Systems of action","They are increasingly complex combinations of skills formed by combining existing abilities with new ones."],["Handedness","This is a preference for one hand over the other."],["Fine motor skills","These are small muscle movements of the hands and fingers."],["Malnutrition","This is a health concern from inadequate nutrition."]]],["A 4-year-old consistently picks up her crayon, spoon, and ball with her right hand. What is this called?",[["Handedness","It is a preference for using one hand over the other."],["Systems of action","These are complex combinations of skills."],["Gross motor skills","These are coordination of large muscles."],["Brain development","This is the growth of the brain."]]],["A child’s body weight is above the 95th percentile for her age. What is this classified as?",[["Obesity","Obesity is body weight above the 95th percentile."],["Overweight","This is body weight between the 85th and 95th percentiles."],["Malnutrition","This is a health concern from inadequate nutrition."],["Stunted","This describes children who are shorter than expected for their age."]]],["A child’s body weight is at the 90th percentile for her age. What is this classified as?",[["Overweight","It is body weight between the 85th and 95th percentiles."],["Obesity","This is body weight above the 95th percentile."],["Wasted","This describes children who are thinner than they should be for their height."],["Stunted","This describes children who are shorter than expected for their age."]]],["How do overweight and obesity differ?",[["Overweight is body weight between the 85th and 95th percentiles, while obesity is body weight above the 95th percentile","The difference is how high the weight percentile is."],["Overweight is above the 95th percentile, while obesity is between the 85th and 95th","This reverses the two."],["Overweight is below the 85th percentile, while obesity is above the 95th","Below the 85th percentile is not overweight."],["They both mean body weight below the 85th percentile","Both refer to higher weights."]]],["A health concern results from a child not getting adequate nutrition. What is this called?",[["Malnutrition","It is a health concern resulting from inadequate nutrition."],["Obesity","This is body weight above the 95th percentile."],["Overweight","This is body weight between the 85th and 95th percentiles."],["Handedness","This is a preference for one hand."]]],["A child appears to be of normal weight, but she is shorter than expected for her age and may have cognitive and physical deficiencies. Which condition is this?",[["Stunted","These are children of normal weight who are shorter than expected for their age."],["Wasted","These are children of appropriate height who are thinner than they should be."],["Obese","This is body weight above the 95th percentile."],["Overweight","This is body weight between the 85th and 95th percentiles."]]],["A child is of appropriate height for her age but is thinner than she should be. Which condition is this?",[["Wasted","These are children of appropriate height who are thinner than they should be."],["Stunted","These are children of normal weight who are shorter than expected."],["Obese","This is body weight above the 95th percentile."],["Overweight","This is body weight between the 85th and 95th percentiles."]]],["How do stunted and wasted children differ?",[["Stunted children look of normal weight but are shorter than expected, while wasted children are of appropriate height but thinner than they should be","One is a height problem, and the other is a weight problem."],["Stunted children are thinner than they should be, while wasted children are shorter than expected","This reverses the two."],["Both are above the 95th percentile in weight","That describes obesity."],["They mean the same thing","They are two different forms of malnutrition."]]],["A student says wasted children are shorter than expected for their age. How should this be evaluated?",[["Incorrect: that describes stunted children, while wasted children are of appropriate height but thinner than they should be","The two terms refer to different problems."],["Correct: wasted children are shorter than expected","That describes stunted children."],["Correct: wasted children are above the 95th percentile in weight","That describes obesity."],["Incorrect: wasted children are of normal weight","They are thinner than they should be."]]],["A student says nightmares are forgotten once the child is comforted. How should this be evaluated?",[["Incorrect: that describes night terrors, while nightmares are remembered more vividly by the child","The two sleep disturbances differ in how they are remembered."],["Correct: nightmares are forgotten","That describes night terrors."],["Correct: nightmares are a form of sleepwalking","They are separate sleep disturbances."],["Incorrect: nightmares are less dysfunctional than night terrors","The notes describe nightmares as more dysfunctional."]]],["A student says the frontal areas grow most rapidly between ages 10 and 12. How should this be evaluated?",[["Incorrect: the frontal areas show the most rapid growth between ages 3 and 6","They are responsible for planning and goal setting."],["Correct: they grow most rapidly between ages 10 and 12","The notes place the fastest growth between ages 3 and 6."],["Correct: they do not grow in early childhood","They grow rapidly in early childhood."],["Incorrect: they are responsible for coordinating the fingers","They support planning and goal setting."]]],["A pediatrician finds a child of normal weight who is shorter than expected for her age and has cognitive and physical deficiencies. Which health concern is behind this pattern?",[["Malnutrition","It is a health concern resulting from inadequate nutrition, and stunted children are shorter than expected for their age."],["Obesity","This is body weight above the 95th percentile."],["Handedness","This is a preference for one hand over the other."],["Sleeptalking","This is talking while asleep."]]]]},{"id":25,"lec":3,"t":"Early Childhood - Cognitive Development","q":[["A child attaches the label “dog” to what she sees so that she can find the memory more easily later. Which memory process is this?",[["Encoding","It is attaching a code or label to information so it can be located more easily later."],["Storage","This is retaining information after it has been encoded."],["Retrieval","This is locating and accessing stored information."],["Fast mapping","This is learning the approximate meaning of a word after hearing it once or twice."]]],["A child keeps the memory of her birthday party over the following weeks after it has been encoded. Which memory process is this?",[["Storage","It is the process of retaining information after it has been encoded."],["Encoding","This is attaching a code or label to information."],["Retrieval","This is locating and accessing stored information."],["Context-based understanding","This is inferring a word’s meaning from surrounding words or objects."]]],["A child remembers the name of her teacher when asked, locating the stored information. Which memory process is this?",[["Retrieval","It is the process of locating and accessing stored information."],["Encoding","This is attaching a code or label to information."],["Storage","This is retaining information after it has been encoded."],["Sensory storage","This is a temporary storage that holds information for a short time."]]],["Which sequence correctly orders the memory processes?",[["Encoding, storage, retrieval","Information is labeled, retained, and then accessed."],["Storage, encoding, retrieval","Information must be encoded before it can be stored."],["Retrieval, encoding, storage","Information must be stored before it can be retrieved."],["Encoding, retrieval, storage","Information must be stored before it can be retrieved."]]],["A child glimpses a flashing light and holds the image for just a moment before it fades. Which memory storehouse is this?",[["Sensory storage","It is a temporary storage in which information is held only for a short time."],["Working storage","This is a short-term storehouse for information a person is actively working on."],["Long-term storage","This holds information for long periods with virtually unlimited capacity."],["Retrieval","This is the process of accessing stored information."]]],["A child keeps three instructions in mind while she works through a puzzle. Which memory storehouse is she using?",[["Working storage","It is a short-term storehouse for information a person is actively working on, trying to understand, remember, or think about."],["Sensory storage","This holds information only for a short time without active work."],["Long-term storage","This holds information for long periods."],["Encoding","This is labeling information so it can be located later."]]],["A child remembers the words of a song she learned years ago. Which memory storehouse holds this?",[["Long-term storage","It is a storehouse with virtually unlimited capacity that holds information for long periods of time."],["Working storage","This is a short-term storehouse for information being worked on."],["Sensory storage","This holds information for only a short time."],["Retrieval","This is the process of accessing stored information, not a storehouse."]]],["How do sensory storage, working storage, and long-term storage differ?",[["Sensory storage holds information briefly, working storage holds information a person is actively working on, and long-term storage holds information for long periods with virtually unlimited capacity","Each storehouse differs in duration and purpose."],["Sensory storage has unlimited capacity, working storage holds information briefly, and long-term storage holds information being worked on","The descriptions are mismatched."],["All three hold information for long periods","Only long-term storage does."],["All three are the process of encoding","They are storehouses, not processes."]]],["A 3-year-old hears the word “giraffe” once while looking at a picture and now roughly understands what it means. What is this ability called?",[["Fast mapping","It is learning the approximate meaning of a new word after hearing it only once or twice."],["Rapid word learning","This is grasping a word’s meaning after only a few exposures."],["Context-based understanding","This is inferring a word’s meaning from surrounding words or objects."],["Encoding","This is attaching a label to information."]]],["A preschooler grasps what new words mean after only a few exposures. Which ability is this?",[["Rapid word learning","It is the ability of children to grasp a word’s meaning after only a few exposures."],["Fast mapping","This is learning an approximate meaning after hearing a word once or twice."],["Retrieval","This is locating stored information."],["Working storage","This is a short-term storehouse."]]],["A child hears “Please hand me the spatula” while her mother points to the kitchen tool, and she figures out what “spatula” means. Which ability is this?",[["Context-based understanding","It is the ability to infer a word’s meaning from surrounding words or objects."],["Fast mapping","This is learning an approximate meaning after hearing a word once or twice."],["Long-term storage","This is a storehouse for information."],["Solitary play","This is a child playing alone."]]],["How do fast mapping and rapid word learning differ?",[["Fast mapping is learning the approximate meaning of a word after hearing it once or twice, while rapid word learning is grasping a word’s meaning after only a few exposures","The two differ in the number of exposures needed."],["Fast mapping needs many exposures, while rapid word learning needs one","This reverses the two."],["Both are inferring meaning from surrounding objects","That describes context-based understanding."],["They are the same","They are two distinct terms."]]],["A teacher explains that an activity supports the healthy development of the brain and body and provides the context for much learning. Which activity is this?",[["Play","It supports brain and body development and is the context in which much learning occurs."],["Sleeptalking","This is talking while asleep."],["Encoding","This is attaching a label to information."],["Handedness","This is a preference for one hand."]]],["Which framework describes how children’s social play develops over time?",[["Mildred Parten’s social dimensions of play","It describes the stages of social play, from unoccupied to cooperative."],["Piaget’s stages of cognitive development","This describes how thinking develops."],["Bandura’s four-step model","This describes observational learning."],["Erikson’s psychosocial stages","This describes psychosocial conflicts across the lifespan."]]],["A toddler stands in the middle of the room, not actively playing and not taking part in anything. Which stage of play is this?",[["Unoccupied play","It is a stage in which a child is not actively playing or participating."],["Onlooker play","This is watching others play without participating."],["Solitary play","This is playing alone, unaware of others."],["Parallel play","This is playing side by side without interacting."]]],["A child watches other children build a block tower but does not join in. Which stage of play is this?",[["Onlooker play","It is a stage in which a child watches others play but does not participate."],["Unoccupied play","This is not actively playing or participating."],["Solitary play","This is playing alone."],["Associative play","This is interacting and sharing toys."]]],["A child plays with her own toys in a corner, unaware of the other children nearby. Which stage of play is this?",[["Solitary play","It is a stage in which a child plays alone and is unaware of others nearby."],["Parallel play","Children play side by side but do not interact."],["Onlooker play","The child watches others play."],["Cooperative play","Children work together toward a shared goal."]]],["Two children sit side by side, each stacking similar blocks, without talking or interacting. Which stage of play is this?",[["Parallel play","Children play side by side with similar toys but do not interact."],["Solitary play","The child plays alone and is unaware of others."],["Associative play","Children interact and share toys."],["Cooperative play","Children work together toward a shared goal."]]],["Two children trade crayons and chat while each draws her own picture. Which stage of play is this?",[["Associative play","Children interact and share toys but do not work toward a common goal."],["Parallel play","Children do not interact."],["Cooperative play","Children work together toward a shared goal."],["Solitary play","The child plays alone."]]],["A group of children builds one sandcastle together, with each child taking a role toward the shared goal. Which stage of play is this?",[["Cooperative play","It is the most advanced stage, in which children work together toward a shared goal."],["Associative play","Children interact but do not work toward a common goal."],["Parallel play","Children play side by side without interacting."],["Onlooker play","The child watches others play."]]],["Which sequence correctly orders Parten’s stages from the least social to the most advanced?",[["Unoccupied, onlooker, solitary, parallel, associative, cooperative","The stages move toward greater interaction and shared goals."],["Solitary, unoccupied, onlooker, associative, parallel, cooperative","The first three and the middle two are out of order."],["Cooperative, associative, parallel, solitary, onlooker, unoccupied","This reverses the order."],["Unoccupied, solitary, onlooker, parallel, cooperative, associative","Several stages are out of order."]]],["How do parallel play and associative play differ?",[["In parallel play, children play side by side without interacting, while in associative play they interact and share toys but do not work toward a common goal","The difference is interaction."],["In parallel play, children share toys and interact, while in associative play they play side by side without interacting","This reverses the two."],["Both involve working toward a shared goal","That describes cooperative play."],["Both involve a child playing alone","That describes solitary play."]]],["A student says that in parallel play children interact and share their toys. How should this be evaluated?",[["Incorrect: in parallel play, children play side by side with similar toys but do not interact, whereas sharing and interacting describes associative play","The difference is interaction."],["Correct: parallel play involves sharing toys","That describes associative play."],["Correct: parallel play involves a common goal","That describes cooperative play."],["Incorrect: parallel play is the most advanced stage","Cooperative play is the most advanced stage."]]],["A student says sensory storage holds information for long periods with virtually unlimited capacity. How should this be evaluated?",[["Incorrect: that describes long-term storage, while sensory storage holds information only for a short time","The two storehouses differ in duration and capacity."],["Correct: sensory storage holds information for long periods","That describes long-term storage."],["Correct: sensory storage is where information is actively worked on","That describes working storage."],["Incorrect: sensory storage is the process of retrieval","It is a storehouse, not a retrieval process."]]],["How do onlooker play and solitary play differ?",[["In onlooker play, the child watches others play without participating, while in solitary play the child plays alone and is unaware of others nearby","One involves watching, and the other involves playing alone."],["In onlooker play, the child plays alone, while in solitary play the child watches others play","This reverses the two."],["Both involve children working toward a shared goal","That describes cooperative play."],["Both involve children playing side by side with similar toys","That describes parallel play."]]]]},{"id":26,"lec":3,"t":"Early Childhood - Parenting & Discipline","q":[["Which list names the three disciplinary techniques?",[["Inductive techniques, power assertion, and withdrawal of love","These are the three techniques in the notes."],["Inductive techniques, parallel play, and withdrawal of love","Parallel play is a stage of social play."],["Power assertion, fast mapping, and inductive techniques","Fast mapping is a way of learning words."],["Withdrawal of love, encoding, and power assertion","Encoding is a memory process."]]],["After her son shoves a classmate, a mother kneels down and explains how it hurt the other child and asks him how he would feel. Which technique is she using?",[["Inductive techniques","They are discipline methods that guide children to internalize moral standards."],["Power assertion","This controls behavior through authority, force, or punishment."],["Withdrawal of love","This uses emotional manipulation, such as ignoring or rejecting the child."],["Parallel play","This is a stage of social play."]]],["After her daughter breaks a toy, a father yells, spanks her, and takes all her toys away. Which technique is he using?",[["Power assertion","It attempts to control behavior through authority, force, or punishment."],["Inductive techniques","These guide children to internalize moral standards through explanation."],["Withdrawal of love","This uses emotional manipulation, such as ignoring a child."],["Encoding","This is a memory process."]]],["After her son lies, a mother refuses to speak to him or look at him for the rest of the evening. Which technique is she using?",[["Withdrawal of love","It uses emotional manipulation, such as ignoring a child or expressing rejection, to control behavior."],["Power assertion","This uses authority, force, or punishment."],["Inductive techniques","These explain and guide the child to internalize standards."],["Associative play","This is a stage of social play."]]],["A father talks with his daughter about why taking things that belong to others is unfair and how the owner feels, hoping she will make the rule her own. Which technique is this?",[["Inductive techniques","They guide children to internalize moral standards."],["Power assertion","This relies on authority, force, or punishment."],["Withdrawal of love","This relies on ignoring or rejecting the child."],["Fast mapping","This is learning the meaning of a new word."]]],["A mother says, “Because I said so!” and slaps her son’s hand when he reaches for the stove. Which technique is she using?",[["Power assertion","It controls behavior through authority, force, or punishment."],["Inductive techniques","These involve explanations that help the child internalize standards."],["Withdrawal of love","This relies on ignoring or rejection."],["Context-based understanding","This is inferring a word’s meaning from context."]]],["A father turns away and says, “I don’t want to be around you when you act like that,” when his daughter throws a tantrum. Which technique is he using?",[["Withdrawal of love","It expresses rejection as a way to control behavior."],["Power assertion","This uses authority, force, or punishment."],["Inductive techniques","These help the child understand and internalize standards."],["Systems of action","These are combinations of skills."]]],["A teacher helps a child who teased a classmate by asking how the classmate felt and what could be done to repair the friendship. Which technique is this?",[["Inductive techniques","They guide children to understand and internalize moral standards."],["Power assertion","This relies on force or punishment."],["Withdrawal of love","This relies on ignoring or rejecting the child."],["Solitary play","This is a stage of play."]]],["A mother threatens to spank her daughter and then does so when she refuses to put away her toys. Which technique is she using?",[["Power assertion","It controls behavior through force or punishment."],["Inductive techniques","These involve explaining and guiding."],["Withdrawal of love","This relies on emotional rejection."],["Onlooker play","This is a stage of play."]]],["When her child hits a sibling, a mother ignores him and gives him the cold shoulder until he apologizes. Which technique is she using?",[["Withdrawal of love","It involves ignoring a child to control behavior."],["Power assertion","This relies on authority, force, or punishment."],["Inductive techniques","These involve guiding the child through reasons."],["Rapid word learning","This is grasping a word’s meaning after a few exposures."]]],["A father explains that lying breaks other people’s trust and helps his son think of ways to make it right. Which technique is this?",[["Inductive techniques","They guide children to internalize moral standards."],["Power assertion","This relies on authority or punishment."],["Withdrawal of love","This relies on ignoring or rejection."],["Encoding","This is labeling information in memory."]]],["A mother shouts commands, takes away a favorite toy as punishment, and does not explain why. Which technique is this?",[["Power assertion","It relies on authority, force, or punishment."],["Inductive techniques","These involve explanation."],["Withdrawal of love","This involves emotional rejection."],["Handedness","This is a preference for one hand."]]],["A father tells his daughter, “You are not my favorite anymore,” and refuses to hug her after she misbehaves. Which technique is this?",[["Withdrawal of love","It expresses rejection as a way to control behavior."],["Power assertion","This relies on force or punishment."],["Inductive techniques","These explain and guide the child."],["Gross motor skills","These are coordination of large muscles."]]],["How do inductive techniques differ from power assertion?",[["Inductive techniques guide children to internalize moral standards, while power assertion controls behavior through authority, force, or punishment","One guides, and the other controls."],["Inductive techniques control behavior through force, while power assertion guides children to internalize standards","This reverses the two."],["Both involve ignoring the child","That describes withdrawal of love."],["Both are forms of play","They are disciplinary techniques."]]],["How does power assertion differ from withdrawal of love?",[["Power assertion controls behavior through authority, force, or punishment, while withdrawal of love uses emotional manipulation such as ignoring or rejecting the child","One uses force, and the other uses emotional pressure."],["Power assertion ignores the child, while withdrawal of love uses force or punishment","This reverses the two."],["Both guide children to internalize moral standards","That describes inductive techniques."],["They mean the same thing","They are distinct techniques."]]],["How do inductive techniques differ from withdrawal of love?",[["Inductive techniques guide children to internalize standards, while withdrawal of love controls behavior through emotional manipulation such as ignoring or expressing rejection","One guides through understanding, and the other uses emotional pressure."],["Inductive techniques use emotional rejection, while withdrawal of love guides children to internalize standards","This reverses the two."],["Both use authority, force, or punishment","That describes power assertion."],["They mean the same thing","They are distinct techniques."]]],["Which row correctly matches each disciplinary technique with its description?",[["Inductive: guides children to internalize moral standards. Power assertion: controls behavior through authority, force, or punishment. Withdrawal of love: uses emotional manipulation","This matches all three."],["Inductive: uses emotional manipulation. Power assertion: guides children to internalize standards. Withdrawal of love: uses force","The descriptions are mismatched."],["Inductive: uses force or punishment. Power assertion: uses emotional manipulation. Withdrawal of love: guides children to internalize standards","The descriptions are mismatched."],["Inductive: ignores the child. Power assertion: explains the rules. Withdrawal of love: uses authority","The descriptions are mismatched."]]],["A mother first explains why hitting hurts, and then, when her son keeps hitting, she spanks him. Which two techniques has she used, in order?",[["Inductive techniques, then power assertion","She explained first and then used force."],["Power assertion, then inductive techniques","The order is reversed."],["Withdrawal of love, then power assertion","She did not ignore or reject the child."],["Inductive techniques, then withdrawal of love","She used force, not emotional rejection."]]],["A father says, “Go to your room right now or I’m taking your tablet away for a week!” Which technique is he using?",[["Power assertion","It controls behavior through authority, force, or punishment, including threats."],["Inductive techniques","These involve explaining and guiding."],["Withdrawal of love","This involves ignoring or rejecting."],["Parallel play","This is a stage of social play."]]],["A teacher wants children to understand why a rule exists so that they follow it even when no adult is watching. Which technique fits her goal?",[["Inductive techniques","They guide children to internalize moral standards."],["Power assertion","This controls behavior through authority or punishment."],["Withdrawal of love","This relies on emotional manipulation."],["Fast mapping","This is a way of learning words."]]],["A student says inductive techniques control behavior through authority, force, or punishment. How should this be evaluated?",[["Incorrect: that describes power assertion, while inductive techniques guide children to internalize moral standards","The two techniques have different aims."],["Correct: inductive techniques rely on force","They rely on guidance."],["Correct: inductive techniques rely on ignoring the child","That describes withdrawal of love."],["Incorrect: inductive techniques are a form of play","They are disciplinary techniques."]]],["A student says withdrawal of love involves physical punishment. How should this be evaluated?",[["Incorrect: it uses emotional manipulation, such as ignoring a child or expressing rejection, to control behavior","Physical punishment is part of power assertion."],["Correct: it relies on spanking","Spanking is power assertion."],["Correct: it relies on explaining the rules","That describes inductive techniques."],["Incorrect: it guides children to internalize standards","That describes inductive techniques."]]],["A student says power assertion guides children to internalize moral standards by explaining their actions. How should this be evaluated?",[["Incorrect: that describes inductive techniques, while power assertion controls behavior through authority, force, or punishment","The two techniques differ."],["Correct: power assertion relies on explanation","It relies on authority and force."],["Correct: power assertion relies on ignoring the child","That describes withdrawal of love."],["Incorrect: power assertion is not a disciplinary technique","It is one of the three techniques."]]],["A parent says, “Think about how your brother felt when you broke his toy.” Which technique is this, and what is its aim?",[["Inductive techniques, to help the child internalize moral standards","Guiding the child to consider others’ feelings helps the child internalize standards."],["Power assertion, to control behavior through punishment","Power assertion relies on authority, force, or punishment."],["Withdrawal of love, to control behavior through rejection","Withdrawal of love relies on ignoring the child or expressing rejection."],["Power assertion, to help the child internalize standards","Power assertion controls behavior, while inductive techniques guide internalization."]]],["Which two disciplinary techniques control behavior without guiding the child to understand and internalize the reasons?",[["Power assertion and withdrawal of love","One uses authority, force, or punishment, and the other uses emotional manipulation."],["Inductive techniques and power assertion","Inductive techniques guide children to internalize moral standards."],["Inductive techniques and withdrawal of love","Inductive techniques guide children to internalize moral standards."],["All three techniques","Inductive techniques do guide children to internalize standards."]]]]},{"id":27,"lec":3,"t":"Middle Childhood","q":[["A pediatrician notes that a 9-year-old is gaining height and weight much more slowly than she did as a preschooler. What does this reflect?",[["Growth during middle childhood slows considerably","Physical growth becomes slower compared to the earlier childhood years."],["Growth during middle childhood speeds up","Growth slows rather than speeds up."],["Growth stops completely","Growth slows considerably but does not stop."],["Sleep needs increase","Sleep needs decline in middle childhood."]]],["A child slept about 11 hours a day at age 5. About how many hours does she need later in middle childhood?",[["About 8 hours","Sleep requirements decrease from about 11 hours to about 8 hours."],["About 11 hours","This is the need at age 5."],["About 14 hours","This is more than at any point in the notes."],["About 4 hours","This is less than the notes describe."]]],["A 9-year-old who struggled to concentrate when she was 5 can now focus on her homework despite the noise in the room. Which change is this?",[["An increased ability to ignore distracting information","It is the improved capacity to focus attention despite distractions."],["A decline in sleep needs","This is the decrease from about 11 to about 8 hours."],["A change in body image","This is the perception and evaluation of physical appearance."],["A change in processing speed","This is the speed of mental processing."]]],["Which brain region is responsible for planning, judgment, and decision making?",[["The prefrontal cortex","It supports planning, judgment, and decision making."],["The frontal areas","These are named for planning and goal setting in early childhood, but the prefrontal cortex is named here."],["The motor cortex","This is not the region named in the notes."],["The visual cortex","This is not the region named in the notes."]]],["A 10-year-old solves math problems much faster than she could at 6. Which ability has improved?",[["Processing speed","It is the speed of mental processing, which improves dramatically in middle childhood."],["Body image","This is the perception of one’s appearance."],["Fine motor skills","These are small muscle coordination skills."],["Instrumental aggression","This is goal-directed aggression."]]],["What explains the dramatic improvement in processing speed during middle childhood?",[["Unnecessary synapses are pruned and neural pathways become myelinated","These changes make mental processing faster."],["Children sleep more than ever before","Sleep needs actually decline."],["Children’s bodies grow much faster","Growth slows in middle childhood."],["Children develop a larger prefrontal cortex overnight","The notes describe pruning and myelination."]]],["A 9-year-old regulates her attention, stops herself from blurting out answers, and checks her work for mistakes. Which ability is this?",[["Self-regulation","It is the ability to regulate attention, inhibit responses, and monitor errors."],["Processing speed","This is the speed of mental processing."],["Contextual intelligence","This is adapting to real-life situations."],["Body image","This is the perception of one’s appearance."]]],["A 10-year-old continues to improve at climbing, running, and kicking a ball. Which area of development is this?",[["Motor skills","They are physical abilities that continue to develop during middle childhood."],["Body image","This is the perception of one’s appearance."],["Self-regulation","This is regulating attention and monitoring errors."],["Processing speed","This is the speed of mental processing."]]],["An 11-year-old worries about how she looks and compares her appearance with her classmates. Which concept is this?",[["Body image","It is a child’s perception and evaluation of her physical appearance."],["Self-regulation","This is the ability to regulate attention and monitor errors."],["Motor skills","These are physical abilities."],["Contextual intelligence","This is adapting to real-life situations."]]],["Which statement about body image in middle childhood is accurate?",[["It becomes increasingly important during middle childhood","Children’s perception and evaluation of their appearance matters more over time."],["It becomes less important as children age","It becomes increasingly important."],["It refers to the speed of mental processing","That describes processing speed."],["It is the ability to inhibit responses","That describes self-regulation."]]],["A child who has never been taught to read a map finds her way home through a new neighborhood and handles an unexpected bus detour calmly. Which kind of intelligence is she showing?",[["Contextual intelligence (practical, street smarts)","It is the ability to adapt to real-life situations, handle everyday challenges, and solve practical problems."],["Componential intelligence (analytical, book smarts)","This is solving problems, analyzing information, and academic tasks."],["Experiential intelligence (creative, insightful smarts)","This is using past knowledge to develop new solutions for unfamiliar problems."],["Processing speed","This is the speed of mental processing."]]],["A child earns top marks on tests, analyzes information well, and performs academic tasks easily. Which kind of intelligence is she showing?",[["Componential intelligence (analytical, book smarts)","It is the ability to solve problems, analyze information, and perform academic tasks."],["Contextual intelligence (practical, street smarts)","This is adapting to real-life situations."],["Experiential intelligence (creative, insightful smarts)","This is developing new solutions for unfamiliar problems."],["Self-regulation","This is regulating attention and monitoring errors."]]],["Faced with a puzzle unlike any she has seen, a child draws on her past experiences to invent a new solution. Which kind of intelligence is she showing?",[["Experiential intelligence (creative, insightful smarts)","It is the ability to use past knowledge and experiences to develop new solutions for unfamiliar problems."],["Componential intelligence (analytical, book smarts)","This is academic problem solving."],["Contextual intelligence (practical, street smarts)","This is adapting to real-life situations."],["Body image","This is the perception of one’s appearance."]]],["Which row correctly matches each kind of intelligence with its description?",[["Contextual: practical street smarts. Componential: analytical book smarts. Experiential: creative, insightful smarts","This matches all three."],["Contextual: analytical book smarts. Componential: creative, insightful smarts. Experiential: practical street smarts","The descriptions are mismatched."],["Contextual: creative, insightful smarts. Componential: practical street smarts. Experiential: analytical book smarts","The descriptions are mismatched."],["Contextual: academic tasks. Componential: street smarts. Experiential: book smarts","The descriptions are mismatched."]]],["A child lies about a classmate’s test score to win a prize. Which kind of aggression is this?",[["Instrumental (proactive) aggression","It is goal-directed aggression used to achieve a specific objective."],["Hostile (reactive) aggression","This occurs in response to a perceived threat and is driven by anger."],["Direct (overt) aggression","This is confrontational physical or verbal aggression."],["Indirect (relational) aggression","This damages relationships or reputation without direct harm."]]],["A boy shoves a classmate who has just insulted him, acting out of anger. Which kind of aggression is this?",[["Hostile (reactive) aggression","It occurs in response to a perceived threat or provocation and is driven by anger."],["Instrumental (proactive) aggression","This is goal-directed."],["Indirect (relational) aggression","This is subtle and covert."],["Self-regulation","This is the ability to inhibit responses."]]],["A girl yells at a classmate and pushes her face to face. Which kind of aggression is this?",[["Direct (overt) aggression","It is confrontational physical or verbal aggression intended to directly harm another person."],["Indirect (relational) aggression","This is subtle and covert aggression."],["Instrumental aggression","This is goal-directed aggression."],["Contextual intelligence","This is practical problem solving."]]],["A girl spreads a rumor to damage another girl’s friendships and reputation. Which kind of aggression is this?",[["Indirect (relational) aggression","It is subtle and covert aggression intended to damage relationships or reputation."],["Direct (overt) aggression","This is confrontational physical or verbal aggression."],["Hostile aggression","This is driven by anger in response to provocation."],["Instrumental aggression","This is goal-directed aggression."]]],["How do instrumental (proactive) aggression and hostile (reactive) aggression differ?",[["Instrumental aggression is goal-directed to achieve an objective, while hostile aggression is a response to a perceived threat or provocation driven by anger","One is planned for a goal, and the other is an angry response."],["Instrumental aggression is driven by anger, while hostile aggression is goal-directed","This reverses the two."],["Both are subtle and covert","That describes indirect aggression."],["Both are confrontational physical or verbal actions","That describes direct aggression."]]],["How do direct (overt) aggression and indirect (relational) aggression differ?",[["Direct aggression is confrontational and physical or verbal, while indirect aggression is subtle and covert and damages relationships or reputation","One is open, and the other is hidden."],["Direct aggression is subtle and covert, while indirect aggression is confrontational","This reverses the two."],["Both are driven by anger in response to a threat","That describes hostile aggression."],["Both are goal-directed","That describes instrumental aggression."]]],["Which row correctly matches each type of aggression with its description?",[["Instrumental: goal-directed. Hostile: angry response to a threat. Direct: confrontational. Indirect: subtle and relational","This matches all four."],["Instrumental: angry response to a threat. Hostile: goal-directed. Direct: subtle. Indirect: confrontational","The descriptions are mismatched."],["Instrumental: subtle and relational. Hostile: confrontational. Direct: goal-directed. Indirect: angry response","The descriptions are mismatched."],["Instrumental: confrontational. Hostile: subtle. Direct: angry response. Indirect: goal-directed","The descriptions are mismatched."]]],["A student says sleep needs increase in middle childhood from about 8 hours to about 11 hours. How should this be evaluated?",[["Incorrect: sleep needs decline from about 11 hours at age 5 to about 8 hours later in middle childhood","The direction is the reverse."],["Correct: sleep needs increase in middle childhood","They decline."],["Correct: sleep needs stay at 11 hours","They decline to about 8 hours."],["Incorrect: children need no sleep in middle childhood","They still need about 8 hours."]]],["A student says componential intelligence refers to practical street smarts. How should this be evaluated?",[["Incorrect: that describes contextual intelligence, while componential intelligence is analytical book smarts","The two kinds of intelligence differ."],["Correct: componential intelligence is practical street smarts","That describes contextual intelligence."],["Correct: componential intelligence is creative, insightful smarts","That describes experiential intelligence."],["Incorrect: componential intelligence refers to body image","It is a kind of intelligence."]]],["A student says hostile aggression is goal-directed and used to achieve a specific objective. How should this be evaluated?",[["Incorrect: that describes instrumental aggression, while hostile aggression is driven by anger in response to a perceived threat or provocation","The two types differ in motive."],["Correct: hostile aggression is goal-directed","That describes instrumental aggression."],["Correct: hostile aggression is subtle and covert","That describes indirect aggression."],["Incorrect: hostile aggression is a type of intelligence","It is a type of aggression."]]],["A 10-year-old’s height and weight increase slowly while her thinking speed rises quickly. Which pair of changes does this show?",[["Growth slows considerably, and processing speed improves dramatically","Both changes occur in middle childhood."],["Growth speeds up, and processing speed declines","Both are reversed."],["Growth stops, and sleep needs increase","Growth slows but does not stop, and sleep needs decline."],["Growth slows, and body image becomes less important","Body image becomes increasingly important."]]]]},{"id":28,"lec":3,"t":"Lecture 3 Comprehensive Review","q":[["Which event must occur before fertilization can take place?",[["Ovulation, the release of an ovum from a mature follicle","A mature ovum has to be released before a sperm can fertilize it."],["Implantation of the blastocyst","This happens after fertilization and cell division."],["Organogenesis in the embryo","This happens after the embryonic period begins."],["Labor and delivery","This happens at the end of pregnancy."]]],["A karyotype shows 22 matched pairs of autosomes plus an XX pair. What is the person’s genetic sex?",[["Genetic female","The XX combination in the 23rd pair indicates a genetic female."],["Genetic male","This is an XY combination."],["Undetermined","The sex chromosome pair determines genetic sex."],["Both male and female","An XX combination corresponds to a genetic female."]]],["Researchers recruit twins who developed from a single fertilized egg to separate genetic effects from environmental effects on personality. Which twins and which method are these?",[["Monozygotic twins in twin studies","Identical twins come from one zygote and are genetically similar."],["Dizygotic twins in twin studies","These come from two eggs and are genetically distinct."],["Monozygotic twins in karyotyping","Karyotyping produces a chromosome profile, not a nature-nurture comparison."],["Dizygotic twins in genetic counseling","Genetic counseling is a service, not a research method."]]],["Which male hormone do embryos normally begin producing about 6 to 8 weeks after conception, shaping male sexual development?",[["Testosterone","It is the hormone that begins to be produced at that time."],["Insulin","This regulates blood sugar."],["Oxytocin","This is not described in the notes."],["Estrogen","This is a female hormone."]]],["How does a karyotype differ from genetic counseling?",[["A karyotype is a visual profile or photograph of chromosomes, while genetic counseling is a service that advises people about genetic conditions","One is a picture, and the other is a service."],["A karyotype is a service that advises prospective parents, while genetic counseling is a photograph of chromosomes","This reverses the two."],["Both are hormones produced by the embryo","Neither is a hormone."],["They mean the same thing","They are two different things."]]],["Which statement fits Gilbert Gottlieb’s epigenetic principle?",[["Genes and hormones interact with environmental factors to guide development","It describes interaction between products of evolution and the environment."],["Genes alone determine development","This is the opposite of epigenesis."],["The environment alone shapes development","Both genes and environment interact."],["Development is predetermined at conception","Epigenesis holds that development is flexible, not predetermined."]]],["A bookish couple passes on genes that favor reading and also fills their home with books. Which kind of genotype-environment correlation is this?",[["Passive","Children inherit both the genes and the environment their family provides."],["Active (niche picking)","The child would select her own environment."],["Reactive (evocative)","Others would react to the child’s inherited characteristics."],["Gene-environment interaction","This concerns how environmental effects differ by genetic risk."]]],["A shy child with an inherited inclination toward quiet activities joins the library club and avoids loud games. Which kind of correlation is this?",[["Active (niche picking)","She selects experiences consistent with her genetic tendencies."],["Passive","The family would provide the environment."],["Reactive (evocative)","Others would react to her inherited traits."],["Epigenesis","This is a view of development, not a type of correlation."]]],["In the Early Growth and Development Study, which finding shows gene-environment interaction?",[["Parenting structure and parental psychopathology influenced child behavior differently depending on the child’s genetic risk","Environmental effects differed according to inherited risk."],["Every child responded to parenting in the same way","This would show no interaction."],["Twins always shared the same temperament","The study did not concern this."],["Genetic risk had no effect on behavior","The study showed genetic risk mattered."]]],["How does passive genotype-environment correlation differ from reactive (evocative) correlation?",[["Passive: children inherit genes and the environment their family provides. Reactive: others respond to the child’s inherited characteristics","One comes from the family, and the other comes from others’ reactions."],["Passive: others respond to the child’s inherited characteristics. Reactive: children inherit the family’s environment","This reverses the two."],["Both: individuals select their own environments","That describes active correlation."],["They mean the same thing","They are two different types."]]],["A newborn has an extra copy of chromosome 21. Which condition does she have, and what share of moderate to severe intellectual disability does it account for?",[["Down syndrome, about 40 percent","It is the most common chromosomal abnormality."],["Edwards syndrome, about 40 percent","Edwards syndrome is Trisomy 18 and is rare."],["Down syndrome, about 4 percent","The notes say about 40 percent."],["Fragile X syndrome, about 40 percent","Fragile X is an X chromosome abnormality."]]],["A girl is short, her ovaries have failed to develop, and she has a wide, web-like neck. Which condition is this?",[["Turner syndrome","It involves a missing X chromosome and these characteristics."],["Klinefelter syndrome","This affects males with an extra X."],["Jacob’s syndrome","This affects males with an extra Y."],["Down syndrome","This is trisomy 21."]]],["Why is a boy more likely than a girl to show a recessive X-linked trait?",[["He has only one X chromosome, with no second X to offset the defective gene","A girl usually has a second healthy X."],["He has two X chromosomes","This describes a girl."],["He has an extra Y chromosome","This does not explain X-linked risk."],["He lacks autosomes","Males have 22 pairs of autosomes."]]],["Which feature distinguishes Jacob’s syndrome (XYY) from Klinefelter syndrome (XXY)?",[["Jacob’s syndrome involves typical testosterone and fertility, while Klinefelter syndrome involves low testosterone and infertility","One often goes undiagnosed, while the other has clear effects."],["Jacob’s syndrome involves low testosterone, while Klinefelter syndrome involves typical fertility","This reverses the two."],["Both involve a missing X chromosome","That describes Turner syndrome."],["Both affect only females","Both affect males."]]],["A boy has learning disabilities, anxiety, and ADHD symptoms because his body cannot make enough of a protein needed for brain growth. Which condition is this?",[["Fragile X syndrome","It is the most common inherited form of intellectual and developmental disabilities."],["Edwards syndrome","This is rare and involves physical symptoms such as club foot."],["Turner syndrome","This affects females with a missing X."],["Jacob’s syndrome","This is the condition with an extra Y chromosome."]]],["A mother is in week 5 of pregnancy, when the major organs and body structures are forming. Which period and process is this?",[["The embryonic period, with organogenesis","Internal organs form during the embryonic period."],["The germinal period, with implantation","This covers the first two weeks."],["The fetal period, with viability","This begins at the ninth week."],["The germinal period, with mitosis","Mitosis occurs in the zygote’s early divisions."]]],["Which embryonic layer develops into the muscles, bones, and circulatory system?",[["The mesoderm","It forms the inner layer of skin, muscles, bones, and the excretory and circulatory systems."],["The ectoderm","This forms the skin, nails, hair, and nervous system."],["The endoderm","This forms the digestive and respiratory systems."],["The trophoblast","This is the outer cell group that becomes the support system."]]],["An embryo’s head develops well before its legs. Which principle does this illustrate?",[["The cephalocaudal princ

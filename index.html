<style>:root{--bg:#115D33;--card:#70C247;--card2:#8DD06C;--ink:#0B2E1A;--ink2:#1A4A2A;--pg:#FFFFFF;--mut:#D5F2C6;--line:#228B22;--line2:#115D33;--acc:#4CBB17;--accInk:#0B2E1A;--bar:#4CBB17;--track:rgba(141,208,108,.3);--ul:#8DD06C;--dbg:#8DD06C;--focus:#FFFFFF;--ok:#115D33;--okb:#E4F6DA;--okl:#115D33;--no:#B3263E;--nob:#FFE0E4;--nol:#A01C35;--lbl:#2B4A35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--pg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 22px/1.25 Georgia,'Times New Roman',serif;margin:0 0 4px;color:var(--pg)}
.sub{color:var(--mut);font-size:14px;margin:0 0 12px}
.bar{height:7px;background:var(--track);border-radius:4px;overflow:hidden;margin-bottom:6px}.bar i{display:block;height:100%;background:var(--bar);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);color:var(--ink);border:2.5px solid var(--line);border-radius:12px;padding:20px}
.stem{font:19px/1.5 Georgia,'Times New Roman',serif;margin:0 0 16px;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--ink);border:2.5px solid var(--line2);border-radius:10px;padding:12px 14px;margin:0 0 10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}.dbtn:focus-visible,a.back:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .t{font-weight:600}.opt .r{display:none;margin-top:6px;font-size:14.5px;color:var(--ink)}
.opt.show .r{display:block}
.opt.right{border-color:var(--ok);background:var(--okb)}.opt.wrong{border-color:var(--no);background:var(--nob)}
.opt.show .t::before{content:"Correct: ";color:var(--okl)}.opt.show:not(.right) .t::before{content:"Why this is wrong: ";color:var(--lbl);font-weight:500}
.opt.picked:not(.right) .t::before{content:"Your answer, incorrect: ";color:var(--nol)}
.opt.picked.right .t::before{content:"Your answer, correct: "}
.btn{background:var(--acc);color:var(--accInk);border:0;border-radius:10px;padding:11px 20px;font:600 15px inherit;font-family:inherit;cursor:pointer;margin-top:6px}
.score{font:600 40px Georgia,serif;margin:0;color:var(--ink)}
.miss{border-top:1px solid var(--line);padding:10px 0;font-size:14.5px}.miss b{display:block}
a.back{display:inline-block;margin:0 0 12px;color:var(--mut);font-size:14px;text-decoration:none}a.back:hover{text-decoration:underline;color:var(--pg)}
.grp h2{font:600 17px Georgia,serif;margin:22px 0 10px;color:var(--pg);border-bottom:3px solid var(--line);padding-bottom:4px}.grid{display:grid;gap:10px}
.dbtn{display:block;text-decoration:none;color:var(--ink);background:var(--dbg);border:2.5px solid var(--line);border-radius:12px;padding:12px 14px}
.dbtn:hover{border-color:var(--pg)}
.dbtn b{display:block}.dbtn span{color:var(--ink2);font-size:13px}.dbtn.off{opacity:.6;pointer-events:none}

#pal{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:5}
.pc{width:30px;height:30px;border-radius:50%;border:3px solid var(--pg);padding:0;cursor:pointer}.pc.on{outline:3px solid var(--pg);outline-offset:3px}.pc:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media(max-width:860px){main{padding-left:58px}}
label{display:block;font-weight:600;margin:14px 0 4px}label:first-child{margin-top:0}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:2.5px solid var(--line2);background:var(--card2);color:var(--ink);font:inherit}.inp:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{color:var(--nol);min-height:1.4em;margin:8px 0 6px;font-size:14px;font-weight:600}
.link{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit;font-size:14px;text-decoration:underline;padding:6px 0;margin-top:8px}.link:hover{color:var(--pg)}.card .link{color:var(--ink2)}.card .link:hover{color:var(--ink)}
button.dbtn{width:100%;text-align:left;font:inherit;cursor:pointer}
.dbtn.prof{display:flex;align-items:center}
.av{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--accInk);font-weight:700;margin-right:12px;flex:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.topbar .link{margin:0}
.pw{position:relative}.pw .inp{padding-right:68px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ink2);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:6px}.eye:hover{color:var(--ink)}.eye:focus-visible{outline:3px solid var(--ink)}
.big{font:600 22px Georgia,serif;margin:0 0 4px}
.prow{padding:10px 0;border-top:1px solid var(--line)}.prow b{display:block}.prow span{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:6px}
.pbar{height:8px;background:rgba(0,0,0,.18);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ink2)}

input::-ms-reveal,input::-ms-clear{display:none}
.subj{text-align:center;padding:24px 14px;border-radius:28px;font:600 18px Georgia,serif}.subj.off{opacity:.65}.subj span{display:block;font:13px system-ui,sans-serif}
.note{font-size:12.5px;line-height:1.45;color:var(--mut);margin:16px 2px 0}
.foot{margin-top:30px;text-align:center;font-size:12px;color:var(--mut)}
.hint{font-size:13px;color:var(--ink2);margin:10px 0 0}
.qp{background:var(--card);color:var(--ink);border:2.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:0 0 12px}.qh{display:flex;justify-content:space-between;align-items:center}.qp .link{color:var(--ink2);margin:0}.qp .link:hover{color:var(--ink)}
.qgrid{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 4px}
.qn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink2);background:transparent;color:var(--ink);font:700 15px system-ui,sans-serif;cursor:pointer;padding:0}.qn.ok{border-color:var(--ok);background:var(--okb)}.qn.no{border-color:var(--no);background:var(--nob)}.qn.cur{outline:3px solid var(--ink);outline-offset:2px}.qn.cur:not(.ok):not(.no){background:var(--ink);color:var(--card)}.qn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn.alt{background:transparent;color:var(--ink);border:2.5px solid var(--ink2)}.btn:disabled{opacity:.45;cursor:default}

html{background:var(--bg);min-height:100%}body{min-height:100vh;min-height:100dvh}
.note.c{text-align:center}
.err{min-height:0;margin:10px 0 0}.err:empty{display:none}form .btn{margin-top:14px}
.psec{margin-bottom:14px}.psec h3{font:600 19px Georgia,serif;margin:0 0 6px}.mutedc{color:var(--ink2);margin:0}
@media(max-width:860px){main{padding-left:calc(46px + env(safe-area-inset-left,0px));padding-right:18px}#pal{left:calc(8px + env(safe-area-inset-left,0px));gap:10px}.pc{width:24px;height:24px;border-width:2px}.pc.on{outline-width:2px;outline-offset:2px}}

textarea.inp{resize:vertical;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-top:12px}
:root{--ok:#1E5A12;--okb:#E4F6DA;--okl:#1B5E20;--no:#B3263E;--nob:#FFE6E9;--nol:#5E0A1B;--bg:#1A4301;--card:#73A942;--card2:#AAD576;--ink:#0F2400;--ink2:#1F4A08;--pg:#FFFFFF;--mut:#AAD576;--line:#538D22;--line2:#245501;--acc:#245501;--accInk:#FFFFFF;--bar:#73A942;--track:rgba(170,213,118,.25);--ul:#73A942;--dbg:#AAD576;--focus:#FFFFFF;--lbl:#1F3A12}
.note.j{text-align:justify;hyphens:auto}
.warn{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.05);font-size:13px}
.acc>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:8px}.acc>summary::-webkit-details-marker{display:none}.acc>summary h3{margin:0}.acc>summary:focus-visible{outline:3px solid var(--ink);outline-offset:4px}.acc .pct{font:600 22px Georgia,serif;margin-left:auto}.acc>summary::after{content:"▾";font-size:18px;transition:transform .2s}.acc[open]>summary::after{transform:rotate(180deg)}.acc[open]>summary{margin-bottom:10px}
</style></head><body>

<script>var DRILLS=[{"id":1,"lec":1,"t":"Introduction, Principles, Research, Ethics, and Theories","q":[["A researcher tracks 100 toddlers’ vocabulary at 12, 18, and 24 months and reports the typical number of words at each age. Which goal is she pursuing?",[["Description","Description documents what development looks like at each age."],["Explanation","Explanation asks why changes happen, and she is only recording what happens."],["Prediction","Prediction forecasts later outcomes, which she is not doing."],["Intervention","Intervention changes development, and she is only observing."]]],["A team finds that many children in a barangay lag in language, then sets up a storytelling program to help them catch up. Which goal does the program serve?",[["Intervention","Applying findings to improve or optimize development is intervention."],["Description","Description only records patterns, with no action taken."],["Explanation","Explanation identifies causes, and the program is a response, not a cause."],["Prediction","Prediction anticipates outcomes, and the team is acting, not forecasting."]]],["A study follows how a 4-year-old’s bond with her mother and her ability to handle anger change over a year. Which domain is this?",[["Psychosocial","Emotions, personality, and social relationships are psychosocial."],["Physical","Physical covers body, brain, senses, motor skills, and health."],["Cognitive","Cognitive covers learning, memory, attention, language, and reasoning."],["Maturation","Maturation is a process of natural change, not a domain of development."]]],["Adopted children resemble their adoptive parents in reading habits even though they share no genes. What does this suggest?",[["Environment shapes the trait","Resemblance without shared genes points to nurture, as adoption studies show."],["Heredity shapes the trait","Heredity would show up with biological relatives, as in twin studies."],["Maturation shapes the trait","Maturation is a natural unfolding that does not depend on the family’s habits."],["Age-graded events shape the trait","Age-graded events are shared by an age group, not by one household."]]],["Babies in many cultures sit, crawl, stand, and walk in the same order at about the same ages. What best explains this?",[["Maturation","Maturation is the unfolding of a natural sequence of changes."],["Nurture","Training can matter, but a sequence shared across cultures points to maturation."],["A cohort effect","A cohort is a group born at the same time, which does not explain a universal sequence."],["A history-graded event","No historical event is needed to explain this."]]],["In the Philippines, most children start Grade 1 around age 6 and reach puberty in early adolescence. What type of event is this?",[["Normative age-graded","It is common to most people of a particular age group."],["Normative history-graded","That requires a shared historical event, like a war or pandemic."],["Historical generation","That is a group shaped by an event, not a type of event."],["Cohort effect","A cohort is a group born at the same time, not a type of event."]]],["Teens during a major lockdown lost school and friendships at a formative time. What term best describes this group?",[["Historical generation","It is a group that experienced the event at a formative time of life."],["Cohort","A cohort is simply people born around the same time, not necessarily shaped by the event."],["Normative age-graded group","Age-graded events are tied to age, not to a historical event."],["Maturation group","Maturation is natural unfolding, not shared history."]]],["A teacher believes a child’s behavior is shaped almost entirely by the rewards and conditions around her, like a blank slate. Which model is this?",[["Mechanistic model","Locke’s tabula rasa: humans are machines operated by the environment."],["Organismic model","Rousseau’s view: the person is active and sets her own development."],["Continuity view","Continuity is about gradual change, not about who drives development."],["Discontinuity view","Discontinuity is about abrupt stage changes, not about who drives development."]]],["A parent says, “My daughter sets her own course. Her instincts and potential drive how she grows.” Which model is this?",[["Organismic model","Rousseau’s view: instincts and individual potential, with the person active in development."],["Mechanistic model","Locke’s view: the person is reactive and operated by the environment."],["Continuity view","Continuity is about gradual change, not about who drives development."],["Discontinuity view","Discontinuity is about abrupt stage changes, not about who drives development."]]],["A theorist says children jump from one way of thinking to a completely different one at certain ages. Which view of change is this?",[["Discontinuity","Abrupt, qualitative change, as in stage-oriented theories."],["Continuity","Continuity is gradual, incremental, quantitative change."],["Mechanistic model","That is about the role of the environment, not the shape of change."],["Organismic model","That is about the person’s active role, not the shape of change."]]],["After six months of memory exercises and walking, a 68-year-old’s recall and endurance improve noticeably. Which principle is shown?",[["Plasticity","Abilities can improve with training and practice, even late in life."],["Multidirectionality","That is about gains in one area alongside losses in another."],["Contextuality","That is about settings such as family and school shaping development."],["Multidimensionality","That is about interacting domains, not trainability."]]],["An older woman’s vocabulary keeps growing while her processing speed slows. Which principle does this show?",[["Multidirectionality","Gains in one area can occur alongside losses in another."],["Plasticity","Plasticity refers to improvement through training."],["Lifelong development","True in general, but this example highlights simultaneous gain and loss."],["Changing resource allocations","That concerns how people invest time, energy, and money."]]],["A 45-year-old turns down a promotion to spend her limited time and energy caring for her parents. Which principle is shown?",[["Changing resource allocations","People choose how to invest time, energy, talent, money, and social support."],["Multidirectionality","This is not about gains and losses happening at once."],["Co-construction","That is about the shifting balance of biology and culture."],["Plasticity","The example is about choices, not training that improves an ability."]]],["A psychologist studies one man in depth after a rare brain injury changed his personality. What is a key limitation of this approach?",[["Findings can’t be generalized","One person is not representative of others."],["It can’t describe the person in detail","Detailed description is a strength of case studies."],["It can’t generate hypotheses","Generating hypotheses is a strength of case studies."],["It is prone to attrition","Attrition is a longitudinal concern, not the main case-study limitation."]]],["A researcher lives for a year in a remote community to see whether a developmental pattern appears across cultures. What is a main weakness of this method?",[["Observer bias","The researcher’s own views can color what is observed and recorded."],["Participant attrition","Attrition is a longitudinal concern, not the main ethnographic weakness."],["Inability to test universality","Testing universality of developmental phenomena is a strength."],["Inability to overcome cultural bias","Overcoming culturally based bias in theory and research is a strength."]]],["A study finds that children with more screen time sleep less, and a parent concludes screens cause the poor sleep. What is the best response?",[["The link allows prediction, not cause","Correlation shows a relationship and enables prediction, but cannot establish cause and effect."],["The strong link proves cause","The strength of a correlation does not prove causation."],["A case study would prove cause","A case study also cannot establish cause and effect."],["Correlation can’t suggest hypotheses","It can suggest hypotheses about causal relationships, which an experiment could test."]]],["A researcher wants a quick, cheap comparison of memory in 5-, 10-, and 15-year-olds with no worry about dropouts. Which design fits?",[["Cross-sectional","Different ages at one time is speedy and economical with no attrition, but it can’t track individual change."],["Longitudinal","Following the same people takes time and money and has attrition problems."],["Sequential","It combines both designs but is time consuming and complex to analyze."],["Case study","It covers one individual and cannot be generalized."]]],["A team follows the same 200 children from age 5 to 25, and after ten years many families have moved away. Which problem is this?",[["Attrition","Participants drop out over time, a known problem for longitudinal studies."],["Observer bias","That is about the observer’s interpretation, not participant loss."],["Poor experimental control","This is not an experimental design."],["Complex data analysis","That is a drawback of sequential designs."]]],["A researcher compares several age groups and then follows each group for years, hoping to avoid the weaknesses of both common approaches. Which design is this?",[["Sequential","It combines cross-sectional and longitudinal designs, though it is time consuming and complex."],["Cross-sectional","This compares ages at one time with no follow-up."],["Correlational","This examines relationships between variables, not how age groups are tracked."],["Ethnographic","This studies a culture or subculture in depth."]]],["A study is run in Tagalog, but the consent form is only in English and the parents don’t read English. What is the ethical problem?",[["The form isn’t in a language they understand","Consent must be translated to the language or dialect participants understand."],["Parents’ consent is unnecessary here","The issue is understanding, not whether consent is needed."],["Verbal explanation in English is enough","English does not help people who don’t understand it."],["Consent can be skipped for pupils","Consent is waived only under limited conditions."]]],["A researcher wants 9-year-olds to join a study. Besides parents’ permission, what should she seek from the children?",[["Informed assent","Assent is the type of consent researchers should obtain from minors."],["A consent waiver","Waivers apply only under limited conditions."],["A payment agreement","Compensation is not the same as assent."],["Nothing further","Minors should still be asked to assent."]]],["A professor tells her students that joining her study will raise their grades and that those who decline will be marked down. What is wrong?",[["Students are being coerced","Researchers must not coerce students and must offer fair alternatives."],["Students may not be paid","Fair compensation is allowed, and payment is not the issue here."],["Interviews were recorded without consent","Recording is not mentioned in this scenario."],["Convenience samples are banned","No such rule exists, and the problem is pressure on students."]]],["A researcher plans to video-record interviews but wants to skip consent to save time. Is this acceptable?",[["No, consent is required before recording","Exceptions exist only in specific situations, like certain public observation or approved deception studies."],["Yes, recordings are exempt","Recordings are not exempt as a rule."],["Yes, if participants are paid","Payment does not replace consent."],["Yes, if the study is correlational","Study design does not remove the consent requirement."]]],["A lab offers participants a very large sum, far more than usual, to join a risky study. What is the concern?",[["Excessive rewards can pressure people to join","Fair compensation is allowed, but excessive incentives can pressure people."],["Participants may never be paid","Fair compensation is permitted."],["Payment invalidates the data","The concern is pressure, not data validity."],["Only students may be rewarded","No such rule exists."]]],["A study misleads participants about its purpose because no non-deceptive alternative exists and the scientific value is high. What must follow?",[["Debriefing after participation","Researchers must explain the study, correct misconceptions, minimize harm, and respect requests to withdraw data."],["Nothing, since it was approved","Debriefing is still required."],["Keeping the deception secret","Participants must be told afterward."],["Misleading them about major risks too","Participants must never be misled about major risks."]]],["A researcher secretly films strangers in their private bedrooms for a study. What is the main ethical problem?",[["People expect privacy in a bedroom","Observation is allowed only where people would reasonably expect to be observed, and privacy and well-being must be respected."],["Observation is never allowed","Observation is allowed when privacy and well-being are respected."],["Anonymous data justify it","The privacy violation happens at the point of observation, whatever happens to the data."],["Only psychologists may observe","Credentials do not remove privacy rights."]]],["A lab plans painful rat experiments although a non-animal method would answer the same question. Which principle is breached?",[["Animals may be used only when necessary","Researchers must also ensure humane treatment and minimize pain and distress."],["Animal research is never allowed","It is allowed under ethical and legal standards."],["Pain is fine if results are published","Publication does not justify avoidable suffering."],["Animals must give informed assent","Animals cannot consent, so humane-care standards apply instead."]]],["A student copies a classmate’s thesis paragraphs, and a researcher lists a colleague who did no work as co-author. Which principles are violated?",[["Plagiarism and publication credit","Do not present others’ work as your own, and take credit only for work actually done."],["Debriefing and assent","These concern participants, not authorship."],["Duplicate publication and limitations","Neither applies to this scenario."],["Inducements and observation","These concern recruiting and observing participants."]]],["A researcher submits the same data to a second journal as new findings, without acknowledging the first paper. What is the issue?",[["Duplicate publication of data","Republishing as original is wrong, though republication with proper acknowledgment is allowed."],["Plagiarism of another author","The data are her own, but they are presented as new."],["Refusing to share data","That concerns sharing data for verification."],["Breach of reviewer confidentiality","That concerns people evaluating submissions."]]],["A qualified colleague asks for your dataset to check your analysis, and a reviewer receives your unpublished manuscript. What is expected?",[["Share data under agreed conditions, and reviewers keep the manuscript confidential","Data are shared for verification while protecting confidentiality, and reviewers respect proprietary rights."],["Refuse all data requests, and reviewers may reuse its ideas","Researchers should share data with qualified professionals, and reviewers must respect proprietary rights."],["Share data freely, and reviewers may circulate the manuscript","Confidentiality and agreed conditions must be respected."],["Share data only with funders, and reviewers keep nothing confidential","Neither half of this matches the rules."]]],["A researcher notices a significant error in her published paper and leaves it. Her discussion section also never mentions weaknesses or contradicting results. What is wrong?",[["She must correct the error and acknowledge limitations and disconfirming evidence","Researchers must correct significant errors and discuss limitations, alternative explanations, and disconfirming evidence."],["Nothing, since the paper is published","Significant errors in published work must be corrected."],["Only fabrication counts as a breach","Hiding limitations and disconfirming evidence is also a breach."],["She need only inform the editor","Reporting must also be honest about limitations in the work itself."]]],["Two cousins grow up in the same country, but one lives in a rural village and the other in a big city with different schools. Their development differs. Which principle explains this?",[["Contextuality","Development occurs within settings such as family, peers, school, and country."],["Plasticity","Plasticity is about abilities improving with training."],["Lifelong development","True, but the example is about different settings."],["Multidirectionality","That is about gains and losses happening at the same time."]]],["A teenager sleeps poorly during exams. Her memory suffers, she becomes irritable, and she avoids friends. Which principle does this show?",[["Multidimensionality","Physical, cognitive, and psychosocial domains interact."],["Changing resource allocations","That is about how people choose to invest time, energy, and money."],["Plasticity","Nothing here involves training that improves an ability."],["Contextuality","The example is about domains interacting within the person, not settings."]]],["A researcher claims development ends at adulthood, while a colleague points to major changes at ages 30, 60, and 80. Whose view matches the principles?",[["The colleague, since development is lifelong","Change continues across the whole lifespan."],["The researcher, since development stops in adulthood","This contradicts the lifelong principle."],["The researcher, since only physical growth counts","Development has several domains, not just physical growth."],["Neither, since development matters only in childhood","This ignores change across the lifespan."]]],["Across a person’s life, the weight of biology relative to culture keeps shifting, and the person helps shape both. Which principle is this?",[["Co-construction","Development is a co-construction of biology, culture, and the individual, and the balance changes."],["Multidirectionality","That is about gains and losses occurring together."],["Contextuality","That is about settings, not the changing balance of biology and culture."],["Plasticity","That is about improvement through training."]]],["A researcher randomly assigns 60 preschoolers to a daily storytelling program or no program, then compares vocabulary after three months, hoping to say the program caused any difference. Which design fits?",[["Experimental","Controlled independent and dependent variables allow cause and effect, though findings may not generalize."],["Correlational","It can predict but cannot establish cause and effect."],["Case study","It covers one person and cannot be generalized."],["Ethnographic","It studies a culture in depth and is subject to observer bias."]]],["Researchers compare identical twins raised apart to see how much a personality trait depends on heredity. Which method is this?",[["Twin study","Twin studies are used to examine the role of heredity."],["Adoption study","Adoption studies examine environment using adopted children."],["Cross-sectional study","That compares ages at one time."],["Case study","That examines a single individual in depth."]]],["A severe economic crisis hits a country and affects most families whatever their ages. What type of event is this?",[["Normative history-graded","It influences most people in a society and is tied to a particular time in history."],["Normative age-graded","Age-graded events are tied to an age group, but this affects all ages."],["Maturation","Maturation is a natural sequence of change, not a historical event."],["Heredity","Heredity is genetic influence, not an event in society."]]],["Which statement best captures the standard behind all the specific rules of research ethics?",[["Respect participants’ rights, safeguard dignity, and protect welfare","The specific rules are built on respecting rights, dignity, and welfare in all aspects of research."],["Scientific value outweighs participant comfort","Participants’ rights and welfare must not be sacrificed."],["Ethics matter only for studies with children","The standard applies to all participants."],["Ethics matter only during data collection","They apply to every aspect of research, including reporting."]]],["A researcher wants to analyze anonymous, minimal-risk questionnaires that have already been collected. May informed consent be waived?",[["Yes, under limited conditions such as these","Consent may be waived for minimal-risk or anonymous research, or when law or institutional regulations require."],["No, it can never be waived","Waiver is allowed under limited conditions."],["Yes, if she is experienced","Experience is not a condition."],["Yes, if participants are paid","Payment does not decide whether consent can be waived."]]],["A therapist believes an adult’s persistent anxiety comes from unconscious emotions and drives. Which perspective is she using?",[["Psychoanalytic","It focuses on unconscious emotions and drives."],["Learning","It studies observable behavior shaped by the environment."],["Cognitive","It analyzes thought processes."],["Ethological","It stresses evolutionary and biological underpinnings."]]],["A student writes that Erikson proposed the psychosexual theory and Freud the psychosocial theory. Is this right?",[["No, the two names are swapped","Freud proposed the psychosexual theory and Erikson the psychosocial theory."],["Yes, it is correct","The theorists and theories are reversed."],["Half right, only Erikson’s name","Both parts are wrong."],["No, both belong to Piaget","Piaget proposed the cognitive development theory."]]],["A child tidies her room every day after her parents begin giving her a sticker each time she does it. Which theory best explains this?",[["Skinner’s operant conditioning","Behavior increases when followed by a reward from the environment."],["Pavlov’s classical conditioning","That is about associating stimuli, not rewarding a behavior."],["Bandura’s social cognitive theory","That stresses learning by observing others."],["Piaget’s cognitive development theory","That analyzes thought processes, not reinforcement."]]],["After several painful dental visits, a boy feels nervous the moment he sees the dentist’s chair. Which theory explains this best?",[["Pavlov’s classical conditioning","A neutral stimulus (the chair) became associated with pain and now triggers anxiety."],["Skinner’s operant conditioning","That involves consequences that follow a behavior, not association of stimuli."],["Bandura’s social cognitive theory","Nothing here involves observing or imitating a model."],["Piaget’s cognitive development theory","That analyzes thought processes, not learned associations."]]],["A girl learns to bake by watching her aunt and copying each step. Which theory highlights this kind of learning?",[["Bandura’s social cognitive theory","Learning occurs by observing and imitating others."],["Skinner’s operant conditioning","That focuses on rewards and punishments for the learner’s own behavior."],["Pavlov’s classical conditioning","That is about associating stimuli."],["Bowlby’s attachment theory","That is an ethological theory about the bond with a caregiver."]]],["A researcher studies how a 3-year-old and a 9-year-old reason differently about the same puzzle, focusing on how thinking itself changes with age. Which theory fits?",[["Piaget’s cognitive development theory","Cognitive theories analyze thought processes, and Piaget’s focuses on how thinking develops."],["Skinner’s operant conditioning","It studies observable behavior, not thought processes."],["Freud’s psychosexual theory","It focuses on unconscious emotions and drives."],["Bowlby’s attachment theory","It focuses on the evolutionary roots of attachment."]]],["A teacher stresses that children learn best by working with more skilled members of their culture. Which theory is this?",[["Vygotsky’s sociocultural theory","The notes list it as a cognitive theory that stresses learning through social and cultural interaction."],["Bandura’s social cognitive theory","A learning theory that stresses observing and imitating models, not guided work with skilled partners."],["Skinner’s operant conditioning","A learning theory that explains behavior through rewards and punishments."],["Bowlby’s attachment theory","An ethological theory about the evolutionary roots of attachment."]]],["A researcher examines how a child’s development is shaped by layers of influence, from family and school to the wider historical, social, and cultural setting. Which theory is she applying?",[["Bronfenbrenner’s bioecological theory","A contextual theory emphasizing historical, social, and cultural context."],["Skinner’s operant conditioning","A learning theory about rewards and punishments."],["Freud’s psychosexual theory","A psychoanalytic theory about unconscious emotions and drives."],["Piaget’s cognitive development theory","A cognitive theory about thought processes."]]],["A researcher explains a baby’s clinging to its caregiver by pointing to evolutionary and biological roots of the bond. Which theory is this?",[["Bowlby’s attachment theory","An ethological theory that emphasizes evolutionary and biological underpinnings."],["Erikson’s psychosocial theory","A psychoanalytic theory that does not stress evolutionary roots of attachment."],["Bandura’s social cognitive theory","A learning theory about observation and imitation."],["Bronfenbrenner’s bioecological theory","A contextual theory about layers of environment."]]],["A counselor draws on Skinner’s reinforcement, Piaget’s ideas about how children reason, and Bronfenbrenner’s attention to context, saying no single theory explains everything. What orientation is this?",[["Eclectic orientation","It selects the best features of each theory instead of relying on one."],["Psychoanalytic orientation","That is a single perspective about unconscious emotions and drives."],["Learning-only orientation","It draws on several perspectives, not only learning theories."],["Ethological-only orientation","It does not rely only on evolutionary and biological explanations."]]]]},{"id":2,"lec":1,"t":"Psychoanalytic Perspective (Freud & Erikson)","q":[["Freud held that development is shaped by two unconscious forces. Which pair is it?",[["Sex and aggression","These are the two unconscious forces behind Freud’s psychosexual theory."],["Hope and will","These are Erikson’s ego strengths for his first two stages, not Freud’s forces."],["Reinforcement and punishment","These are operant conditioning procedures from the learning perspective, not Freud’s forces."],["Nature and nurture","These are the broad influences of heredity and environment, not Freud’s unconscious forces."]]],["A lecturer explains what “sex” means in Freud’s theory. Which description is accurate?",[["Sexual pleasure through reducing sexual tension, not limited to genital satisfaction","Freud used the term broadly, so pleasure from reducing tension counts, including through the mouth or anus."],["Genital intercourse only","Intercourse is the activity of the genital stage, but Freud’s concept of sex is much broader."],["Reproduction only","Freud’s concept concerns pleasure and tension reduction, not only reproduction."],["Love for the opposite-sex parent only","That describes the Oedipus complex, which is one phase of development and not the definition of sex."]]],["A therapist says Freud’s aggressive drive ultimately aims at death or self-destruction. What aim is she describing?",[["Returning the organism to an inorganic state","In Freud’s view, aggression ultimately pulls the organism back toward an inorganic state, which means death or self-destruction."],["Reducing sexual tension","That is the aim Freud assigns to the sexual drive, not the aggressive one."],["Winning social approval","Freud’s drives are unconscious and not aimed at approval."],["Strengthening the superego","The superego forms from internalized authority, and it is not the aim of the aggressive drive."]]],["A 6-month-old’s needs are met promptly, so she feels no ambivalence toward the person who feeds her. Which Freudian phase is this?",[["Oral-receptive","Needs are met with minimum frustration and anxiety, so there is no ambivalence toward the pleasurable object."],["Oral-sadistic (oral-aggressive)","This phase involves responding to others through biting, crying, and similar behaviors, not the calm satisfaction described."],["Early anal","This period begins around age 2 and involves destroying or losing objects."],["Late anal","This period involves control and withholding, and it comes after infancy."]]],["A teething 10-month-old responds to people by biting, cooing, closing her mouth, smiling, and crying. Which Freudian phase is this?",[["Oral-sadistic (oral-aggressive)","These are the ways infants respond to others during this phase of the oral stage."],["Oral-receptive","This phase is marked by satisfied needs and no ambivalence, not by biting and closing the mouth."],["Early anal","This period involves frustration over toilet training, which is later."],["Phallic","This stage runs from 3 to 6 years and centers on the Oedipus complex."]]],["A 2-year-old smashes toys and lashes out at her parents during frustrating toilet training. Which Freudian period is this?",[["Early anal","Satisfaction comes from destroying or losing objects, and frustrating toilet training can provoke aggression toward parents."],["Late anal","This period shifts to control and withholding, with mastery over one’s body."],["Oral-sadistic","This belongs to infancy and involves biting and crying, not toilet-training conflict."],["Phallic","This is the later stage of the Oedipus complex."]]],["A 3-year-old proudly holds back and shows mastery over his body, and he takes a friendly interest in his feces. Which Freudian period is this?",[["Late anal","The shift toward control and withholding, with friendly interest in feces, defines this period."],["Early anal","This period involves destroying or losing objects and aggression over toilet training."],["Latency","This is a later stage focused on socialization."],["Genital","This is the stage from puberty onward."]]],["A 4-year-old boy wants to be like his father, has sexual desires toward his mother, and fears punishment. Which stage and anxiety does Freud describe?",[["Phallic stage and castration anxiety","This is the male Oedipus complex, which occurs in the phallic stage."],["Anal stage and castration anxiety","The anal stage centers on toilet training, so the stage is wrong."],["Phallic stage and penis envy","Penis envy belongs to the female Oedipus complex."],["Latency and castration anxiety","Latency is the later period of socialization."]]],["How does Freud say a boy’s Oedipus complex is resolved?",[["He represses it, takes his father as a role model, and internalizes his authority, forming the superego","Repression and identification with the father lead to the creation of the superego."],["He gives up his desire for his father and reidentifies with his mother","This describes the resolution of the female complex."],["His libido shifts to his father","That is part of the female complex, not the male."],["He inherits images from ancestors","That describes phylogenetic endowment, a separate concept."]]],["A 5-year-old girl feels betrayed that she was brought into the world without a penis, and her libido shifts toward her father. Which concepts apply?",[["Female Oedipus complex with penis envy","This is the pattern Freud described for girls in the phallic stage."],["Male Oedipus complex with castration anxiety","This describes boys, who fear punishment from the father."],["Early anal period","This concerns toilet training and aggression, not libido shifting to a parent."],["Phylogenetic endowment","This concerns inherited experiences, not the girl’s libido shifting."]]],["How does the superego formed after the female Oedipus resolution compare with the male one?",[["Weaker, more flexible, and less severe","Her resolution, giving up desire for the father and reidentifying with her mother, is less traumatic."],["Stronger, more rigid, and more severe","This describes the male superego, formed under father’s authority."],["Identical in strength","Freud described the two as different."],["It does not form","The superego forms in both cases."]]],["A Freudian explains a latency-age child’s sudden fear of snakes as inherited experiences and images passed down from ancestors. Which concept is this?",[["Phylogenetic endowment","Inherited experiences and images from ancestors influence the unconscious mind."],["Castration anxiety","This is a boy’s fear of punishment in the Oedipus complex."],["Penis envy","This is part of the female Oedipus complex."],["Libido","Libido is the sexual energy, not inherited images."]]],["A student claims that Freud’s genital stage runs from 6 years to puberty and centers on socialization. How should this be evaluated?",[["Incorrect: socialization defines latency, and the genital stage begins at puberty","Latency spans 6 years to puberty, and genital runs from puberty onward."],["Correct: genital is the stage of socialization","The genital stage is linked to sexual intercourse, not socialization."],["Incorrect: socialization defines the phallic stage","The phallic stage is ages 3 to 6, with the Oedipus complex."],["Incorrect: socialization defines the oral stage","The oral stage is birth to 2 years, centered on the mouth."]]],["In Erikson’s theory, what is a psychological crisis?",[["The individual’s psychological needs conflicting with society’s needs","Each stage presents such a conflict."],["A conflict between the id and the superego","That is a Freudian idea about personality structure."],["A fixation caused by toilet training","That is a Freudian anal-stage outcome."],["Losing object permanence","That is a Piagetian sensorimotor concept."]]],["Erikson extended Freud’s theory. Each of his stages is a conflict between which elements?",[["Syntonic and dystonic","Each stage involves an interaction of opposites, such as trust and mistrust."],["Id and ego","These are Freud’s provinces of the mind."],["Assimilation and accommodation","These are Piaget’s adaptation processes."],["Reinforcement and punishment","These are operant conditioning procedures."]]],["An infant’s needs are met so reliably that she is never wary of anything. Which Erikson maladaptation could result?",[["Sensory distortion","Too much trust distorts reality, and it is the maladaptation of Trust vs Mistrust."],["Withdrawal","This is the core pathology, associated with too much mistrust."],["Impulsivity","This is the maladaptation of Autonomy vs Shame and Doubt."],["Ruthlessness","This is the maladaptation of Initiative vs Guilt."]]],["A 2½-year-old accepts no limits and acts on every impulse. Which Erikson maladaptation is this?",[["Impulsivity","It is the maladaptation of Autonomy vs Shame and Doubt, too much autonomy."],["Compulsion","This is the core pathology of the same stage, caused by too much shame and doubt."],["Sensory distortion","This belongs to Trust vs Mistrust."],["Narrow virtuosity","This belongs to Industry vs Inferiority."]]],["A 4-year-old pushes over others to carry out her plans and feels no guilt. Which Erikson maladaptation is this?",[["Ruthlessness","It is the maladaptation of Initiative vs Guilt, too much initiative without guilt."],["Inhibition","This is the core pathology, from too much guilt."],["Impulsivity","This belongs to Autonomy vs Shame and Doubt."],["Fanaticism","This belongs to Identity vs Identity Confusion."]]],["An 11-year-old pours all her effort into one skill, chess, and neglects everything else. Which Erikson maladaptation is this?",[["Narrow virtuosity","It is the maladaptation of Industry vs Inferiority, too much focus on one skill."],["Inertia","This is the core pathology, from feeling inferior and doing nothing."],["Ruthlessness","This belongs to Initiative vs Guilt."],["Overextension","This belongs to Generativity vs Stagnation."]]],["A 17-year-old adopts a cause so rigidly that she cannot tolerate other views. Which Erikson maladaptation is this?",[["Fanaticism","It is the maladaptation of Identity vs Identity Confusion."],["Role repudiation","This is the core pathology, rejecting roles from identity confusion."],["Promiscuity","This belongs to Intimacy vs Isolation."],["Presumption","This belongs to Integrity vs Despair."]]],["A 24-year-old drifts from one casual relationship to another with no depth or commitment. Which Erikson maladaptation is this?",[["Promiscuity","It is the maladaptation of Intimacy vs Isolation."],["Exclusivity","This is the core pathology, closing oneself off from others."],["Fanaticism","This belongs to Identity vs Identity Confusion."],["Overextension","This belongs to Generativity vs Stagnation."]]],["Which statement correctly distinguishes the core pathology from the maladaptation of Generativity vs Stagnation?",[["Rejectivity is the core pathology, and overextension is the maladaptation","These are the two ways the stage can go wrong, with care as the ego strength."],["Overextension is the core pathology, and rejectivity is the maladaptation","This reverses the two."],["Care is the core pathology, and wisdom is the maladaptation","Care is the ego strength and wisdom belongs to the final stage."],["Exclusivity is the core pathology, and promiscuity is the maladaptation","These belong to Intimacy vs Isolation."]]],["A counselor says an old man who dismisses all regrets and assumes his choices were perfect shows the core pathology of disdain. How should this be evaluated?",[["Incorrect: assuming one’s choices were perfect is presumption, and disdain is the core pathology of the opposite excess","In Integrity vs Despair, presumption is the maladaptation and disdain is the core pathology."],["Correct: disdain is the maladaptation","Disdain is the core pathology, not the maladaptation."],["Incorrect: he is in Generativity vs Stagnation","Age 60 and above is Integrity vs Despair."],["Correct: disdain is the ego strength","The ego strength of this stage is wisdom."]]],["Which row correctly matches an Erikson stage with its mode and age range?",[["Initiative vs Guilt, genital-locomotor, 3 to 5 years","The play age is linked to the genital-locomotor mode."],["Autonomy vs Shame and Doubt, oral-sensory, 2 to 3 years","Oral-sensory belongs to Trust vs Mistrust, and Autonomy uses anal-urethral-muscular."],["Industry vs Inferiority, latency, 12 to 18 years","Industry vs Inferiority is school age, 6 to 12 years."],["Intimacy vs Isolation, genitality, 31 to 60 years","Intimacy vs Isolation is 19 to 30 years, and 31 to 60 is Generativity vs Stagnation."]]],["A student compares Erikson’s stage labels with the age labels used in other life-span systems. How should the 2 to 3 year stage, Autonomy vs Shame and Doubt, be labeled?",[["Early childhood in Erikson’s theory, comparable to toddlerhood elsewhere","Erikson calls this stage early childhood. In general age labels the same years are called toddlerhood, which is a useful memory aid when comparing systems."],["Infancy in Erikson’s theory, comparable to toddlerhood elsewhere","Infancy is Erikson’s label for birth to 1 year, Trust vs Mistrust."],["Play age in Erikson’s theory, comparable to preschool elsewhere","The play age is Erikson’s label for 3 to 5 years, Initiative vs Guilt."],["School age in Erikson’s theory, comparable to middle childhood elsewhere","School age is Erikson’s label for 6 to 12 years, Industry vs Inferiority."]]]]},{"id":3,"lec":1,"t":"Learning Perspective (Skinner, Pavlov, and Bandura)","q":[["A researcher explains a child’s growth by tracing how the environment shapes what the child does, studying only behavior she can observe. Which perspective is she using?",[["Learning","Development results from learning due to environmental influence, studying observable behavior."],["Psychoanalytic","That focuses on unconscious emotions and drives."],["Cognitive","That analyzes thought processes."],["Ethological","That stresses evolutionary and biological underpinnings."]]],["A trainer changes a dog’s behavior by adjusting what happens right after the behavior. Which approach is she using?",[["Operant conditioning","It uses consequences to modify a behavior."],["Classical conditioning","That pairs a conditioned stimulus with an unconditioned stimulus."],["Observational learning","That is learning by observing and imitating models."],["Modeling","That is the heart of observational learning, not a use of consequences."]]],["In a classic experiment, an animal learns to press a lever when pressing is followed by food. Which proponent and subject match?",[["Skinner, using a rat","Skinner’s operant conditioning experiments used a rat."],["Pavlov, using a rat","Pavlov is the proponent of classical conditioning."],["Bandura, using a rat","Bandura is the proponent of social cognitive theory."],["Skinner, using a monkey","Skinner’s well-known experiment used a rat."]]],["A student gets a sticker every time she finishes her homework, and she now finishes it more often. Which procedure is this?",[["Positive reinforcement","A favorable stimulus follows the behavior."],["Negative reinforcement","That removes an unfavorable stimulus after the behavior."],["Positive punishment","That follows the behavior with an aversive stimulus."],["Negative punishment","That removes a favorable stimulus after the behavior."]]],["A driver’s seatbelt alarm keeps beeping until she buckles up, so now she buckles up the moment she sits down. Which procedure is this?",[["Negative reinforcement","The behavior is followed by the removal of an aversive stimulus (the beeping)."],["Positive reinforcement","That adds a favorable stimulus."],["Positive punishment","That adds an aversive stimulus."],["Negative punishment","That removes a favorable stimulus."]]],["A boy is scolded each time he interrupts, and he interrupts less often. Which procedure is this?",[["Positive punishment","An aversive stimulus (the scolding) follows the behavior."],["Negative punishment","That removes a favorable stimulus."],["Negative reinforcement","That removes an aversive stimulus and increases a behavior."],["Positive reinforcement","That adds a favorable stimulus."]]],["A teen loses her phone privileges after breaking curfew, and she breaks curfew less often. Which procedure is this?",[["Negative punishment","A favorable stimulus (the phone) is removed after the behavior."],["Positive punishment","That adds an aversive stimulus."],["Negative reinforcement","That removes an aversive stimulus."],["Positive reinforcement","That adds a favorable stimulus."]]],["Which statement correctly separates negative reinforcement from positive punishment?",[["Negative reinforcement removes an aversive stimulus, and positive punishment adds one","Removal of an unpleasant stimulus versus presentation of one."],["Negative reinforcement adds an aversive stimulus, and positive punishment removes one","This reverses the two procedures."],["Both remove a favorable stimulus","Removing a favorable stimulus is negative punishment."],["Both add a favorable stimulus","Adding a favorable stimulus is positive reinforcement."]]],["A coach praises a player after every good pass at first, and later only after some of her good passes. Which schedules is she using, in order?",[["Continuous, then intermittent","Reinforcement after every correct response, then after only some."],["Intermittent, then continuous","This reverses the order."],["Fixed ratio, then fixed interval","Both are intermittent schedules, so neither is continuous."],["Variable ratio, then variable interval","Both are intermittent schedules, so neither is continuous."]]],["A factory worker earns a bonus after every 20 items she assembles. Which schedule is this?",[["Fixed ratio","Reinforcement after a specified number of responses."],["Variable ratio","The number of responses needed varies unpredictably."],["Fixed interval","Reinforcement depends on a specified length of time, not on a count."],["Variable interval","Reinforcement depends on an unpredictable amount of time."]]],["A slot machine pays out after an unpredictable number of pulls. Which schedule is this?",[["Variable ratio","Reinforcement after a varying number of responses."],["Fixed ratio","The number of responses needed stays the same."],["Fixed interval","Reinforcement depends on a specified length of time."],["Variable interval","Reinforcement depends on an unpredictable amount of time, not on counting pulls."]]],["A child checks the mailbox more and more as Saturday approaches, because her allowance arrives every Saturday. Which schedule is this?",[["Fixed interval","Reinforcement after a specified length of time."],["Variable interval","The time between reinforcements is unpredictable."],["Fixed ratio","Reinforcement depends on a number of responses, not on time."],["Variable ratio","The number of responses varies, which is not what happens here."]]],["A manager drops by at unpredictable times and praises whoever is working at that moment. Which schedule is this?",[["Variable interval","Reinforcement for the first response after an unpredictable, fluctuating amount of time."],["Fixed interval","The time between reinforcements stays the same."],["Fixed ratio","Reinforcement depends on a count of responses."],["Variable ratio","Reinforcement depends on a varying count of responses, not on elapsed time."]]],["A researcher sounds a bell just before giving a dog food, again and again, until the bell alone makes the dog salivate. What is happening?",[["Classical conditioning","A conditioned stimulus is paired with an unconditioned stimulus until it elicits the response alone."],["Operant conditioning","That uses consequences to modify behavior."],["Observational learning","That is learning by observing and imitating models."],["Modeling","That is the heart of observational learning."]]],["A child hears an ice cream truck jingle each time ice cream arrives, and now drools at the jingle alone. What is the jingle called?",[["Conditioned stimulus","A neutral stimulus that comes to elicit a response through pairing."],["Unconditioned stimulus","That is the ice cream, which naturally elicits the response."],["Reinforcer","That is an operant concept: a consequence following behavior."],["Model","That is a person observed and imitated in observational learning."]]],["After the bell is sounded many times without food, the dog salivates less and less. What is this called?",[["Extinction","The conditioned response weakens."],["Spontaneous recovery","That is the reappearance of the conditioned behavior."],["Generalization","That is responding to similar stimuli."],["Discrimination","That is responding only to the conditioned stimulus."]]],["After weeks of no pairing, the dog suddenly salivates at the bell again. What is this called?",[["Spontaneous recovery","The conditioned behavior reappears after it had weakened."],["Extinction","That is the weakening of the conditioned response."],["Generalization","That is responding to similar stimuli."],["Discrimination","That is responding only to the conditioned stimulus."]]],["A child bitten by one dog becomes afraid of all dogs, including ones she has never met. What is this called?",[["Generalization","Responding not only to the conditioned stimulus but also to similar stimuli."],["Discrimination","That is responding only to the conditioned stimulus."],["Extinction","That is the weakening of the conditioned response."],["Spontaneous recovery","That is the reappearance of the conditioned behavior."]]],["A dog salivates to the training bell but not to a doorbell with a different sound. What is this called?",[["Discrimination","Responding only to the conditioned stimulus."],["Generalization","That is responding to similar stimuli as well."],["Extinction","That is the weakening of the conditioned response."],["Spontaneous recovery","That is the reappearance of the conditioned behavior."]]],["A researcher argues that children learn largely by watching how other people behave, not only through direct rewards. Which theory is this?",[["Bandura’s social cognitive theory","It emphasizes how people learn by observing others."],["Skinner’s operant conditioning","That is about consequences that follow a behavior."],["Pavlov’s classical conditioning","That is about pairing stimuli."],["Freud’s psychosexual theory","That is a psychoanalytic theory."]]],["A young boy copies the way his older brother ties his shoes. What is the central process of observational learning at work?",[["Modeling","Modeling is the heart of observational learning: learning by observing and imitating models."],["Extinction","That is the weakening of a conditioned response."],["Reinforcement","That is a consequence that follows behavior."],["Discrimination","That is responding only to the conditioned stimulus."]]],["A girl carefully watches her coach demonstrate a dance move. Which step of Bandura’s model is this?",[["Attentional process","Watching the model."],["Retentional process","That is recalling the steps from the model."],["Motor reproductive process","That is learning to perform the behavior."],["Incentive and motivational process","That is deciding whether to continue the behavior."]]],["Later at home, a boy remembers each step of the craft his teacher demonstrated. Which step of Bandura’s model is this?",[["Retentional process","Recalling the steps from the model."],["Attentional process","That is watching the model."],["Motor reproductive process","That is learning to perform the behavior."],["Incentive and motivational process","That is deciding whether to continue the behavior."]]],["A child practices the moves she saw until she can perform them herself. Which step of Bandura’s model is this?",[["Motor reproductive process","Learning the behavior."],["Attentional process","That is watching the model."],["Retentional process","That is recalling the steps."],["Incentive and motivational process","That is deciding whether to continue the behavior."]]],["After learning a dance, a boy keeps doing it because his classmates cheer for it. Which step of Bandura’s model is this?",[["Incentive and motivational process","Determining whether to continue the behavior after learning it."],["Attentional process","That is watching the model."],["Retentional process","That is recalling the steps."],["Motor reproductive process","That is learning to perform the behavior."]]]]},{"id":4,"lec":1,"t":"Cognitive Perspective (Piaget & Vygotsky)","q":[["A researcher studies how children reason and solve problems, not just the behavior they show. Which perspective is she using?",[["Cognitive","It analyzes thought processes."],["Learning","That studies observable behavior shaped by the environment."],["Psychoanalytic","That focuses on unconscious emotions and drives."],["Ethological","That stresses evolutionary and biological underpinnings."]]],["A psychologist argues that children’s intelligence changes as they grow, and her theory is considered a cornerstone of the study of human development. Which theory is this?",[["Piaget’s cognitive development theory","It holds that intelligence undergoes changes as children grow, and it is among the most influential theories."],["Vygotsky’s sociocultural theory","It stresses social and cultural processes and learning through social interaction."],["Bandura’s social cognitive theory","It emphasizes learning by observing others."],["Skinner’s operant conditioning","It uses consequences to modify behavior."]]],["A toddler sorts her toy animals into “ones that fly” and “ones that swim.” Which process of cognitive growth is this?",[["Organization","The process of creating categories."],["Adaptation","That is handling new information using what the child already knows."],["Assimilation","That is incorporating new information into existing structures."],["Equilibration","That is keeping a balance between schemas and new experiences."]]],["A child builds an organized mental category for “birds.” What is the product of this process called?",[["Schema","Schemas are the product of organization."],["Scaffold","That is temporary support given to a child in a task."],["Conservation","That is understanding that quantity stays the same despite changes in appearance."],["Animism","That is believing objects have human feelings and intentions."]]],["A child meets an unfamiliar fruit and uses what she already knows about fruit to figure out how to handle it. Which overall process is this?",[["Adaptation","Handling new information using what the child already knows."],["Organization","That is creating categories, with schemas as the product."],["Equilibration","That is maintaining balance between schemas and new experiences."],["Egocentrism","That is difficulty seeing another person’s viewpoint."]]],["A toddler who knows the word “dog” points to a horse and calls it a dog. Which process is this?",[["Assimilation","New information is incorporated into an existing cognitive structure."],["Accommodation","That is adjusting the structure to fit new information."],["Organization","That is creating categories."],["Equilibration","That is balancing schemas and new experiences."]]],["After being told that horses are not dogs, the toddler creates a new category for horses. Which process is this?",[["Accommodation","Cognitive structures are adjusted to fit new information."],["Assimilation","That is fitting new information into existing structures."],["Organization","That is creating categories in general."],["Equilibration","That is balancing schemas and new experiences."]]],["Which statement correctly separates assimilation from accommodation?",[["Assimilation fits new information into existing structures, and accommodation changes the structures","Both fall under adaptation."],["Assimilation changes the structures, and accommodation fits new information into them","This reverses the two processes."],["Assimilation creates categories, and accommodation maintains balance","Those describe organization and equilibration."],["Both create categories","Creating categories is organization."]]],["A child is puzzled when her categories fail to explain something new, adjusts them, and then feels things make sense again. Which process describes this balance between schemas and new experiences?",[["Equilibration","How children maintain balance between existing mental frameworks and new experiences."],["Organization","That is creating categories."],["Assimilation","That is only one part of adaptation."],["Accommodation","That is only one part of adaptation."]]],["Which list gives Piaget’s stages of cognitive development in the correct order?",[["Sensorimotor, pre-operational, concrete operational, formal operational","The correct order from birth onward."],["Pre-operational, sensorimotor, concrete operational, formal operational","The first two stages are swapped."],["Sensorimotor, concrete operational, pre-operational, formal operational","The middle two stages are swapped."],["Formal operational, concrete operational, pre-operational, sensorimotor","This reverses the order."]]],["A 6-month-old stops looking for a toy once a cloth covers it, as if it no longer exists. What does this show?",[["No object permanence yet","Typical of the sensorimotor stage, birth to 2 years."],["Animism","That is believing objects have human feelings and intentions."],["Egocentrism","That is difficulty seeing another person’s viewpoint."],["Failure of conversion","That is a concrete operational limitation."]]],["A newborn grasps and sucks by reflex. Which Piagetian stage is she in?",[["Sensorimotor","Birth to 2 years, with simple reflexes."],["Pre-operational","That is 2 to 7 years."],["Concrete operational","That is 7 to 11 years."],["Formal operational","That is 11 years onward."]]],["A 4-year-old says the sun is sad because the clouds are hiding it. What is this called?",[["Animism","Believing objects have human feelings and intentions."],["Artificialism","That is believing environmental features are due to human intervention."],["Egocentrism","That is difficulty seeing another person’s viewpoint."],["Object permanence","That is knowing objects still exist when out of sight."]]],["A 5-year-old insists that people built the moon and switch it on every night. What is this called?",[["Artificialism","Believing environmental characteristics are due to human interventions."],["Animism","That is believing objects have human feelings and intentions."],["Egocentrism","That is difficulty seeing another person’s viewpoint."],["Assimilation","That is incorporating new information into existing structures."]]],["A 4-year-old on a phone call holds up her drawing and says “Look at this!” to her grandfather, assuming he sees what she sees. What is this called?",[["Egocentrism","Difficulty seeing things from another person’s point of view, typical of the pre-operational stage."],["Animism","That is believing objects have human feelings and intentions."],["Artificialism","That is believing the environment is made by humans."],["Accommodation","That is adjusting cognitive structures to new information."]]],["Which pairing of stage and age range is correct?",[["Pre-operational: 2 to 7 years","The stage of animism, artificialism, and egocentrism."],["Concrete operational: 2 to 7 years","Concrete operational is 7 to 11 years."],["Sensorimotor: 7 to 11 years","Sensorimotor is birth to 2 years."],["Formal operational: birth to 2 years","Formal operational is 11 years onward."]]],["A 9-year-old solves logical puzzles and does basic math, but is still fooled when the same amount of water is poured into a taller glass. Which stage is she in?",[["Concrete operational","7 to 11 years: logical problem solving and basic math, but conversion is not yet understood."],["Pre-operational","That is 2 to 7 years, with animism, artificialism, and egocentrism."],["Formal operational","That stage begins at 11 and adds abstract thinking."],["Sensorimotor","That is birth to 2 years."]]],["Which is the best example of what a child in the concrete operational stage can do?",[["Solve problems logically and do basic math","Typical of 7 to 11 years."],["Reason about hypothetical situations","That belongs to the formal operational stage."],["Interpret metaphor in literature","That belongs to the formal operational stage."],["Search for a hidden object","Object permanence is a sensorimotor achievement."]]],["A 13-year-old debates what society would be like if there were no rules and enjoys algebra. Which stage is she in?",[["Formal operational","11 years onward: abstract thinking and hypothetical situations."],["Concrete operational","That is 7 to 11 years, with concrete logical problems."],["Pre-operational","That is 2 to 7 years."],["Sensorimotor","That is birth to 2 years."]]],["Which activity best shows formal operational thinking?",[["Analyzing the metaphors in a poem","Literary criticism and metaphor use reflect abstract thinking, typical of 11 years onward."],["Sorting blocks by color","That is basic categorizing, possible earlier."],["Searching for a hidden toy","That relates to object permanence in the sensorimotor stage."],["Believing the moon follows her","That reflects pre-operational thinking."]]],["A researcher argues that children’s thinking develops through collaboration and social interaction within their culture. Which theory is this?",[["Vygotsky’s sociocultural theory","It emphasizes social and cultural processes and learning through social interaction."],["Piaget’s cognitive development theory","It traces stages of changing intelligence."],["Bandura’s social cognitive theory","A learning theory about observing models."],["Skinner’s operant conditioning","A learning theory about consequences."]]],["A girl cannot solve a puzzle alone but can with a teacher’s help. What is the gap between what she can do alone and what she can’t yet do called?",[["Zone of proximal development","The gap between what children can already do and what they are not quite ready to do by themselves."],["Scaffolding","That is the temporary support given, not the gap."],["Schema","That is a mental category."],["Equilibration","That is the balance between schemas and new experiences."]]],["A tutor gives a child hints at first and then gradually withdraws them as the child improves. What is this temporary support called?",[["Scaffolding","Temporary support given to a child in doing a task."],["Zone of proximal development","That is the gap, not the support."],["Accommodation","That is adjusting cognitive structures."],["Assimilation","That is fitting information into existing structures."]]],["Which statement best contrasts Piaget and Vygotsky?",[["Piaget traces stages of changing intelligence, and Vygotsky stresses social and cultural interaction","Piaget: cognitive development theory. Vygotsky: sociocultural theory."],["Piaget stresses social interaction, and Vygotsky traces stages","This reverses their emphases."],["Both are learning theories studying only observable behavior","Both are cognitive theories."],["Both focus on unconscious drives","That is the psychoanalytic perspective."]]],["A 10-year-old can’t do long division alone but succeeds with her teacher’s temporary hints. Which terms apply?",[["Zone of proximal development and scaffolding","The gap she can’t yet bridge alone, and the temporary support that helps her cross it."],["Zone of proximal development and assimilation","Assimilation is fitting new information into existing structures, not support from a teacher."],["Equilibration and scaffolding","Equilibration is about balancing schemas and new experiences."],["Egocentrism and accommodation","Egocentrism is difficulty seeing others’ viewpoints, and accommodation is adjusting structures."]]]]},{"id":5,"lec":1,"t":"Lecture 1 Comprehensive Review","q":[["A school wants struggling readers to catch up, so it adds extra tutoring sessions for them. Which goal does the tutoring serve?",[["Intervention","Intervention means applying what is known to improve or optimize development. Extra tutoring for struggling readers is an action meant to help them catch up."],["Description","Description only records what development looks like. The school is acting on the problem, not just documenting it."],["Explanation","Explanation asks why something happens. The tutoring tries to help children, not to find out what caused their difficulties."],["Prediction","Prediction forecasts future outcomes. The school is responding to a current difficulty, not forecasting who will struggle."]]],["Researchers use toddlers’ early vocabulary scores to forecast who will struggle in school. Which goal is this?",[["Prediction","Prediction uses present information to forecast later outcomes. Early vocabulary scores are used to anticipate who will struggle in school, before any struggle happens."],["Explanation","Explanation looks for the causes of a pattern. Forecasting who will struggle does not tell you why they struggle."],["Description","Description records what development looks like at a given point. These researchers are using the scores to look ahead, not simply to report them."],["Intervention","Intervention means acting to change development. Nothing here changes how the toddlers develop."]]],["A study asks why some infants begin babbling earlier than others. Which goal is this?",[["Explanation","Explanation seeks the causes behind a pattern. Asking why some infants babble earlier than others is a search for reasons."],["Description","Description would only record when infants babble. It would not say why they differ."],["Prediction","Prediction would forecast who will babble early. The study asks for reasons, not forecasts."],["Intervention","Intervention would try to change when infants babble. The study is trying to understand, not to change anything."]]],["A study measures how quickly teenagers gain height, bone density, and muscle. Which domain is this?",[["Physical","Physical development covers growth of the body and brain, sensory capacities, motor skills, and health. Height, bone density, and muscle are all bodily growth."],["Cognitive","Cognitive development covers learning, memory, attention, language, and reasoning. None of those are being measured here."],["Psychosocial","Psychosocial development covers emotions, personality, and social relationships. The study measures the body, not feelings or relationships."],["Nurture","Nurture is an influence on development, namely the environment. It is not one of the three domains."]]],["A researcher studies how preschoolers’ attention and memory improve with age. Which domain is this?",[["Cognitive","Cognitive development covers learning, memory, attention, language, and reasoning. Attention and memory improving with age fall squarely here."],["Physical","Physical development covers body growth, motor skills, and health, which this study is not measuring."],["Psychosocial","Psychosocial development covers emotions, personality, and relationships. Attention and memory are thinking skills, not social or emotional ones."],["Maturation","Maturation is the unfolding of a natural sequence of changes. It is a process, not a domain."]]],["Identical twins raised in different homes end up with strikingly similar hobbies. Which view does this lean toward?",[["Nature","Nature refers to heredity, and twin studies are used to examine it. Twins raised apart who end up with similar hobbies suggest genes contribute to those interests."],["Nurture","Nurture refers to environment, which adoption studies examine. These twins grew up in different homes, so shared upbringing cannot explain the similarity."],["Cohort effect","A cohort effect concerns people born around the same time sharing experiences. It does not explain similarities between twins raised in different homes."],["Normative event","Normative events are experiences that influence most people in a society. They do not explain why two specific individuals match."]]],["People born in 2003 are tracked over their lives as one group. What is this group called?",[["A cohort","A cohort is a group of people born at about the same time. Everyone born in 2003 qualifies, whatever they have lived through."],["A historical generation","A historical generation is a group that experienced an event at a formative time. Birth year alone does not make them one."],["A normative event","A normative event is something that influences most people in a society. It is an event, not a group of people."],["A maturation group","Maturation is the unfolding of a natural sequence of changes. It is a process, not a group."]]],["A war affects an entire country, and those who were young adults at the time are shaped most. What are they called?",[["A historical generation","A historical generation is a group that experienced an event at a formative time of life. Young adults during a major war fit this description."],["A cohort","A cohort is simply people born at about the same time. It says nothing about being shaped by an event."],["An age-graded group","Age-graded refers to events specific to an age group, like starting school. A war affecting the whole country is tied to a historical period instead."],["A maturation group","Maturation is the unfolding of a natural sequence of changes. It is a process, not a group shaped by an event."]]],["A philosopher says the mind starts out blank and experience writes on it. Whose view is this?",[["Locke’s","Locke described the mind as a blank slate (tabula rasa) written on by experience. This is the mechanistic view of humans as machines operated by the environment."],["Rousseau’s","Rousseau held the organismic view: instincts and individual potential, with people setting their own development. That is the opposite of a blank slate."],["Bandura’s","Bandura is a learning theorist who studied learning by observation. He is not the philosopher behind the blank-slate idea."],["Erikson’s","Erikson proposed the psychosocial stages. He is not associated with the blank-slate view."]]],["A theorist describes development as smooth, gradual growth in skills with no sudden jumps. Which view is this?",[["Continuity","Continuity describes development as gradual, incremental, quantitative change. Smooth growth with no sudden jumps is exactly that."],["Discontinuity","Discontinuity describes abrupt, qualitative change, as in stage theories. The theorist here rules out sudden jumps."],["Organismic","The organismic model concerns people as active in their own development, not whether change is smooth or sudden."],["Mechanistic","The mechanistic model concerns humans as machines operated by the environment, not the smoothness of change."]]],["A retired man joins a walking club and his stamina improves noticeably over a year. Which principle is shown?",[["Plasticity","Plasticity means abilities like memory, strength, and endurance can improve with training, even late in life. A retiree gaining stamina from walking shows this."],["Multidirectionality","Multidirectionality means gains in one area may come with losses in another. Nothing is lost in this example."],["Contextuality","Contextuality means development occurs within settings like family, school, and country. The example is about training, not setting."],["Co-construction","Co-construction concerns the shifting balance of biology and culture. It does not describe improvement through practice."]]],["A young adult gains independence but loses some closeness with her parents at the same time. Which principle is shown?",[["Multidire

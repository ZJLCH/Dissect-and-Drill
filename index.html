ctionality","Multidirectionality means people may gain in one area while losing in another, sometimes at the same time. Independence gained alongside closeness lost is a clear case."],["Plasticity","Plasticity concerns improving an ability through training. The example is not about training."],["Contextuality","Contextuality concerns settings shaping development. The example is about simultaneous gain and loss, not about setting."],["Lifelong development","Development being lifelong is true, but it only says change continues. It does not capture gains and losses happening together."]]],["A child in a conflict zone and a child in a peaceful village grow up very differently. Which principle explains this?",[["Contextuality","Contextuality means development occurs within settings such as families, peer groups, schools, and countries. A conflict zone and a peaceful village are very different settings."],["Plasticity","Plasticity concerns improving abilities through practice. It does not explain differences between settings."],["Multidirectionality","Multidirectionality concerns simultaneous gains and losses. The example contrasts environments, not gains and losses."],["Changing resource allocations","Changing resource allocations concerns how individuals invest their time, energy, and money. The two children are not choosing how to invest anything."]]],["Which statement best reflects that development is multidimensional?",[["Body, mind, and relationships influence one another","Multidimensional means development has interacting domains: biological, social, cognitive, and psychosocial. Body, mind, and relationships influencing one another expresses that."],["Only genes drive change","Saying only genes drive change ignores that several domains and influences interact."],["Development stops at age 20","Saying development stops at 20 contradicts the principle that development is a lifelong process of change."],["Only school affects development","Saying only school matters ignores other settings and domains. Development is shaped by many interacting influences."]]],["A woman in her sixties starts a new career and learns a language. Which principle does this reflect most directly?",[["Development is lifelong","Development is lifelong: it is a process of change that continues across the whole lifespan. Starting a new career and a new language in her sixties shows ongoing change."],["Multidirectionality","Multidirectionality means gains alongside losses. The example shows continued growth, not loss."],["Co-construction","Co-construction concerns the changing balance of biology and culture. It does not speak to development continuing late in life."],["Changing resource allocations","Changing resource allocations concerns choices about investing time and energy. The example is about continuing change itself."]]],["A student skips weekend outings to train for a competition. Which principle is shown?",[["Changing resource allocations","Changing resource allocations means individuals choose how to invest time, energy, talent, money, and social support. Skipping outings to train is such a choice."],["Multidimensionality","Multidimensionality means domains interact. The example is about a choice, not interacting domains."],["Contextuality","Contextuality means settings shape development. The student is making a personal choice, not being shaped by a setting."],["Plasticity","Plasticity means training improves an ability. The point here is the trade-off she made, not the improvement."]]],["A researcher randomly assigns families to a sleep-training plan or no plan and compares toddler tantrums. What can she conclude?",[["Whether the plan caused a difference","An experiment uses controlled procedures with independent and dependent variables, so it can establish cause and effect. Random assignment lets her say whether the plan caused changes in tantrums."],["Only that the two are associated","Showing only an association is the limit of correlational studies. A controlled experiment can go further."],["How individual toddlers change with age","Seeing how individual toddlers change with age requires following the same children over time, as in a longitudinal study."],["Whether the pattern is universal across cultures","Testing whether a pattern is universal across cultures is a strength of ethnographic studies, not of this experiment."]]],["A study finds that parents’ reading time goes with children’s vocabulary scores. What is the best conclusion?",[["Reading time can predict vocabulary, but cause isn’t shown","Correlation enables prediction of one variable from another, but it cannot establish cause and effect. Reading time may predict vocabulary without being shown to cause it."],["Reading time causes vocabulary growth","Correlation cannot establish that reading time causes vocabulary growth. Only a controlled experiment can show that."],["Vocabulary causes parents to read more","The direction of cause is not shown either. A relationship does not tell you which variable, if either, drives the other."],["The study proves a universal pattern","Correlation does not show a pattern is universal. That would need work across cultures."]]],["A detailed study of one child prodigy produces rich description. What can it not do well?",[["Generalize to others","A case study is an in-depth study of one individual, so results can’t be generalized to others. One prodigy may not be typical."],["Describe the person in detail","Detailed description of the person is actually a strength of case studies, so it is not a weakness."],["Generate hypotheses","Generating hypotheses is also a strength of case studies."],["Offer vivid information","Rich, vivid information is the main strength of this method."]]],["An ethnographer lives with a fishing community for a year. Which is a strength of this method?",[["It can test universality of developmental phenomena","Ethnographic studies can test the universality of developmental phenomena by looking at other cultures. Living with a fishing community helps show whether a pattern appears there too."],["It can establish cause and effect","Establishing cause and effect belongs to experimental studies. Ethnography describes a culture in depth."],["It avoids observer bias","Observer bias is actually the main weakness of ethnographic studies, so it is not a strength."],["It uses large random samples","Ethnographic studies are in-depth studies of one culture, not large random samples."]]],["A cross-sectional study finds 8-year-olds outperform 4-year-olds on a task. What can’t the researcher claim?",[["That individual children changed with age","A cross-sectional study compares different people at different ages, so it can’t establish that individual children changed with age. It only shows the groups differ."],["That the two age groups differ","Showing that the two groups differ is exactly what it can do, because it shows similarities and differences across ages."],["That the study was quick","Being speedy is a strength, not a limit on claims."],["That no participants dropped out","Having no attrition problems is a strength of cross-sectional studies, not a limit on claims."]]],["A longitudinal study’s results come from the 150 families who stayed for 15 years. Which limitation applies?",[["Results may be valid only for the sample","Longitudinal studies suffer attrition, so results from the families who stayed may be valid only for that sample. The ones who remained may differ from those who left."],["It can’t show age-related change","Showing age-related change is a strength of longitudinal studies, not a limitation."],["It is fast and cheap","Longitudinal studies are time consuming and expensive, not fast and cheap."],["It has no attrition problem","Attrition is a typical problem for longitudinal studies, so they do have it."]]],["Which description matches a sequential study?",[["Following several age groups over time","A sequential study combines cross-sectional and longitudinal designs. Following several age groups over time does exactly that."],["Observing one person once","Observing one person once resembles a case study, not a sequential design."],["Correlating two variables once","Correlating two variables once describes a correlational study."],["Studying one culture in depth","Studying one culture in depth describes an ethnographic study."]]],["Which is a disadvantage of sequential studies?",[["Complex data analysis","Sequential studies require analysis of very complex data, and they are also time consuming. That is the price of combining two designs."],["Inability to show age change","Sequential studies can show age change, since they combine cross-sectional and longitudinal designs to avoid their drawbacks."],["Heavy attrition only","Attrition is mainly a longitudinal concern. The distinctive drawbacks of sequential studies are time and complexity."],["Single-person focus","Focusing on a single person describes a case study, not a sequential study."]]],["A hypothesis from one in-depth case now needs testing for cause and effect. Which design fits?",[["Experimental","Experimental studies use controlled independent and dependent variables, so they can establish cause and effect and be repeated. That makes them the right test of a hypothesis from a case."],["Case study","Case study conclusions are not directly testable, so another case study would not test it."],["Ethnographic","Ethnographic studies describe cultures in depth. They do not test causes."],["Correlational","Correlational studies cannot establish cause and effect, so they could not answer this."]]],["Which set of information must participants receive before agreeing to take part?",[["Purpose, procedures, risks, benefits, and voluntary participation","Informed consent means telling participants the purpose, procedures, potential risks and benefits, and their right to participate voluntarily. All of these are required."],["Purpose and payment only","Purpose and payment alone leave out procedures, risks, and benefits, so consent would not be informed."],["Procedures and results only","Procedures and results alone leave out purpose, risks, benefits, and voluntariness."],["Risks only, after the study","Risks must be explained before agreeing. Telling them afterward defeats informed consent."]]],["Which statement about informed assent is true?",[["It is the form of consent obtained from minors","Informed assent is the type of informed consent researchers should obtain from minors. It acknowledges that children have a say in participating."],["It replaces all consent for adults","Informed assent concerns minors, not adults. Adults give informed consent."],["It is needed only for animals","Animals cannot give assent. Their protection comes from humane-care rules."],["It is a payment agreement","Assent is about agreeing to take part, not a payment arrangement. Compensation is a separate issue."]]],["Which situation may justify recording without prior consent?",[["Certain public observations","Consent before recording voices or images is required except in specific situations, such as certain public observations or approved deception studies."],["Any classroom interview","There is no general exception for classroom interviews, which require consent before recording."],["Any private conversation","Private conversations carry a strong expectation of privacy, so they are not an exception."],["Any online chat","Online chats are not listed as an exception, so consent is still needed."]]],["A manager asks his staff to join his study and hints that participants will be favored for promotion. What is the problem?",[["Subordinates are being coerced","Researchers must not coerce clients, students, or subordinates, and must offer fair alternatives when participation affects employment or education. Hinting at promotion perks is coercion."],["Staff may not be studied","Staff can be studied, as long as participation is not coerced and fair alternatives exist."],["Compensation is banned","Fair compensation is allowed. The problem is pressure, not payment."],["Studies need no ethics rules at work","Ethics rules apply everywhere, including workplaces."]]],["Which condition could justify waiving informed consent?",[["Anonymous, minimal-risk research","Consent may be waived only under limited conditions, such as minimal-risk studies, anonymous research, or when law or regulations require. Anonymous minimal-risk research qualifies."],["A very large payment","Payment is not a condition for waiving consent, and large amounts raise concerns about inducement."],["The researcher’s seniority","Seniority gives no right to skip consent."],["Participants staying silent","Silence is not consent, and it does not waive the requirement."]]],["Which statement about deception in research is correct?",[["It requires significant scientific value and no effective alternative","Deception may be used only when justified by significant scientific value and when no effective non-deceptive alternative exists. Participants must also not be misled about major risks."],["It is acceptable whenever it speeds up the study","Speed or convenience is not a justification. Significant scientific value and the lack of alternatives are required."],["It may hide major risks","Participants must not be misled about major risks, even in deception studies."],["It is always prohibited","Deception is not always prohibited. It is allowed under strict conditions."]]],["After a study, a participant asks the researcher to remove her data. What should the researcher do?",[["Respect the request","Debriefing includes explaining the study, correcting misconceptions, minimizing harm, and respecting requests to withdraw data. So the researcher should honor the request."],["Refuse because the study is over","The study ending does not remove the participant’s right to ask for her data to be removed."],["Ask her to pay a fee","No fee may be required. Respecting withdrawal requests is an obligation."],["Publish it anyway","Publishing the data against her wishes disregards her rights and the debriefing rules."]]],["Which practice fits the humane use of animals in research?",[["Using animals only when necessary and minimizing pain","Animals may be used only when necessary, and researchers must ensure humane treatment, minimize pain and distress, and follow ethical and legal standards."],["Using animals whenever convenient","Convenience does not justify using animals. Use must be necessary."],["Ignoring pain if results are good","Pain and distress must be minimized regardless of how good the results are."],["Skipping ethical standards","Ethical and legal standards must be followed. Skipping them is a violation."]]],["A researcher drops results that contradict her hypothesis from her report. Which principle is breached?",[["Accurate reporting of findings","Researchers must report findings accurately and avoid fabrication. Leaving out results that contradict a hypothesis misrepresents what was found."],["Plagiarism","Plagiarism is presenting someone else’s work as your own. She is misreporting her own data, not copying."],["Duplicate publication","Duplicate publication is republishing previously published data as original. Nothing was republished here."],["Reviewer confidentiality","Reviewer confidentiality concerns people who evaluate submitted work. It has nothing to do with how she reports her own results."]]],["A lab assistant designed the key analysis but is left off the authors list. Which principle is breached?",[["Publication credit","Researchers should take credit only for work they did and give credit to others who helped significantly. Leaving off the person who designed the key analysis fails that."],["Plagiarism","Plagiarism is presenting others’ work as your own. Here the issue is who gets credited, not copied text."],["Informed assent","Informed assent concerns minors agreeing to take part, not authorship."],["Humane animal care","Humane care of animals concerns animal research, not who is listed as an author."]]],["A reviewer shares an unpublished manuscript’s methods with her own lab. Which principle is breached?",[["Reviewer confidentiality","Reviewers must keep submitted materials confidential and respect proprietary rights. Sharing an unpublished manuscript’s methods with her own lab violates both."],["Publication credit","Publication credit concerns who is credited for work. The reviewer’s breach is about confidentiality."],["Debriefing","Debriefing concerns explaining studies to participants, not handling manuscripts."],["Plagiarism","Plagiarism is presenting others’ work as your own. She shared the manuscript instead of claiming it."]]],["A discussion section names the study’s small sample and offers alternative explanations. Which principle does this follow?",[["Acknowledging limitations","Researchers must acknowledge the limitations of their methods, findings, and conclusions, and discuss alternative explanations. Naming the small sample follows this principle."],["Publication credit","Publication credit concerns authorship. A discussion of weaknesses does not involve who is credited."],["Debriefing","Debriefing concerns participants after the study, not how results are discussed."],["Duplicate publication","Duplicate publication concerns republishing data. Listing limitations does not involve that."]]],["A researcher emphasizes how historical, social, and cultural settings shape a child’s growth. Which perspective is this?",[["Contextual","The contextual perspective emphasizes the impact of historical, social, and cultural context on development. That is the focus here."],["Cognitive","The cognitive perspective analyzes thought processes. This researcher is looking at settings, not thinking."],["Learning","The learning perspective studies observable behavior shaped by the environment, rather than broad historical and cultural context."],["Psychoanalytic","The psychoanalytic perspective focuses on unconscious emotions and drives, not on social and cultural settings."]]],["A researcher links a baby’s clinging to caregivers to evolutionary survival. Which perspective is this?",[["Ethological","The ethological perspective emphasizes evolutionary and biological underpinnings, as in Bowlby’s attachment theory. Linking clinging to survival is that kind of explanation."],["Learning","The learning perspective explains behavior through environmental influence, not through evolution."],["Cognitive","The cognitive perspective analyzes thought processes, not the evolutionary roots of behavior."],["Contextual","The contextual perspective emphasizes historical, social, and cultural context, not evolutionary survival."]]],["Which pairing of theorist and perspective is correct?",[["Bronfenbrenner and contextual","Bronfenbrenner’s bioecological theory is the important contextual theory, emphasizing the impact of context on development."],["Bandura and psychoanalytic","Bandura is a learning theorist known for social cognitive theory, not a psychoanalytic one."],["Piaget and learning","Piaget is a cognitive theorist, known for his cognitive development theory, not a learning theorist."],["Erikson and ethological","Erikson is a psychoanalytic theorist known for psychosocial development, not an ethological one."]]],["A professor says relying on a single theory is a mistake and urges borrowing each theory’s best features. Which orientation is this?",[["Eclectic","The eclectic orientation holds that relying on a single theory is a mistake and selects the best feature of each. That is what the professor describes."],["Psychoanalytic","A psychoanalytic orientation relies on one perspective, focusing on unconscious emotions and drives."],["Mechanistic","The mechanistic model is a view of development as environmentally operated, not a way of combining theories."],["Organismic","The organismic model is a view of the person as active in development, not a way of combining theories."]]],["A father takes away his son’s video games after a tantrum, and tantrums decrease. Which procedure is this?",[["Negative punishment","Negative punishment means the behavior is followed by the removal of a favorable stimulus. Taking away video games after a tantrum fits, and tantrums decreasing shows punishment worked."],["Positive punishment","Positive punishment adds an aversive stimulus. Nothing unpleasant is added here."],["Negative reinforcement","Negative reinforcement removes an aversive stimulus and increases a behavior. Here a favorable stimulus is removed and behavior decreases."],["Positive reinforcement","Positive reinforcement adds a favorable stimulus. Here something favorable is taken away."]]],["A student now studies without being asked, because it makes his mother stop nagging. Which procedure is this?",[["Negative reinforcement","Negative reinforcement means a behavior is followed by the removal of an aversive stimulus, so the behavior increases. Studying ends the nagging."],["Positive reinforcement","Positive reinforcement adds a favorable stimulus. Nothing pleasant is added here."],["Positive punishment","Positive punishment adds an aversive stimulus to decrease a behavior. Here the behavior increased."],["Negative punishment","Negative punishment removes a favorable stimulus to decrease a behavior. Here an unpleasant stimulus is removed and behavior increased."]]],["A child touches a hot stove, is burned, and stops touching it. Which procedure is this?",[["Positive punishment","Positive punishment occurs when an aversive stimulus follows a behavior. A burn after touching the stove makes the child stop."],["Negative punishment","Negative punishment removes a favorable stimulus. Nothing favorable is taken away here."],["Negative reinforcement","Negative reinforcement removes an aversive stimulus and increases a behavior. Here an aversive stimulus is added and behavior decreased."],["Positive reinforcement","Positive reinforcement adds a favorable stimulus. The burn is unpleasant, not favorable."]]],["A tutor gives a sticker after every fifth correct answer. Which schedule is this?",[["Fixed ratio","Fixed ratio means reinforcement after a specified number of responses. A sticker after every fifth correct answer is a set count."],["Variable ratio","Variable ratio would require an unpredictable number of responses. Every fifth is predictable."],["Fixed interval","Fixed interval depends on a set length of time, not a count of answers."],["Variable interval","Variable interval depends on an unpredictable length of time, not a count."]]],["A student checks her mailbox more as the daily 3 p.m. delivery approaches. Which schedule is this?",[["Fixed interval","Fixed interval means reinforcement after a specified length of time. Mail arriving at 3 p.m. each day fits, and checking rises as the time nears."],["Variable interval","Variable interval would involve unpredictable timing. A daily 3 p.m. delivery is predictable."],["Fixed ratio","Fixed ratio depends on a count of responses, not on time."],["Variable ratio","Variable ratio depends on an unpredictable count of responses, not on time."]]],["A teacher gives pop quizzes at random times, so students study steadily. Which schedule is this?",[["Variable interval","Variable interval means reinforcement for the first response after an unpredictable amount of time. Random pop quizzes keep students studying steadily."],["Fixed interval","Fixed interval would mean quizzes at a set schedule, such as every Friday."],["Fixed ratio","Fixed ratio is based on a set number of responses, not on time."],["Variable ratio","Variable ratio is based on an unpredictable number of responses, not on time."]]],["A child who learned to fear a white rabbit now fears a white fur coat. What is this called?",[["Generalization","Generalization is responding not only to the conditioned stimulus but also to similar stimuli. A white fur coat resembles the white rabbit."],["Discrimination","Discrimination is responding only to the conditioned stimulus. The child is reacting to a similar object too."],["Extinction","Extinction is the weakening of a conditioned response. Here the response spreads to a new object."],["Spontaneous recovery","Spontaneous recovery is the reappearance of a conditioned behavior after it weakened. Here the fear extends to a similar stimulus."]]],["A dog trained to a 500 Hz tone responds to it but not to a 900 Hz tone. What is this called?",[["Discrimination","Discrimination is responding only to the conditioned stimulus. Reacting to the 500 Hz tone and not the 900 Hz tone shows this."],["Generalization","Generalization would mean also responding to the 900 Hz tone, a similar stimulus."],["Extinction","Extinction is the weakening of a conditioned response. The response is still present for the trained tone."],["Spontaneous recovery","Spontaneous recovery is the reappearance of a conditioned response. Nothing reappears here."]]],["A child’s fear of a bell fades after many bell-only trials, then briefly returns a week later. What returned?",[["Spontaneous recovery","Spontaneous recovery is the reappearance of a conditioned behavior. The fear returning after it faded is exactly that."],["Extinction","Extinction is the weakening of the conditioned response, which was the fading of fear, not its return."],["Generalization","Generalization is responding to similar stimuli. The same bell triggers the fear."],["Discrimination","Discrimination is responding only to the conditioned stimulus, which is not what returned."]]],["A boy sees a classmate praised for sharing and decides to keep sharing himself. Which step of Bandura’s model is this?",[["Incentive and motivational process","The incentive and motivational process involves deciding whether to continue a behavior after learning it. Seeing the classmate praised makes the boy want to keep sharing."],["Attentional process","The attentional process is watching the model, which happens earlier."],["Retentional process","The retentional process is recalling the steps from the model."],["Motor reproductive process","The motor reproductive process is learning to perform the behavior itself."]]],["A child calls a zebra a “striped horse,” fitting it into her horse category. Which process is this?",[["Assimilation","Assimilation means incorporating new information into existing cognitive structures. Calling a zebra a striped horse fits it into her horse category."],["Accommodation","Accommodation means adjusting structures to fit new information. She has not changed her categories yet."],["Organization","Organization is the process of creating categories, with schemas as the product. She is using an existing category."],["Equilibration","Equilibration is maintaining balance between schemas and new experiences. It is the overall balancing, not this single step."]]],["She then forms a new category called “zebra.” Which process is this?",[["Accommodation","Accommodation means adjusting cognitive structures to fit new information. Creating a new category for zebra changes her structures."],["Assimilation","Assimilation fits new information into existing structures. She has now changed them."],["Organization","Organization is creating categories in general. This specific adjustment is accommodation."],["Equilibration","Equilibration is the balance between schemas and new experiences. It is the overall balancing, not this specific adjustment."]]],["A 15-month-old lifts a blanket to find a toy hidden under it. What does this show?",[["Object permanence emerging","Sensorimotor development runs from birth to 2 years, and object permanence emerges across it. Lifting a blanket to find a toy shows the child knows the toy still exists."],["Animism","Animism is believing objects have human feelings. It is a pre-operational belief and not what she shows."],["Artificialism","Artificialism is believing environmental features are due to human intervention. It is a pre-operational belief, not shown here."],["Formal reasoning","Formal reasoning is abstract, hypothetical thinking from age 11 onward."]]],["A 6-year-old believes the wind is angry and that people paint the sunset. Which two beliefs are these?",[["Animism and artificialism","Pre-operational children (2 to 7 years) believe in animism, giving objects feelings, and artificialism, attributing environmental features to human intervention."],["Egocentrism and conversion","Egocentrism is a pre-operational feature, but conversion difficulty belongs to the concrete operational stage, and neither matches the beliefs described."],["Assimilation and accommodation","Assimilation and accommodation are processes of adaptation, not beliefs about the world."],["Scaffolding and ZPD","Scaffolding and ZPD are Vygotsky’s ideas about learning with support."]]],["Which stage involves solving problems logically and doing basic math but not yet hypothetical thinking?",[["Concrete operational","The concrete operational stage (7 to 11 years) involves solving problems logically and doing basic math, but not yet abstract or hypothetical thinking."],["Pre-operational","The pre-operational stage (2 to 7 years) includes animism, artificialism, and egocentrism, and logical problem solving is not yet reliable."],["Formal operational","The formal operational stage (11 years onward) adds abstract and hypothetical thinking."],["Sensorimotor","The sensorimotor stage (birth to 2 years) involves reflexes and developing object permanence."]]],["A teacher assigns tasks just beyond what a child can do alone, with guidance. Which concept is she using?",[["Zone of proximal development","The zone of proximal development is the gap between what children can already do and what they are not quite ready to accomplish by themselves. Tasks just beyond reach, with guidance, target that gap."],["Equilibration","Equilibration is the balance between existing schemas and new experiences, a Piagetian idea."],["Organization","Organization is creating categories with schemas as the product, a Piagetian idea."],["Egocentrism","Egocentrism is a pre-operational difficulty with others’ viewpoints, unrelated to guided tasks."]]],["A coach gradually removes help as a child masters a skill. What is the temporary support called?",[["Scaffolding","Scaffolding is temporary support given to a child in doing a task, and removing it as the child masters the skill is part of the idea."],["Zone of proximal development","The zone of proximal development is the gap itself, not the support."],["Assimilation","Assimilation is fitting new information into existing structures, a Piagetian process."],["Animism","Animism is a pre-operational belief that objects have feelings, unrelated to support."]]],["A therapist describes a client’s drive as the pursuit of pleasure by reducing sexual tension, not limited to genital satisfaction. Which Freudian concept is this?",[["Sex","In Freud’s theory, sex is broad: sexual pleasure through reducing sexual tension, not only genital satisfaction."],["Aggression","This is the drive aimed at returning the organism to an inorganic state."],["Libido shifting to the father","This is a feature of the female Oedipus complex, not the definition of sex."],["Phylogenetic endowment","This concerns inherited experiences and images, not tension reduction."]]],["A Freudian interprets a patient’s self-destructive behavior as a pull toward returning to an inorganic state. Which concept is this?",[["Aggression","Freud described aggression as the drive to return the organism to an inorganic state, meaning death or self-destruction."],["Sex","This is the drive for pleasure through reducing sexual tension."],["Castration anxiety","This is a boy’s fear in the male Oedipus complex."],["Penis envy","This is part of the female Oedipus complex."]]],["A 5-month-old’s needs are met with minimal frustration, so she feels no ambivalence toward her pleasurable object. Which Freudian phase is this?",[["Oral-receptive","Needs satisfied with minimum frustration and anxiety mean no ambivalence toward the pleasurable object."],["Oral-sadistic (oral-aggressive)","This phase involves responding through biting, crying, and similar behaviors."],["Early anal","This begins around age 2 and involves destroying or losing objects."],["Late anal","This involves control and withholding, and comes later."]]],["How do the early anal and late anal periods differ?",[["Early: satisfaction from destroying or losing objects, with aggression over toilet training. Late: control and withholding, with mastery over one’s body","The child moves from destruction to mastery and control."],["Early: control and withholding. Late: destroying or losing objects","This reverses the two periods."],["Both: biting and crying to respond to others","That describes the oral-sadistic phase."],["Both: desire toward the opposite-sex parent","That belongs to the phallic stage."]]],["A 5-year-old boy represses his desire for his mother, takes his father as a role model, and internalizes his authority. What does Freud say this produces?",[["The superego","Internalized paternal authority leads to the creation of the superego."],["The id","The id is the source of instinctual drives, not the product of resolution."],["Penis envy","This is part of the female complex."],["Phylogenetic endowment","This concerns inherited experiences."]]],["A 4-year-old girl feels betrayed for being brought into the world without a penis and her libido shifts to her father. Which concepts apply?",[["The female Oedipus complex with penis envy","This is the pattern Freud described in the phallic stage."],["The male Oedipus complex with castration anxiety","This describes boys, who fear punishment from the father."],["Early anal aggression","This concerns toilet-training frustration."],["Latency socialization","This is a later stage."]]],["How does the superego that follows the female Oedipus resolution compare with the male one?",[["It tends to be weaker, more flexible, and less severe","Her resolution is less traumatic: she gives up desire for the father and reidentifies with her mother."],["It is stronger and more severe","This describes the male superego."],["It is identical","Freud described them as different."],["It does not form","It forms in both cases."]]],["A Freudian explains a child’s sudden fear of snakes by experiences and images inherited from ancestors that shape the unconscious. Which concept is this?",[["Phylogenetic endowment","Inherited experiences and images passed from ancestors influence the unconscious mind."],["Castration anxiety","This is a fear in the male Oedipus complex."],["Penis envy","This is part of the female Oedipus complex."],["Oral-receptive trait","This is a passive, dependent personality pattern."]]],["In Erikson’s theory, what is a psychological crisis?",[["The individual’s psychological needs conflicting with the needs of society","Each stage carries such a conflict."],["A conflict between id and superego","This is a Freudian idea."],["A fixation from toilet training","This is a Freudian anal-stage outcome."],["The loss of object permanence","This is a Piagetian concept."]]],["Which row correctly lists the ego strength, core pathology, and maladaptation of Autonomy vs Shame and Doubt?",[["Will, compulsion, impulsivity","These belong to the 2 to 3 year stage."],["Hope, withdrawal, sensory distortion","These belong to Trust vs Mistrust."],["Purpose, inhibition, ruthlessness","These belong to Initiative vs Guilt."],["Competence, inertia, narrow virtuosity","These belong to Industry vs Inferiority."]]],["A 45-year-old takes on so many causes and responsibilities that she burns out and cannot be effective. Which Erikson maladaptation is this?",[["Overextension","It is the maladaptation of Generativity vs Stagnation."],["Rejectivity","This is the core pathology, a lack of interest in others."],["Presumption","This is the maladaptation of Integrity vs Despair."],["Promiscuity","This is the maladaptation of Intimacy vs Isolation."]]],["A student says Erikson’s psychosocial theory is just Freud’s psychosexual theory with new names. How should this be evaluated?",[["Incorrect: Erikson extended Freud’s theory, framing each stage as a conflict between syntonic and dystonic elements across the lifespan","His stages run beyond adolescence and focus on social needs."],["Correct: the two theories are identical","They differ in stages, focus, and range."],["Correct: Erikson rejected stages","His is a stage theory."],["Incorrect: Erikson’s theory covers only childhood","His stages run to old age."]]]]},{"id":6,"lec":2,"t":"Contextual Perspective (Bronfenbrenner)","q":[["A psychologist maps a child’s environment as a set of nested settings, from family to culture, and studies how the child interacts with them. Whose theory is this?",[["Bronfenbrenner’s bioecological systems theory","It is the important contextual theory, emphasizing the impact of historical, social, and cultural context."],["Bowlby’s attachment theory","It is an ethological theory about the biological roots of the bond with a caregiver."],["Piaget’s cognitive development theory","It is a cognitive theory that traces stages of thinking, not nested environments."],["Skinner’s operant conditioning","It is a learning theory about consequences that modify behavior."]]],["A toddler learns language through daily play with her father and a picture book. Which element of Bronfenbrenner’s model is most directly shown?",[["Process","It is the interaction between the growing person and the people, objects, and symbols around her, and it is activity based."],["Person","This concerns characteristics such as demand features, dispositions, and resources."],["Context","This concerns the nested environment, such as the microsystem and macrosystem."],["Time","This concerns how the individual and the systems change over time."]]],["Which list names the four elements of Bronfenbrenner’s bioecological model?",[["Process, person, context, time","These are the four elements of the model."],["Microsystem, mesosystem, exosystem, macrosystem","These are the levels of the context element, not the four elements."],["Demand features, dispositions, resources, process","The first three are person characteristics."],["Attention, retention, reproduction, motivation","These are the steps in Bandura’s model."]]],["The way processes influence development varies from person to person. Which part of Bronfenbrenner’s model captures this?",[["Person","Individual characteristics change how processes affect development."],["Process","It is the interaction itself, not the individual differences in its effect."],["Context","It is the nested environment, not individual characteristics."],["Time","It is the change in individual and systems over time."]]],["A boy’s height and athletic build lead coaches to invite him onto teams, while a girl with a visible physical disability is approached less. Which person characteristic is this?",[["Demand features","Age, gender, skin color, physical disability, and body type can invite or discourage interactions."],["Dispositions","These are temperament, motivation, and persistence."],["Resources","These are cognitive, emotional, physical, psychosocial, material, and social resources."],["Process","This is the interaction itself, not a characteristic of the person."]]],["A persistent, highly motivated student keeps seeking help until she masters a skill, while a classmate with similar ability gives up. Which person characteristic is this?",[["Dispositions","Temperament, motivation, and persistence."],["Demand features","These are visible traits like age, gender, and body type."],["Resources","These are the assets a person can draw on, such as material and social resources."],["Time","This is how individuals and systems change across years."]]],["Two siblings differ in family income, health, and available emotional support. Which person characteristic does this describe?",[["Resources","Cognitive, emotional, physical, psychosocial, material, and social resources."],["Dispositions","Temperament, motivation, and persistence."],["Demand features","Age, gender, skin color, physical disability, and body type."],["Process","The interactions between a person and the environment."]]],["A teenager spends most of her time with her family, her close friends, and her church group, and she increasingly chooses which groups to join. Which environmental context is this?",[["Microsystem","It includes family, workplace, friendship group, or religious community, and people gain more control over choices as they mature."],["Mesosystem","This is the interrelations among two or more settings."],["Exosystem","This involves settings where the person is not an active participant."],["Macrosystem","This is the economic and political system and dominant beliefs."]]],["A child’s teacher and parents meet regularly to coordinate her homework. Which system does this link represent?",[["Mesosystem","It is the interrelation among settings, here home and school, in which the child actively participates."],["Microsystem","That is a single setting, such as the family or school itself."],["Exosystem","That involves settings in which the child is not an active participant."],["Macrosystem","That is the economic and political system and dominant beliefs."]]],["A mother’s employer cuts her hours, and the resulting stress at home affects her son, who has never visited her workplace. Which system does the workplace represent for him?",[["Exosystem","It is a setting he does not take part in, but events there affect his own setting."],["Mesosystem","This requires settings in which he actively participates."],["Microsystem","This is a setting he is directly part of."],["Macrosystem","This is the broad economic and political system and dominant beliefs."]]],["A country’s economic system and dominant beliefs about gender roles shape how families raise their children. Which system is this?",[["Macrosystem","It includes the economic and political system and dominant beliefs and ideologies."],["Exosystem","This is a setting that affects the person without involving them directly."],["Mesosystem","This is the interrelation among settings the person participates in."],["Microsystem","This is a direct setting such as the family."]]],["Over several decades, a man’s family, workplace, and community all change as he ages, and his development is shaped by these changes. Which element of the model is this?",[["Time","Both the individual and the systems in which the person is embedded change over time."],["Process","This is the interaction between the person and the environment."],["Person","This concerns individual characteristics."],["Macrosystem","This concerns economic and political systems and dominant beliefs."]]],["Which statement correctly distinguishes the microsystem from the mesosystem?",[["The microsystem is a setting the person is part of, and the mesosystem is the interrelation among two or more such settings","The mesosystem is about links between settings, such as home and school."],["The microsystem is the interrelation among settings, and the mesosystem is a single setting","This reverses the two."],["The microsystem is the economic system, and the mesosystem is the family","The economic system belongs to the macrosystem."],["The two terms mean the same thing","They are distinct levels of the context."]]],["Parents and a teacher cooperating on homework are compared with a parent’s workplace problems affecting the child. How do these systems differ?",[["The child takes part in both home and school, which is a mesosystem, but not in the workplace, which is an exosystem","In the exosystem the person is not an active participant, though events there still affect the person’s setting."],["The child takes part in the workplace, which is a mesosystem","The child is not an active participant there."],["Both are macrosystems","The macrosystem is the broad economic and political system and beliefs."],["Both are microsystems","A microsystem is a single setting the child belongs to."]]],["A student claims Bronfenbrenner’s model focuses only on the environment around the child. How should this be evaluated?",[["Incorrect: it also includes process, person characteristics, and time","The model has four elements, with context being only one of them."],["Correct: it ignores the person","It includes the person’s demand features, dispositions, and resources."],["Correct: it ignores change","Time is one of its elements."],["Incorrect: it focuses only on genes","It is a contextual theory, not a genetic one."]]],["Which statement correctly distinguishes process from person in Bronfenbrenner’s model?",[["Process is the interaction between the person and the environment, and person describes individual characteristics that change how processes work","Person characteristics include demand features, dispositions, and resources."],["Process is the nested environment, and person is the passage of time","The nested environment is context, and the passage of time is its own element."],["Process is a person’s temperament, and person is the economic system","Temperament is a disposition, and the economic system is part of the macrosystem."],["The two terms mean the same thing","They are separate elements of the model."]]],["A shy child and an outgoing child receive the same warm attention from their parents but develop differently. Which element best explains the difference?",[["Person","The way processes influence development varies with the individual’s characteristics."],["Macrosystem","This is the economic and political system and dominant beliefs, which are the same for both children."],["Time","This concerns change over the years, not differences between two children."],["Exosystem","This involves settings in which the children are not active participants."]]],["A tall 5-year-old is assumed to be older, so adults expect more mature behavior from him and treat him differently. Which person characteristic is at work?",[["Demand features","Age and body type can invite or discourage particular interactions."],["Dispositions","These are temperament, motivation, and persistence."],["Resources","These are cognitive, emotional, physical, psychosocial, material, and social resources."],["Time","This is how the person and the systems change across the years."]]],["A child has a supportive extended family, good health, and a quiet place to study. Which person characteristic does this describe?",[["Resources","These include physical, material, social, and other resources the child can draw on."],["Demand features","These are visible traits, such as age and body type, that invite or discourage interaction."],["Dispositions","These are temperament, motivation, and persistence."],["Process","This is the interaction itself, not what the child has available."]]],["Which statement about the microsystem is accurate?",[["As people mature, they have increasing control over the choice of group","The microsystem includes family, workplace, friendship group, and religious or social group."],["Children choose their microsystem groups from birth","Control over group choice increases with maturity."],["It consists only of the family","It also includes workplaces, friendship groups, and religious or social groups."],["It excludes friendship groups","Friendship groups are part of it."]]],["A teen’s friends pressure her to skip family dinners, while her parents restrict her friendships. Which system describes this relationship between the two settings?",[["Mesosystem","It is the interrelation among two or more settings in which the person actively participates."],["Microsystem","This is a single setting, such as the family or the friendship group."],["Exosystem","This involves settings in which the person is not an active participant."],["Macrosystem","This is the economic and political system and dominant beliefs."]]],["A city council closes a neighborhood clinic. A boy never attends council meetings, but his family loses access to care. Which system does the council represent for him?",[["Exosystem","He is not an active participant, yet events there affect what happens in his own setting."],["Mesosystem","This requires that he actively participates in the settings."],["Microsystem","This is a setting he is directly part of."],["Macrosystem","This is the broad economic and political system and dominant beliefs."]]],["A culture that strongly values collectivism shapes how every family raises its children. Which system is this?",[["Macrosystem","It includes dominant beliefs and ideologies, along with economic and political systems."],["Exosystem","This is a specific setting that affects the person indirectly."],["Mesosystem","This is the interrelation among settings the person is part of."],["Microsystem","This is a direct setting such as the family."]]],["A student says that “time” in Bronfenbrenner’s model refers only to the child’s age. How should this be evaluated?",[["Incorrect: both the individual and the systems in which the person is embedded change over time","Time covers change in the person and in the surrounding systems."],["Correct: it is only the person’s age","Time also covers the changing systems."],["Correct: it refers to the length of the school day","This is not what the element refers to."],["Incorrect: time is the same as the macrosystem","Time is a separate element."]]],["A teacher says a child’s classroom is part of her exosystem because it affects her learning. How should this be evaluated?",[["Incorrect: she takes part in the classroom directly, so it is part of her microsystem","The exosystem involves settings in which she is not an active participant."],["Correct: any setting that affects her is an exosystem","The exosystem requires that she not be an active participant."],["Correct: the classroom is part of the macrosystem","The macrosystem is the economic and political system and dominant beliefs."],["Incorrect: the classroom is part of the mesosystem alone","The mesosystem is the link among settings, though the classroom itself is a microsystem."]]]]},{"id":7,"lec":2,"t":"Ethological Perspective (Bowlby)","q":[["A researcher argues that humans are pre-programmed to form attachments because attachments help us survive. Whose theory is this?",[["Bowlby’s attachment theory","It holds that we are pre-programmed to attach to other people because it helps us survive."],["Bandura’s social cognitive theory","It emphasizes learning by observing others."],["Erikson’s psychosocial theory","It describes stages of conflict between opposing elements."],["Piaget’s cognitive development theory","It traces changes in children’s intelligence."]]],["A baby shows an inborn need to attach mainly to one main attachment figure. What does Bowlby call this?",[["Monotropy","It is the child’s inborn need to attach to one main attachment figure."],["Maternal deprivation","This is the harm that follows from lacking a warm, continuous relationship."],["Mental working model","This is the integrated bond that guides later relationships."],["Detachment","This is the third stage of separation anxiety."]]],["Which caregiver quality, according to Bowlby’s first assumption, creates a secure base for a child?",[["Responsive and accessible","A caregiver who responds and is available creates the secure base."],["Strict and controlling","Control is not the quality Bowlby names."],["Generous but rarely present","Accessibility is needed, so absence undermines it."],["Highly stimulating","The assumption is about responsiveness and accessibility."]]],["A woman’s adult friendships and romantic relationships mirror the trust she learned with her mother as an infant. Which assumption of Bowlby’s theory does this illustrate?",[["The second: the bond becomes a mental working model for later relationships","The early relationship is integrated and serves as the model on which later friendships and love relationships are built."],["The first: a responsive caregiver creates a secure base","That concerns what the caregiver provides in infancy, not the later relationships."],["Monotropy","This is the inborn need to attach to one main figure."],["Detachment","This is a stage of separation anxiety."]]],["A mother who responds promptly and stays nearby lets her toddler explore while he checks back with her. Which assumption of Bowlby’s theory is this?",[["The first: a responsive, accessible caregiver creates a secure base","The child can explore because the caregiver is a reliable base."],["The second: the bond becomes a mental working model","That concerns how the bond shapes later relationships."],["Maternal deprivation","That concerns the harm of lacking a warm, continuous bond."],["Despair","This is the second stage of separation anxiety."]]],["A child raised in an institution without a warm, intimate, continuous relationship with a caregiver develops emotional and psychological problems. Which hypothesis is this?",[["The maternal deprivation hypothesis","Such a relationship is essential for healthy psychological and emotional development."],["Monotropy","This is the inborn need to attach to one main figure."],["The mental working model","This is how an early bond shapes later relationships."],["Protest","This is the first stage of separation anxiety."]]],["When a caregiver leaves the room, a 1-year-old cries loudly, resists soothing by others, and searches for her. Which stage of separation anxiety is this?",[["Protest","The infant cries, resists soothing by other people, and searches for the caregiver."],["Despair","The infant becomes quiet, sad, passive, listless, and apathetic."],["Detachment","The infant becomes emotionally detached from other people, including the caregiver."],["Monotropy","This is the inborn need to attach to one main figure, not a stage."]]],["After several days apart from her caregiver, an infant becomes quiet, sad, listless, and apathetic. Which stage of separation anxiety is this?",[["Despair","As separation continues, infants become quiet, sad, passive, and apathetic."],["Protest","This is the earlier stage with crying and searching."],["Detachment","This is the later stage in which the infant becomes emotionally detached from others."],["Secure base","This is what a responsive caregiver provides, not a stage."]]],["After a long separation, an infant seems emotionally detached from everyone, including her caregiver. Which stage of separation anxiety is this?",[["Detachment","The infant becomes emotionally detached from other people, including the caregiver."],["Protest","The infant cries and searches."],["Despair","The infant is quiet, sad, and listless but still tied to the situation."],["Monotropy","This is the inborn need to attach to one main figure."]]],["Which sequence gives the stages of separation anxiety in the correct order?",[["Protest, despair, detachment","The infant first protests, then despairs, and finally detaches."],["Despair, protest, detachment","The first two stages are swapped."],["Detachment, protest, despair","Detachment is the last stage."],["Protest, detachment, despair","The last two stages are swapped."]]],["Which pair correctly contrasts the protest and despair stages?",[["Protest: crying, resisting soothing, and searching. Despair: quiet, sad, and apathetic","The infant’s behavior shifts from active distress to passivity."],["Protest: quiet and apathetic. Despair: crying and searching","This swaps the two stages."],["Both: emotional detachment from everyone","Detachment is the third stage."],["Both: cheerful acceptance of strangers","Neither stage is described that way."]]],["Which statement correctly distinguishes monotropy from the mental working model?",[["Monotropy is the inborn need to attach to one main figure, and the working model is the integrated bond used to build later relationships","One is the need to attach, and the other is what the bond becomes for later relationships."],["Monotropy is the integrated bond used for later relationships, and the working model is the inborn need to attach","This reverses the definitions."],["Both describe stages of separation anxiety","Neither is a stage of separation anxiety."],["Both describe the harm of maternal deprivation","The maternal deprivation hypothesis is a separate idea."]]],["A student says Bowlby’s theory is a learning theory because attachments form when a caregiver rewards the infant with food. How should this be evaluated?",[["Incorrect: it is ethological, holding that attachment is pre-programmed because it helps survival","The theory rests on evolutionary and biological underpinnings, not on reward."],["Correct: attachments are learned through rewards","That describes a learning explanation, not Bowlby’s."],["Correct: it is a cognitive theory","Cognitive theories analyze thought processes."],["Incorrect: it is a psychoanalytic theory","Psychoanalytic theories focus on unconscious emotions and drives."]]],["A commentator says a warm, intimate, continuous relationship with a caregiver is not necessary for healthy emotional development. How should this be evaluated against Bowlby’s view?",[["Incorrect: the maternal deprivation hypothesis says such a relationship is essential","Bowlby held it to be essential for healthy psychological and emotional development."],["Correct: Bowlby thought relationships were unimportant","Bowlby placed great importance on early relationships."],["Correct: only detachment matters","Detachment is one stage of separation anxiety, not the whole theory."],["Incorrect: continuous care matters only for adults","The hypothesis concerns development in childhood."]]],["Bowlby’s attachment theory is grouped under which perspective, and why?",[["Ethological, because it rests on evolutionary and biological underpinnings","Attachment is treated as pre-programmed because it helps us survive."],["Learning, because attachments are shaped by consequences","The learning perspective studies observable behavior shaped by the environment."],["Cognitive, because it analyzes thought processes","The cognitive perspective analyzes thought processes, as in Piaget’s theory."],["Contextual, because it emphasizes historical and cultural context","The contextual perspective is represented by Bronfenbrenner’s theory."]]],["An infant with several caregivers still seeks comfort mostly from her mother. Which Bowlby concept does this fit?",[["Monotropy","It is the child’s inborn need to attach to one main attachment figure."],["The mental working model","This is the bond used as a model for later relationships."],["Protest","This is the first stage of separation anxiety."],["Detachment","This is the final stage of separation anxiety."]]],["Which statement best summarizes the maternal deprivation hypothesis?",[["A warm, intimate, and continuous relationship with the caregiver is essential for healthy psychological and emotional development","This is the core of the hypothesis."],["Infants thrive regardless of the caregiver relationship","The hypothesis says the relationship is essential."],["Caregivers matter only after age 10","The hypothesis concerns early development."],["Attachment is learned only through feeding","Bowlby saw attachment as pre-programmed for survival."]]],["A man who learned in infancy that caregivers are dependable expects his partners to be dependable too. Which Bowlby concept is this?",[["The mental working model","The early bond is integrated and serves as the model on which later friendships and love relationships are built."],["Monotropy","This is the inborn need to attach to one main figure."],["The maternal deprivation hypothesis","This concerns the consequences of lacking a continuous relationship."],["Protest","This is a stage of separation anxiety."]]],["A 2-year-old at daycare cries, refuses comfort from her teacher, and keeps looking at the door for her mother. Which stage of separation anxiety is this?",[["Protest","The infant cries, resists soothing by others, and searches for the caregiver."],["Despair","The child would be quiet, sad, and apathetic."],["Detachment","The child would be emotionally detached from others."],["Secure base","This is what a responsive, accessible caregiver provides, not a stage."]]],["A toddler hospitalized for weeks without visits from his parents sits quietly, rarely plays, and seems sad and apathetic. Which stage of separation anxiety is this?",[["Despair","As separation continues, infants become quiet, sad, passive, listless, and apathetic."],["Protest","The child would still be crying and searching."],["Detachment","The child would be emotionally detached from everyone."],["Monotropy","This is the need to attach to one main figure, not a stage."]]],["After a prolonged separation, a child no longer reacts when her mother returns and seems indifferent to other people as well. Which stage of separation anxiety is this?",[["Detachment","The infant becomes emotionally detached from other people, including the caregiver."],["Despair","The child would be quiet and sad, but not yet indifferent to everyone."],["Protest","The child would be crying and searching."],["Secure base","This is what a responsive caregiver provides."]]],["Which feature distinguishes the despair stage from the detachment stage?",[["Despair: quiet, sad, and listless. Detachment: emotionally detached from others, including the caregiver","The infant moves from sadness and passivity to emotional detachment."],["Despair: emotionally detached from everyone. Detachment: quiet and sad","This swaps the two stages."],["Despair: crying and searching. Detachment: loud protests","Crying and searching belong to the protest stage."],["There is no difference between them","They are two separate stages."]]],["How do the first and second assumptions of Bowlby’s attachment theory differ?",[["The first is that a responsive, accessible caregiver creates a secure base, and the second is that the bond becomes a mental working model for later relationships","One concerns what the caregiver provides, and the other concerns how the bond shapes later relationships."],["The first is that the bond becomes a working model, and the second is that a caregiver creates a secure base","This swaps the two assumptions."],["The first is monotropy, and the second is maternal deprivation","These are separate concepts from the two assumptions."],["The two assumptions are the same","They address different aspects of attachment."]]],["A student says Bowlby’s secure base is created by the child’s own temperament. How should this be evaluated?",[["Incorrect: a responsive and accessible caregiver must create the secure base","The first assumption places the responsibility on the caregiver."],["Correct: the child creates it alone","The caregiver creates the secure base."],["Correct: it is created by peers","Bowlby’s assumption concerns the caregiver."],["Incorrect: it has nothing to do with caregivers","It is defined by the caregiver’s responsiveness and accessibility."]]],["A student says the three stages of separation anxiety end with despair. How should this be evaluated?",[["Incorrect: they end with detachment","The order is protest, despair, detachment."],["Correct: despair is the final stage","Detachment is the final stage."],["Correct: protest is the final stage","Protest is the first stage."],["Incorrect: they end with a secure base","A secure base is not a stage of separation anxiety."]]]]},{"id":8,"lec":2,"t":"Kohlberg’s Moral Development Theory","q":[["A researcher studies how children’s understanding of right and wrong changes as they mature and gain social experience. Whose theory is this?",[["Kohlberg’s moral development theory","It explains how understanding of right and wrong develops through stages."],["Erikson’s psychosocial theory","It describes conflicts between opposing elements across the lifespan, not moral reasoning."],["Piaget’s cognitive development theory","It traces changes in intelligence, not stages of moral reasoning."],["Bandura’s social cognitive theory","It emphasizes learning by observing models."]]],["Which list gives Kohlberg’s three levels in order?",[["Preconventional, conventional, postconventional","Moral reasoning moves from self-centered to other-centered to principle-oriented."],["Conventional, preconventional, postconventional","The first two levels are swapped."],["Postconventional, conventional, preconventional","This reverses the order."],["Preconventional, postconventional, conventional","The last two levels are swapped."]]],["A 6-year-old leaves a classmate’s snack alone because she fears being punished. Which Kohlberg stage is this?",[["Stage 1: avoidance of punishment","Moral reasoning is based on consequences: do good or avoid bad to avoid punishment."],["Stage 2: self-interest or reciprocity","This is based on what benefits the child, not fear of punishment."],["Stage 3: good boy, good girl","This is guided by social approval and relationships."],["Stage 4: law and order","This is based on obeying the law and respecting authority."]]],["A boy shares his toys only because he expects the other child to share back. Which Kohlberg stage is this?",[["Stage 2: self-interest or reciprocity","He does good because it will benefit him."],["Stage 1: avoidance of punishment","This is motivated by fear of punishment."],["Stage 3: good boy, good girl","This is motivated by social approval and relationships."],["Stage 5: well-being over laws","This is based on social contracts and the greater good."]]],["A teenager returns a lost wallet because she wants her family and friends to think well of her. Which Kohlberg stage is this?",[["Stage 3: good boy, good girl","Moral reasoning is guided by social approval and maintaining relationships."],["Stage 2: self-interest or reciprocity","This is based on personal benefit or reward."],["Stage 4: law and order","This is based on obeying law and authority."],["Stage 6: ethical universal principles","This is based on abstract, self-chosen principles."]]],["An adult refuses to cheat on taxes because laws must be obeyed to keep society orderly. Which Kohlberg stage is this?",[["Stage 4: law and order","Moral reasoning is based on obeying the law and respecting authority to maintain welfare and order."],["Stage 3: good boy, good girl","This is based on social approval."],["Stage 5: well-being over laws","This holds that laws can be changed if they do not serve the greater good."],["Stage 1: avoidance of punishment","This is based on avoiding punishment."]]],["A citizen campaigns to change an unjust law, reasoning that laws are social contracts that should serve the greater good. Which Kohlberg stage is this?",[["Stage 5: well-being over laws","Laws are seen as social contracts that can be changed if they do not serve the greater good."],["Stage 4: law and order","This treats laws as something to obey in order to maintain order."],["Stage 6: ethical universal principles","This is based on abstract, self-chosen principles that apply universally."],["Stage 3: good boy, good girl","This is based on approval from others."]]],["A man breaks a regulation because of an abstract, self-chosen ethical principle he believes should apply to everyone. Which Kohlberg stage is this?",[["Stage 6: ethical universal principles","Reasoning rests on abstract, self-chosen principles that apply universally."],["Stage 5: well-being over laws","This rests on social contracts and the greater good rather than universal principles."],["Stage 4: law and order","This rests on obeying the law."],["Stage 2: self-interest or reciprocity","This rests on personal benefit."]]],["How do Kohlberg’s Stage 4 and Stage 5 differ in their view of laws?",[["Stage 4 obeys laws to maintain order, and Stage 5 sees laws as social contracts that can change if they fail the greater good","Stage 5 is postconventional and principle-oriented."],["Stage 4 sees laws as changeable, and Stage 5 treats them as fixed","This reverses the two stages."],["Both obey laws to avoid punishment","That is Stage 1."],["Both ignore laws when it benefits them","That is closer to Stage 2."]]],["A student says a 12-year-old who reasons “I should do it so others will think I’m good” is preconventional because he is young. How should this be evaluated?",[["Incorrect: reasoning from social approval is Stage 3, which belongs to the conventional level","The conventional level is other-centered, concerned with what others will think."],["Correct: approval-seeking is self-centered","Preconventional reasoning concerns punishment and personal benefit."],["Correct: age alone decides the level","The level is determined by the reasoning, not age alone."],["Incorrect: it is postconventional","Postconventional reasoning is principle-oriented."]]],["Which description fits Kohlberg’s Level 1, the preconventional level?",[["Self-centered reasoning, typical from 0 to 9 years","Stages 1 and 2 are based on punishment and self-interest."],["Other-centered reasoning, typical from adolescence to adulthood","That describes the conventional level."],["Value- and principle-oriented reasoning","That describes the postconventional level."],["Reasoning based only on social contracts","That is Stage 5, within the postconventional level."]]],["Which description fits Kohlberg’s Level 2, the conventional level?",[["Other-centered reasoning, asking what others will think of me","Stages 3 and 4 involve social approval, relationships, law, and authority."],["Self-centered reasoning based on punishment and reward","That describes the preconventional level."],["Value- and principle-oriented reasoning","That describes the postconventional level."],["Reasoning that rejects all laws","This does not match any level."]]],["Which description fits Kohlberg’s Level 3, the postconventional level?",[["Value- and principle-oriented reasoning","Stages 5 and 6 are based on well-being over laws and universal principles."],["Self-centered reasoning","That describes the preconventional level."],["Other-centered reasoning","That describes the conventional level."],["Reasoning based on avoiding punishment","That is Stage 1."]]],["A child stays away from the cookie jar only because her mother would scold her. Which Kohlberg stage is this?",[["Stage 1: avoidance of punishment","Moral reasoning is based on consequences, avoiding punishment."],["Stage 2: self-interest or reciprocity","That is doing good because it benefits oneself."],["Stage 3: good boy, good girl","That is guided by social approval."],["Stage 5: well-being over laws","That is based on social contracts and the greater good."]]],["A girl helps a classmate with homework because the classmate promised her a candy bar afterward. Which Kohlberg stage is this?",[["Stage 2: self-interest or reciprocity","She does good because it will benefit her."],["Stage 1: avoidance of punishment","That is based on avoiding punishment."],["Stage 3: good boy, good girl","That is based on social approval and relationships."],["Stage 4: law and order","That is based on respect for law and authority."]]],["A student volunteers to clean the classroom because he wants his teacher and classmates to see him as a good person. Which Kohlberg stage is this?",[["Stage 3: good boy, good girl","Moral reasoning is guided by social approval and maintaining relationships."],["Stage 2: self-interest or reciprocity","That is based on a personal reward."],["Stage 4: law and order","That is based on obeying laws and authority."],["Stage 6: ethical universal principles","That is based on abstract, self-chosen principles."]]],["A police officer refuses to bend a rule for a friend because respecting authority keeps society orderly. Which Kohlberg stage is this?",[["Stage 4: law and order","Moral reasoning is based on obeying the law and respecting authority to maintain welfare and order."],["Stage 3: good boy, good girl","That is guided by approval from others."],["Stage 5: well-being over laws","That allows laws to change when they do not serve the greater good."],["Stage 2: self-interest or reciprocity","That is based on what benefits the person."]]],["A legislator votes to repeal an outdated law, reasoning that laws are agreements that should serve the greater good. Which Kohlberg stage is this?",[["Stage 5: well-being over laws","Laws are understood as social contracts that can change if they do not serve the greater good."],["Stage 4: law and order","That treats laws as something to obey in order to maintain order."],["Stage 6: ethical universal principles","That rests on self-chosen principles that apply universally."],["Stage 3: good boy, good girl","That is based on social approval."]]],["A man refuses an unjust order even though he will be punished, guided by a universal principle of justice he has chosen for himself. Which Kohlberg stage is this?",[["Stage 6: ethical universal principles","Reasoning rests on abstract, self-chosen ethical principles that apply universally."],["Stage 5: well-being over laws","That rests on social contracts and the greater good."],["Stage 4: law and order","That rests on obeying authority."],["Stage 1: avoidance of punishment","That is motivated by avoiding punishment, which he accepts here."]]],["How do Stage 1 and Stage 2 differ?",[["Stage 1 is based on avoiding punishment, and Stage 2 on self-interest or reward","Both are preconventional, but they rest on different motives."],["Stage 1 is based on self-interest, and Stage 2 on avoiding punishment","This reverses the two stages."],["Stage 1 is based on social approval, and Stage 2 on law and order","Those are Stages 3 and 4."],["Both are based on universal principles","Those belong to the postconventional level."]]],["How do Stage 3 and Stage 4 differ?",[["Stage 3 is guided by social approval and relationships, and Stage 4 by obeying the law and respecting authority","Both are conventional, but they focus on different things."],["Stage 3 is guided by law and order, and Stage 4 by social approval","This reverses the two stages."],["Stage 3 is based on punishment, and Stage 4 on self-interest","Those are Stages 1 and 2."],["Both are based on universal principles","Those are postconventional."]]],["How does conventional reasoning differ from postconventional reasoning?",[["Conventional is other-centered, and postconventional is value- and principle-oriented","One asks what others will think, and the other relies on values and principles."],["Conventional is value-oriented, and postconventional is other-centered","This reverses the two levels."],["Conventional is self-centered, and postconventional is based on punishment","Self-centered reasoning is preconventional."],["They are the same level described in different words","They are separate levels."]]],["Three teens each return a lost phone. Ana wants the owner to give her a reward. Ben wants his friends to admire him. Carla believes lost property laws must be respected. Which stages are they using, in that order?",[["Stage 2, Stage 3, Stage 4","Reward is self-interest, admiration is social approval, and respecting laws is law and order."],["Stage 1, Stage 3, Stage 5","Ana is not avoiding punishment, and Carla is not questioning whether the law serves the greater good."],["Stage 3, Stage 2, Stage 4","The first two stages are swapped."],["Stage 2, Stage 4, Stage 6","Ben’s reason is approval, which is Stage 3, and Carla’s is obeying law, which is Stage 4."]]],["A student says Stage 5 reasoning means laws should never be changed. How should this be evaluated?",[["Incorrect: Stage 5 sees laws as social contracts that can be changed if they do not serve the greater good","This is the key idea of well-being over laws."],["Correct: Stage 5 treats laws as fixed","That describes Stage 4 more closely."],["Correct: Stage 5 ignores the greater good","Stage 5 is based on the greater good."],["Incorrect: Stage 5 is about avoiding punishment","That is Stage 1."]]],["A student says preconventional reasoning is other-centered because it focuses on what others will think. How should this be evaluated?",[["Incorrect: the preconventional level is self-centered, and the other-centered level is conventional","Preconventional reasoning rests on punishment and self-interest."],["Correct: preconventional reasoning is other-centered","That describes the conventional level."],["Correct: preconventional reasoning is based on universal principles","That describes the postconventional level."],["Incorrect: preconventional reasoning applies only to adults","The preconventional level is typical from 0 to 9 years."]]]]},{"id":9,"lec":2,"t":"Ainsworth’s Attachment Styles","q":[["A researcher watches an infant’s behavior during brief separations from and reunions with her mother in an unfamiliar room. Which procedure is this?",[["The Strange Situation","Ainsworth’s experiment evaluates attachment style through brief separations and reunions."],["The Zone of Proximal Development","This is Vygotsky’s idea about tasks just beyond what a child can do alone."],["Operant conditioning","This uses consequences to modify behavior."],["The Maternal Deprivation Hypothesis","This is Bowlby’s idea about the importance of a warm, continuous relationship."]]],["Which list names Ainsworth’s four attachment styles?",[["Secure, anxious-resistant, anxious-avoidant, disorganized-disoriented","These are the four styles in the notes."],["Secure, insecure, avoidant, detached","These are not the labels used."],["Protest, despair, detachment, secure","The first three are Bowlby’s separation anxiety stages."],["Secure, resistant, dependent, disorganized","Not all of these are the labels used."]]],["An infant cries when her mother leaves, greets her enthusiastically when she returns, and then goes back to playing. Which attachment style is this?",[["Secure","Distressed when separated and enthusiastic when reunited, which supports play and exploration."],["Anxious-resistant","The infant would seek contact but reject soothing."],["Anxious-avoidant","The infant would stay calm and ignore the caregiver."],["Disorganized-disoriented","The infant would show contradictory or fearful behavior."]]],["An infant is distressed when her mother leaves, reaches for her on return, but pushes away her attempts to soothe her. Which attachment style is this?",[["Anxious-resistant","Distressed when separated, initiates contact on reunion, yet rejects being soothed."],["Secure","A secure infant is enthusiastic on reunion and accepts comfort."],["Anxious-avoidant","An avoidant infant ignores the caregiver on reunion."],["Disorganized-disoriented","This shows contradictory or misdirected behavior."]]],["An infant stays calm when her mother leaves, accepts a stranger, and ignores her mother on return. Which attachment style is this?",[["Anxious-avoidant","Calm when separated, accepts strangers, and ignores or avoids the caregiver on reunion."],["Anxious-resistant","A resistant infant is distressed on separation."],["Secure","A secure infant is distressed on separation and enthusiastic on reunion."],["Disorganized-disoriented","This shows contradictory or fearful behavior."]]],["An infant moves toward the stranger for closeness, then shows fear when her mother returns. Which attachment style is this?",[["Disorganized-disoriented","Contradictory, repetitive, or misdirected behavior, such as seeking closeness to the stranger or fearing the mother’s return."],["Anxious-avoidant","An avoidant infant is calm and ignores the caregiver."],["Secure","A secure infant is enthusiastic when reunited."],["Anxious-resistant","A resistant infant seeks contact with the caregiver but rejects soothing."]]],["A mother is affectionate one moment and shouts at her baby unpredictably the next. Which attachment style is the infant most likely to dev

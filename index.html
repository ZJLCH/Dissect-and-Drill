ctivity, behavior, and environmental factors","These four interact in guiding development."],["Genes, hormones, karyotypes, and behavior","Karyotypes are pictures of chromosomes, not an interacting factor."],["Genes, parenting structure, nutrition, and neural activity","Parenting structure is an environmental factor in a study, not one of the four."],["Neural activity, testosterone, fertilization, and behavior","These are not the four factors."]]],["Activity of the brain and nervous system that interacts with genes, behavior, and the environment is called what?",[["Neural activity","It is one of the four interacting factors in epigenesis."],["Genetic risk","This is inherited susceptibility."],["Karyotype","This is a picture of chromosomes."],["Gene-environment interaction","This is how environmental effects differ by genetic makeup."]]],["Outside influences can affect whether a person’s genes are turned on or off. Which factor is this?",[["Environmental factors","They interact with genes, neural activity, and behavior during development."],["Genes","These are the inherited DNA that interacts with the other factors."],["Neural activity","This is activity of the brain and nervous system."],["Behavior","This is what a person does, which also interacts with the other factors."]]],["A child’s own repeated actions influence, and are influenced by, her genes, her brain activity, and her surroundings. Which factor of epigenesis is this?",[["Behavior","It influences and is influenced by genes, neural activity, and environmental factors."],["Genes","These are the inherited DNA, not actions."],["Neural activity","This is brain and nervous system activity."],["Environmental factors","These are external influences."]]],["A clinic advises prospective parents of their probable risk of having children with hereditary defects. Which service is this?",[["Genetic counseling","It is a clinical service that advises parents about the risk of hereditary defects."],["Genetic testing","This is a process that helps identify and evaluate potential hereditary conditions."],["A karyotype","This is a photograph showing the chromosomes."],["A twin study","This compares twins to separate genetic and environmental effects."]]],["A process helps identify and evaluate potential hereditary conditions in a family. What is it called?",[["Genetic testing","It is the process associated with genetic counseling that identifies and evaluates conditions."],["Genetic counseling","This is the service that advises parents about their probable risk."],["Niche picking","This is when people choose environments that fit their genetic tendencies."],["Epigenesis","This is continuous interaction among genes, neural activity, behavior, and environment."]]],["A photograph that shows a person’s chromosomes is called what?",[["A karyotype","It is a photograph that shows the chromosomes."],["A genotype","This is a person’s genetic makeup, not a photograph."],["A zygote","This is a single cell formed at fertilization."],["A hereditary defect","This is a genetic condition that could be passed on."]]],["How do genetic counseling and genetic testing differ?",[["Counseling advises parents of their probable risk, and testing helps identify and evaluate potential conditions","One advises and explains, and the other identifies and evaluates."],["Counseling identifies conditions, and testing advises parents of risk","This reverses the two."],["Both are photographs of chromosomes","That describes a karyotype."],["Both are another name for epigenesis","Epigenesis is a view of development."]]],["Genetic factors contribute to variations in the environment a person experiences, reflecting genetic susceptibility to the environment. Which concept is this?",[["Genotype-environment correlation","It describes how genes and experienced environments are linked."],["Gene-environment interaction","This is how environmental effects differ depending on genetic risk."],["Epigenesis","This is the view that development results from continuous interaction among four factors."],["Genetic counseling","This is a clinical service."]]],["Musical parents pass on genes that predispose their child toward music, and they also fill the home with instruments and lessons. Which type of genotype-environment correlation is this?",[["Passive","Children passively inherit both the genes and the environment their family provides."],["Reactive (evocative)","Here others react to the child’s inherited characteristics."],["Active","Here the child selects or creates her own environment."],["Gene-environment interaction","This concerns how environmental effects differ by genetic risk."]]],["An easygoing infant draws warm responses from adults, while an irritable infant draws sterner ones. Which type of genotype-environment correlation is this?",[["Reactive (evocative)","Children with different genetic makeups evoke different reactions from others."],["Passive","Here children inherit both genes and the family’s environment."],["Active","Here the individual chooses her own environment."],["Epigenesis","This is a view of development, not a type of correlation."]]],["A teenager with strong athletic tendencies joins sports clubs and seeks out gyms. Which type of genotype-environment correlation is this?",[["Active","Individuals actively select or create experiences consistent with their genetic tendencies."],["Passive","Here the family provides the environment, and the child does not choose it."],["Reactive (evocative)","Here other people’s reactions create the environment."],["Genetic risk","This is the level of inherited susceptibility."]]],["What is another term for active genotype-environment correlation?",[["Niche picking","Individuals seek out environments that support their genetic tendencies."],["Passive correlation","This is a different type of genotype-environment correlation."],["Genetic testing","This is a process that identifies hereditary conditions."],["Epigenesis","This is a view of development."]]],["How does passive genotype-environment correlation differ from active genotype-environment correlation?",[["Passive: children inherit both genes and the family’s environment. Active: individuals select or create environments that match their genes","One is given by the family, and the other is chosen by the individual."],["Passive: individuals select their environments. Active: children inherit the family’s environment","This reverses the two."],["Both: others react to inherited characteristics","That describes reactive correlation."],["They mean the same thing","They are two different types."]]],["How does reactive (evocative) genotype-environment correlation differ from active correlation?",[["Reactive: the social environment reacts to inherited characteristics. Active: individuals seek environments that fit their genetic tendencies","In one the environment responds to the person, and in the other the person picks the environment."],["Reactive: individuals select their environments. Active: others react to inherited characteristics","This reverses the two."],["Both: children inherit the family’s environment","That describes passive correlation."],["They mean the same thing","They are different types."]]],["A study showed that parenting structure and parental psychopathology influence child behavior differently depending on the genetic risk the child inherited. Which study is this?",[["The Early Growth and Development Study","It demonstrates gene-environment interaction."],["A twin study","This compares twins to separate genetic and environmental effects."],["A karyotype study","This examines chromosome pictures."],["A genetic counseling study","This concerns advising prospective parents."]]],["Environmental effects influence individuals differently based on their genetic makeup. Which concept is this?",[["Gene-environment interaction","It is the interaction between genetic risk and environmental effects."],["Genotype-environment correlation","This is how genetic factors contribute to variations in the environment."],["Niche picking","This is a type of correlation in which individuals choose their environments."],["Epigenesis","This is a broader view of continuous interaction among four factors."]]],["How does gene-environment interaction differ from genotype-environment correlation?",[["Interaction: environmental effects differ based on genetic risk. Correlation: genetic factors contribute to variations in the environment","One concerns how effects differ, and the other concerns how genes shape the environment."],["Interaction: genetic factors contribute to variations in the environment. Correlation: environmental effects differ based on genetic risk","This reverses the two."],["Both are services for prospective parents","Those are genetic counseling and testing."],["They mean the same thing","They are distinct concepts."]]],["Which two environmental factors were identified in the Early Growth and Development Study as influencing child behavior?",[["Parenting structure and parental psychopathology","Their effects differed depending on the child’s genetic risk."],["Nutrition and maternal weight","These are prenatal risk factors, not the factors in this study."],["Niche picking and reactive correlation","These are types of genotype-environment correlation."],["Karyotype and genetic testing","These are tools and processes for assessing chromosomes and hereditary conditions."]]],["A student says epigenesis means development is predetermined by genes. How should this be evaluated?",[["Incorrect: epigenesis holds that development is flexible, not predetermined, and results from continuous interaction among four factors","Genes are only one of the interacting factors."],["Correct: genes alone control development","Epigenesis says development is not controlled solely by genes."],["Correct: neural activity has no role","Neural activity is one of the four interacting factors."],["Incorrect: it concerns only the environment","It includes genes, neural activity, behavior, and environmental factors."]]],["A student says that in the Early Growth and Development Study, the effects of parenting were the same for every child regardless of genetic risk. How should this be evaluated?",[["Incorrect: environmental effects differed depending on the child’s inherited genetic risk","This is the core of the gene-environment interaction the study demonstrated."],["Correct: genetic risk made no difference","The study showed that genetic risk mattered."],["Correct: parenting had no effect on behavior","The study found parenting structure influenced child behavior."],["Incorrect: the study was about twins only","The notes describe a study of environmental effects and genetic risk, not twins."]]],["A child’s behavior responds to parenting differently because of the level of inherited susceptibility passed on from her biological parents. What is this susceptibility called?",[["Genetic risk","It is the inherited susceptibility that can change how environmental influences affect a child’s behavior."],["Niche picking","This is when individuals seek out environments that fit their genetic tendencies."],["Parenting structure","This is an environmental factor in the Early Growth and Development Study."],["A karyotype","This is a photograph that shows the chromosomes."]]]]},{"id":16,"lec":3,"t":"Prenatal Development - Genetic & Chromosomal Disorders","q":[["A mistake in copying genetic information leaves a permanent change that can be passed on to offspring. What is this called?",[["A mutation","It is a permanent alteration in genetic material that can result from a copying mistake."],["A karyogram","This is a visual profile of chromosomes, not a change in genetic material."],["A sex-linked characteristic","This is a trait influenced by a single gene on a sex chromosome."],["Gynecomastia","This is extra breast tissue that can occur in Klinefelter syndrome."]]],["A trait is influenced by a single gene located on a sex chromosome rather than on the other 22 pairs. What is it called?",[["A sex-linked characteristic","Such traits are tied to genes on the sex chromosomes."],["A mutation","This is a permanent change in genetic material."],["An autosomal trait","Autosomes are the other 22 pairs of chromosomes."],["A trisomy","This is an extra copy of a chromosome."]]],["Why are males at greater risk for X-linked characteristics?",[["They have only one X chromosome","With no second X to compensate, a defective gene on that X affects them."],["They have two X chromosomes","This describes females, who usually have a second healthy X."],["They have an extra Y chromosome","This describes Jacob’s syndrome and does not explain X-linked risk."],["They lack testosterone","The risk comes from having a single X, not from hormones."]]],["A female is affected by an X-linked recessive gene. What must be true, unless the defective gene is dominant?",[["She inherited the recessive gene on both X chromosomes","Females must carry the recessive gene on both X chromosomes to be affected."],["She inherited it on one X chromosome only","A second healthy X usually protects her unless the gene is dominant."],["She inherited it on a Y chromosome","Females have no Y chromosome."],["She inherited an extra autosome","Autosomes are not the X-linked chromosomes."]]],["A rare condition cannot currently be cured and is often diagnosed during pregnancy or shortly after birth. Features include low birth weight, low-set ears, cleft lip or palate, club foot, and heart or kidney problems. Which condition is this?",[["Edwards syndrome","These are its symptoms, and it is often diagnosed during pregnancy or soon after birth."],["Down syndrome","This is the most common chromosomal abnormality, linked to intellectual disability."],["Turner syndrome","This affects females and involves a missing X chromosome."],["Klinefelter syndrome","This affects males with an extra X chromosome."]]],["What is another name for Edwards syndrome?",[["Trisomy 18","Both names refer to the same condition."],["Trisomy 21","This is another name for Down syndrome."],["XYY syndrome","This is another name for Jacob’s syndrome."],["Martin Bell syndrome","This is another name for Fragile X syndrome."]]],["A male has an extra X chromosome, is taller than average, has small firm testicles, extra breast tissue, low testosterone, and infertility. Which condition is this?",[["Klinefelter syndrome (XXY)","An extra X in a male explains these characteristics."],["Turner syndrome (XO)","This affects females who are missing part or all of an X chromosome."],["Jacob’s syndrome (XYY)","This involves an extra Y, with typical testosterone and fertility."],["Fragile X syndrome","This is the most common inherited form of intellectual and developmental disability."]]],["Extra breast tissue that can occur in individuals with Klinefelter syndrome is called what?",[["Gynecomastia","It is the extra breast tissue associated with Klinefelter syndrome."],["Infertility","This is a different characteristic of Klinefelter syndrome."],["Mutation","This is a permanent change in genetic material."],["Trisomy","This is an extra copy of a chromosome."]]],["A condition is the most common inherited form of intellectual and developmental disabilities. The body cannot make enough of a protein needed for brain growth, because of an abnormality in the X chromosome that breaks. Which condition is this?",[["Fragile X syndrome","It is caused by an X chromosome abnormality and is the most common inherited form of IDD."],["Down syndrome","This is the most common chromosomal abnormality, but it is not inherited this way."],["Edwards syndrome","This is a rare condition with physical symptoms such as club foot."],["Turner syndrome","This involves a missing X chromosome in females."]]],["What is another name for Fragile X syndrome?",[["Martin Bell syndrome","Both names refer to the same condition."],["Trisomy 18","This is another name for Edwards syndrome."],["Jacob’s syndrome","This is the condition with an extra Y chromosome."],["Trisomy 21","This is another name for Down syndrome."]]],["Which set of symptoms matches Fragile X syndrome?",[["Developmental delays, intellectual and learning disabilities, anxiety, ADHD, and ASD","These are the symptoms listed for the condition."],["Short height, failure of the ovaries to develop, and heart defects","These describe Turner syndrome."],["Low birth weight, low-set ears, cleft lip, and club foot","These describe Edwards syndrome."],["Taller than average height, small testes, and infertility","These describe Klinefelter syndrome."]]],["Why are Fragile X symptoms usually less severe in females than in males?",[["The second X chromosome is usually healthy","A healthy second X reduces the severity of symptoms."],["Females have an extra Y chromosome","Females do not have a Y chromosome."],["Females produce more testosterone","Hormones are not the reason given."],["Females have only one X chromosome","Females have two X chromosomes."]]],["A female has part or all of one X chromosome missing. She has short height, her ovaries fail to develop, and she has heart defects. Which condition is this?",[["Turner syndrome","It involves a missing X chromosome, short height, failure of the ovaries to develop, and heart defects."],["Klinefelter syndrome","This affects males and involves an extra X."],["Down syndrome","This is trisomy 21."],["Edwards syndrome","This is trisomy 18."]]],["Which chromosome composition corresponds to Turner syndrome?",[["XO","Part or all of one X chromosome is lost."],["XXY","This is Klinefelter syndrome."],["XYY","This is Jacob’s syndrome."],["Trisomy 21","This is Down syndrome."]]],["A female’s external genitalia appear normal, but her breasts and ovaries do not fully develop and she does not menstruate. Which condition is this?",[["Turner syndrome","These are listed characteristics of the condition."],["Klinefelter syndrome","This affects males."],["Jacob’s syndrome","This also affects males, with typical sexual development."],["Fragile X syndrome","This is linked to intellectual and learning disabilities."]]],["A male has an extra Y chromosome. The condition is often undiagnosed because it has no obvious symptoms, and he has typical testosterone, sexual development, and fertility. Which condition is this?",[["Jacob’s syndrome (XYY)","These are its characteristics."],["Klinefelter syndrome (XXY)","This involves low testosterone and infertility."],["Turner syndrome (XO)","This affects females."],["Edwards syndrome (Trisomy 18)","This is rare and has physical symptoms."]]],["What is another name for Jacob’s syndrome?",[["XYY syndrome","Both refer to the condition with an extra Y chromosome."],["XXY syndrome","This is Klinefelter syndrome."],["XO syndrome","This is Turner syndrome."],["Trisomy 21","This is Down syndrome."]]],["A condition is the most common chromosomal abnormality and accounts for 40 percent of all moderate to severe intellectual disability. Which condition is this?",[["Down syndrome","It is the most common chromosomal abnormality."],["Edwards syndrome","This is rare."],["Fragile X syndrome","This is the most common inherited form of intellectual disability, not the most common chromosomal abnormality."],["Turner syndrome","This affects females with a missing X."]]],["What is another name for Down syndrome?",[["Trisomy 21","Both names refer to the same condition."],["Trisomy 18","This is Edwards syndrome."],["XYY syndrome","This is Jacob’s syndrome."],["Martin Bell syndrome","This is Fragile X syndrome."]]],["How do Klinefelter syndrome and Jacob’s syndrome differ?",[["Klinefelter involves an extra X, with low testosterone and infertility, while Jacob’s involves an extra Y, with typical testosterone and fertility","One has marked effects on development, and the other often goes undiagnosed."],["Klinefelter involves an extra Y, while Jacob’s involves an extra X","This reverses the two."],["Both involve a missing X chromosome","That describes Turner syndrome."],["Both cause infertility and low testosterone","Jacob’s syndrome has typical fertility and testosterone."]]],["How do Turner syndrome and Klinefelter syndrome differ?",[["Turner affects females who are missing part or all of an X (XO), while Klinefelter affects males with an extra X (XXY)","One loses an X, and the other gains one."],["Turner affects males with an extra X, while Klinefelter affects females who are missing an X","This reverses the two."],["Both affect males with an extra Y","That describes Jacob’s syndrome."],["Both are trisomies of an autosome","Neither is an autosomal trisomy."]]],["How do Edwards syndrome and Down syndrome differ?",[["Edwards is Trisomy 18, and Down is Trisomy 21, the most common chromosomal abnormality","They involve different chromosomes and different frequency."],["Edwards is Trisomy 21, and Down is Trisomy 18","This reverses the two."],["Both are Trisomy 18","Only Edwards syndrome is Trisomy 18."],["Both are linked to an extra Y chromosome","That describes Jacob’s syndrome."]]],["A student says Jacob’s syndrome causes infertility and low testosterone. How should this be evaluated?",[["Incorrect: Jacob’s syndrome involves typical testosterone, sexual development, sperm production, and fertility","Those features describe Klinefelter syndrome instead."],["Correct: Jacob’s syndrome always causes infertility","Fertility is typical in Jacob’s syndrome."],["Correct: Jacob’s syndrome is the same as Klinefelter","Klinefelter involves an extra X, not an extra Y."],["Incorrect: Jacob’s syndrome affects only females","It involves an extra Y, so it affects males."]]],["A student says Turner syndrome affects males who have an extra X chromosome. How should this be evaluated?",[["Incorrect: Turner syndrome affects females with an XO composition, and an extra X in a male is Klinefelter syndrome","This separates the two conditions."],["Correct: Turner syndrome is XXY","XXY is Klinefelter syndrome."],["Correct: Turner syndrome affects males","Turner syndrome affects females."],["Incorrect: Turner syndrome is Trisomy 21","Trisomy 21 is Down syndrome."]]],["Disabilities of intellectual and developmental functioning, with Fragile X syndrome as the most common inherited form, are collectively called what?",[["IDD (intellectual and developmental disabilities)","Fragile X syndrome is the most common inherited form of IDD."],["Gynecomastia","This is extra breast tissue that can occur in Klinefelter syndrome."],["Mutation","This is a permanent change in genetic material."],["Trisomy","This is an extra copy of a chromosome, as in Down syndrome."]]]]},{"id":17,"lec":3,"t":"Prenatal Development - Prenatal Development (Stages)","q":[["What is the name of the period between conception and birth, and how long does it normally last?",[["Gestation, normally 37 to 41 weeks","It runs from conception to birth, with a normal range of 37 to 41 weeks."],["Gestation, normally 24 weeks","About 24 weeks is the age of viability, not the normal length."],["The germinal period, normally 37 to 41 weeks","The germinal period covers only the first two weeks."],["The fetal period, normally 37 to 41 weeks","The fetal period runs from the ninth week until birth."]]],["Doctors date a pregnancy from the first day of the mother’s last menstrual cycle before conception. What is this measure called?",[["Gestational age","It is the basis doctors use to determine the beginning of pregnancy."],["Age of viability","This is when a fetus can first survive outside the womb, at about 24 weeks."],["Embryonic period","This is the stage from about 2 to 8 weeks after conception."],["Normal range","This is the 37 to 41 week length of gestation."]]],["A woman is in the first two weeks of pregnancy, from conception to the fertilized egg settling into the uterine wall. Which period is this?",[["The germinal period","It lasts from conception to implantation."],["The embryonic period","This begins after implantation and lasts until about 8 weeks."],["The fetal period","This begins at the ninth week."],["The final trimester","This is the last stage, when the lungs mature."]]],["A zygote begins repeatedly duplicating itself in rapid cell division. What is this process called?",[["Mitosis","The zygote divides through mitosis, creating more cells."],["Fertilization","This is how the zygote is formed."],["Implantation","This is when the blastocyst attaches to the uterine wall."],["Organogenesis","This is the formation of internal organs."]]],["After several days of mitosis, the cells form a ball with an inner group and an outer group. What is this structure?",[["A blastocyst","It consists of an inner and an outer group of cells and eventually implants in the uterine wall."],["A zygote","This is the single cell formed at fertilization."],["A fetus","This is the organism from the ninth week until birth."],["A placenta","This is the structure that provides nourishment and oxygen from the mother."]]],["How do the embryonic disk and the trophoblast differ?",[["The embryonic disk is the inner cell mass that becomes the embryo, and the trophoblast is the outer group that becomes the support system","One becomes the baby, and the other becomes the support structure."],["The embryonic disk is the outer group that becomes the support system, and the trophoblast is the inner mass that becomes the embryo","This reverses the two."],["Both become the embryo","Only the embryonic disk becomes the embryo."],["Both become the placenta","Only the trophoblast forms the support system."]]],["The blastocyst attaches to the wall of the mother’s uterus. What is this process called?",[["Implantation","It is the attachment of the blastocyst to the uterine wall, ending the germinal period."],["Ovulation","This is the release of an ovum from the ovary."],["Conception","This is when a sperm fertilizes an egg to form a zygote."],["Organogenesis","This is the formation of internal organs."]]],["Between about 2 and 8 weeks after conception, the major organs and body structures form. Which stage is this?",[["The embryonic period","It begins after implantation, and the process of internal organ formation is called organogenesis."],["The germinal period","This ends at implantation."],["The fetal period","This begins at the ninth week."],["The viability period","Viability is reached at about 24 weeks."]]],["Alcohol or drugs during a period of rapid organ formation can cause significant birth defects. Such harmful substances are called what?",[["Teratogens","They can cause significant birth defects during sensitive periods."],["Gametes","These are sex cells."],["Neurons","These are brain cells."],["Reflexes","These are automatic responses that develop around the fifth month."]]],["A layer of the embryo develops into the skin, nails, hair, teeth, sensory organs, brain, spinal cord, and entire nervous system. Which layer is it?",[["Ectoderm","It is the outer or upper embryonic layer."],["Mesoderm","This forms muscles, bones, and the circulatory system."],["Endoderm","This forms the digestive and respiratory systems."],["Trophoblast","This is the outer cell group of the blastocyst."]]],["A layer of the embryo develops into the inner layer of skin, muscles, bones, and the excretory and circulatory systems. Which layer is it?",[["Mesoderm","It is the middle embryonic layer."],["Ectoderm","This forms the skin surface and nervous system."],["Endoderm","This forms the digestive system and organs such as the liver."],["Embryonic disk","This is the inner cell mass that becomes the embryo."]]],["A layer of the embryo develops into the digestive system, liver, pancreas, salivary glands, and respiratory system. Which layer is it?",[["Endoderm","It is the inner embryonic layer."],["Mesoderm","This forms muscles, bones, and the circulatory system."],["Ectoderm","This forms the nervous system and outer body parts."],["Trophoblast","This is the outer cell group of the blastocyst."]]],["Which structure connects to the uterus and provides nourishment and oxygen to the developing embryo through the umbilical cord?",[["The placenta","It carries nourishment and oxygen from the mother to the developing child."],["The trophoblast","This is the outer cell group that eventually becomes the support system."],["The blastocyst","This is the ball of cells that implants in the uterine wall."],["The embryonic disk","This is the inner cell mass that becomes the embryo."]]],["How do cephalocaudal and proximodistal development differ?",[["Cephalocaudal growth proceeds from the head toward the tail, and proximodistal growth proceeds from the midline of the body outward","One runs top to bottom, and the other runs from the center outward."],["Cephalocaudal growth proceeds from the midline outward, and proximodistal growth proceeds from head to tail","This reverses the two."],["Both proceed from the head toward the tail","Only cephalocaudal growth does."],["Both proceed from the midline outward","Only proximodistal growth does."]]],["Which stage runs from the ninth week until birth and is marked by growth, maturation, and preparation for life outside the womb?",[["The fetal period","The developing organism during this stage is called a fetus."],["The embryonic period","This covers about weeks 2 to 8."],["The germinal period","This covers the first two weeks."],["Labor","This is the process that prepares the mother’s body for childbirth."]]],["A mother first feels fetal movement around the twelfth week, and the fetus can hear around 20 weeks. Which sense develops last, and why?",[["Sight, because it requires light","Hearing develops around 20 weeks, while sight develops last."],["Hearing, because it requires light","Hearing develops around 20 weeks, so it is not last."],["Sight, because it requires movement","The reason is the need for light."],["Movement, because muscles develop late","Movement begins around the twelfth week."]]],["At about 24 weeks, a fetus can survive outside the womb with medical support. What is this called?",[["The age of viability","It is the first opportunity for survival outside the womb."],["The normal range","This is the 37 to 41 week length of gestation."],["Gestational age","This is counted from the first day of the last menstrual cycle."],["Implantation","This is the attachment of the blastocyst to the uterine wall."]]],["By the third month of prenatal development, doctors can identify the baby’s sex. Which body structures make this possible?",[["The external genitalia","They develop by the third month and allow the baby’s sex to be identified."],["The respiratory system","This continues developing during the fourth through sixth months."],["The fat layer","This develops around the eighth month."],["The placenta","This provides nourishment and oxygen."]]],["Which sequence correctly orders these fetal developments from earliest to latest?",[["Movement at about 12 weeks, reflexes around the fifth month, fat layer around the eighth month","The fetal body gradually develops more functions."],["Fat layer around the eighth month, reflexes around the fifth month, movement at about 12 weeks","This reverses the order."],["Reflexes around the fifth month, movement at about 12 weeks, fat layer around the eighth month","Movement begins before reflexes."],["Movement at about 12 weeks, fat layer around the eighth month, reflexes around the fifth month","Reflexes develop before the fat layer."]]],["Most of the brain cells develop during which period, and what process increases the fetus’s size and prepares its organs to survive outside the womb?",[["The fetal period, through growth and maturation","Most neurons develop during the fetal period."],["The germinal period, through implantation","Implantation ends the germinal period and does not describe brain cell development."],["The embryonic period, through mitosis","Mitosis occurs in the zygote’s early divisions."],["The fetal period, through ovulation","Ovulation is the release of an ovum."]]],["Around the eighth month, a layer forms under the fetus’s skin to insulate and help regulate body temperature after birth. What is it?",[["The fat layer","It develops around the eighth month, during the final trimester."],["The placenta","This provides nourishment and oxygen."],["The trophoblast","This is the outer cell group of the blastocyst."],["The ectoderm","This is the outer embryonic layer."]]],["Hormones prepare the mother’s body for childbirth, causing muscular actions and the widening of the cervix. Which terms describe these events?",[["Labor, with contractions and cervix dilation","Labor is induced by hormones, with contractions and widening of the cervix."],["Viability, with implantation and mitosis","These do not describe childbirth."],["Gestation, with ovulation and fertilization","These describe the earlier stages of reproduction."],["Organogenesis, with placenta and blastocyst","These are earlier prenatal events."]]],["How do the embryonic period and the fetal period differ?",[["The embryonic period is when major organs and body structures form, and the fetal period is marked by growth, maturation, and preparation for survival outside the womb","One builds the body structures, and the other grows and matures them."],["The embryonic period is marked by growth and maturation, and the fetal period is when major organs form","This reverses the two."],["Both are when the zygote forms","The zygote forms at conception."],["Both end at implantation","Implantation ends the germinal period."]]],["A student says the ectoderm develops into the digestive system and liver. How should this be evaluated?",[["Incorrect: the endoderm forms the digestive system and liver, and the ectoderm forms the skin, hair, and nervous system","The two layers are assigned different structures."],["Correct: the ectoderm forms the digestive system","The digestive system comes from the endoderm."],["Correct: the ectoderm forms the muscles and bones","Muscles and bones come from the mesoderm."],["Incorrect: the ectoderm forms the placenta","The placenta is the support system formed from the trophoblast."]]],["A student says sight is the first sense to develop in the fetal period because the eyes form early. How should this be evaluated?",[["Incorrect: hearing develops around 20 weeks, and sight develops last because it requires light","Sight is the last sense to develop."],["Correct: sight develops first","Sight develops last."],["Correct: hearing develops last","Hearing develops around 20 weeks, before sight."],["Incorrect: no senses develop before birth","Hearing develops around 20 weeks."]]]]},{"id":18,"lec":3,"t":"Prenatal Development - Teratogens & Prenatal Risks","q":[["Researchers study the factors that contribute to birth defects. What is this field called?",[["Teratology","It is the study of factors that contribute to birth defects."],["Karyotyping","This is arranging a person’s chromosomes into a standardized profile."],["Genetic counseling","This is a service that advises prospective parents about genetic conditions."],["Organogenesis","This is the formation of internal organs."]]],["A substance potentially causes a birth defect or negatively alters a child’s cognitive and behavioral outcomes. What is it called?",[["A teratogen","It is any agent that can cause such harm."],["A gamete","This is a sex cell."],["A blastocyst","This is a ball of cells formed after several days of mitosis."],["A karyogram","This is a visual profile of chromosomes."]]],["A pregnant woman is exposed to a larger quantity of a teratogen than another woman, and her baby is more severely affected. Which principle is this?",[["Dose","The greater the dose of a teratogenic agent, the greater its effect."],["Genetic susceptibility","This concerns the genotypes of the mother and the embryo."],["Timing of exposure","This concerns when in development the exposure occurs."],["Number of teratogens","This concerns exposure to more than one teratogen."]]],["Two babies are exposed to the same teratogen at the same dose but show different types and severity of abnormalities because of their genotypes and their mothers’ genotypes. Which factor is this?",[["Genetic susceptibility","The type and severity of abnormalities are linked to the genotype of the pregnant woman and of the embryo or fetus."],["Dose","This concerns the quantity of exposure."],["Amount of exposure","This concerns reaching a certain level, partly based on the mother’s size and metabolism."],["Time of exposure","This concerns the point in development."]]],["A teratogen causes much more damage when exposure occurs while a body structure is forming. Which factor is this?",[["Timing of exposure","Body structures are most vulnerable during their critical period."],["Dose","This concerns quantity."],["Number of teratogens","This concerns exposure to multiple agents."],["Genetics","This concerns the makeup of the child and mother."]]],["A substance becomes harmful only after exposure reaches a certain level, which depends partly on the mother’s size and metabolism. Which factor is this?",[["Amount of exposure","Some substances are harmful only above a certain level."],["Timing of exposure","This concerns when the exposure occurs in development."],["Genetic susceptibility","This concerns the genotypes of mother and child."],["Number of teratogens","This concerns exposure to more than one agent."]]],["A fetus exposed to several teratogens has more problems than one exposed to a single teratogen. Which factor is this?",[["Number of teratogens","Exposure to multiple teratogens causes more problems than exposure to only one."],["Dose","This concerns the quantity of a single agent."],["Timing of exposure","This concerns when exposure occurs."],["Amount of exposure","This concerns reaching a certain level of one substance."]]],["The genetic makeup of both the child and the mother influences how teratogens affect development. Which factor is this?",[["Genetics","Both genotypes shape the effects of teratogens."],["Dose","This concerns quantity."],["Time of exposure","This concerns when the exposure occurs."],["Number of teratogens","This concerns how many agents are involved."]]],["Exposure occurs during the period when organs are forming, and it causes major anatomical malfunctions. Which period is this?",[["The embryonic period","It carries the highest risk for structural defects because organs are forming."],["The fetal period","Structural defects are less likely then, though functional problems can occur."],["The germinal period","This is the first two weeks, from conception to implantation."],["The final trimester","This is the last stage, when the lungs mature."]]],["Teratogen exposure late in pregnancy leads to functional problems in organs, stunted growth, and effects on brain development rather than major structural defects. Which period is this?",[["The fetal period","Structural defects are less likely, but functional problems and growth effects can occur."],["The embryonic period","This is when exposure causes major structural defects."],["The germinal period","This ends at implantation."],["Conception","This is when a sperm fertilizes an egg."]]],["A child whose organs were formed normally has impaired organ function and reduced growth after teratogen exposure. Which pair of effects is this?",[["Functional problems in organs and stunted growth","These may result from exposure during the fetal period."],["Structural defects and missing limbs","These are typical of exposure during the embryonic period."],["Mutation and sex-linked disorders","These are genetic conditions."],["Low-set ears and cleft lip","These are physical features of Edwards syndrome."]]],["A pregnant woman’s diet and weight gain are examined as a risk to her baby’s development. Which prenatal risk factor is this?",[["Nutrition and maternal weight","It involves the mother’s diet and weight gain during pregnancy."],["Drug intake","This involves medications or drugs."],["Physical activity and strenuous work","This concerns exercise and workload."],["Maternal smoking","This involves smoking during pregnancy."]]],["A doctor advises a pregnant woman about exercise and workload. What is recommended?",[["Moderate exercise","Moderate exercise is the recommendation for this prenatal factor."],["Strenuous work","This is a risk factor rather than a recommendation."],["No physical activity at all","The notes recommend moderate exercise."],["Heavy lifting daily","This is a form of strenuous work."]]],["A pregnant woman takes medications or drugs that may affect fetal development. Which prenatal risk factor is this?",[["Drug intake","It is the use of medications or drugs that may affect the fetus."],["Nutrition and maternal weight","This involves diet and weight gain."],["Physical activity","This involves exercise and workload."],["Maternal weight only","This is part of nutrition and maternal weight."]]],["A drug was banned after it was found to cause stunted or missing limbs, severe facial deformities, and defective organs. Which drug is this?",[["Thalidomide","It was banned after causing these birth defects."],["Accutane","This is linked to heart defects and brain and ear abnormalities."],["Alcohol","This is linked to fetal alcohol syndrome."],["Nicotine","This is linked to maternal smoking risks."]]],["A child has retarded growth, face and body malformations, and disorders of the central nervous system. Which condition is this?",[["Fetal alcohol syndrome","It results from prenatal alcohol exposure."],["Down syndrome","This is a chromosomal abnormality."],["Edwards syndrome","This is Trisomy 18."],["Turner syndrome","This affects females with an XO composition."]]],["A neonate is born weighing less than 2500 grams. What is this condition called?",[["Low birth weight","It is defined as a birth weight under 2500 grams."],["Pre-term birth","This is birth before 37 weeks of gestation."],["Small-for-date","This is a lower-than-average weight in a baby born near the due date."],["Viability","This is the age at which a fetus can survive outside the womb."]]],["A baby is born at 35 weeks of gestation. What is this called?",[["Pre-term (premature)","A baby born before 37 weeks is pre-term."],["Small-for-date","This describes a baby born near the due date who is smaller than average."],["Low birth weight","This is defined by weight, not by gestation length."],["Full term","Full term falls in the normal 37 to 41 week range."]]],["A baby is born near her due date but weighs less than average. What is this called?",[["Small-for-date","It describes a baby born during or near the due date with a lower-than-average birth weight."],["Pre-term","This is birth before 37 weeks."],["Teratogenic","This describes an agent that causes birth defects."],["Viable","This describes the ability to survive outside the womb."]]],["A substance taken especially in the first trimester is associated with heart defects, brain and ear abnormalities, and brain malformation. Which substance is this?",[["Accutane","It is linked to these defects, especially in the first trimester."],["Thalidomide","This is linked to missing limbs and facial deformities."],["Alcohol","This is linked to fetal alcohol syndrome."],["A moderate exercise program","This is recommended in pregnancy."]]],["A woman smokes during pregnancy. Which set of risks is associated with this?",[["Miscarriage, birth complications, SIDS, increased risk of ADHD, and intergenerational smoking behavior","These are the associated risks."],["Missing limbs and severe facial deformities","These are linked to thalidomide."],["Heart defects and ear abnormalities","These are linked to Accutane."],["An extra Y chromosome","This is Jacob’s syndrome."]]],["Daughters of women who smoked during pregnancy are more likely to smoke during their own pregnancies. What is this called?",[["Intergenerational smoking behavior","It is the tendency for smoking to pass from mother to daughter across generations."],["SIDS","This is sudden infant death syndrome, a risk of maternal smoking."],["ADHD","This is a condition with increased risk in children of mothers who smoked."],["Small-for-date","This describes birth weight for a baby born near the due date."]]],["How do pre-term, low birth weight, and small-for-date babies differ?",[["Pre-term is birth before 37 weeks, low birth weight is under 2500 grams, and small-for-date is a smaller-than-average baby born near the due date","Each term describes a different basis: timing, weight, or size relative to gestation."],["Pre-term is under 2500 grams, and low birth weight is birth before 37 weeks","This reverses the two."],["All three mean birth before 37 weeks","Only pre-term refers to gestation length."],["All three mean a baby with a normal birth weight","They all describe babies with some risk."]]],["How do teratogen effects in the embryonic period differ from those in the fetal period?",[["The embryonic period risks major structural defects, while the fetal period risks functional problems, stunted growth, and effects on brain development","One affects body structure, and the other affects function and growth."],["The embryonic period risks stunted growth, while the fetal period risks major structural defects","This reverses the two."],["Both carry no risk","Both carry risks, of different kinds."],["Both cause only structural defects","Fetal exposure more often causes functional problems."]]],["A student says teratogens always cause the same damage no matter when exposure occurs. How should this be evaluated?",[["Incorrect: exposure causes more damage at certain points, especially when body structures are forming","Timing of exposure shapes the type and severity of damage."],["Correct: timing makes no difference","Timing is one of the factors."],["Correct: only the dose matters","Dose, timing, genetics, and other factors all matter."],["Incorrect: teratogens only matter after birth","They act during prenatal development."]]]]},{"id":19,"lec":3,"t":"Infancy & Toddlerhood - Birth and Delivery","q":[["About two weeks before delivery, a woman’s rising estrogen levels make her uterus contract and her cervix more flexible. Which process is beginning?",[["Parturition","It is the act or process of giving birth, typically beginning about two weeks before delivery."],["Fertilization","This is when a sperm and an ovum combine, long before birth."],["Implantation","This is when the blastocyst attaches to the uterine wall."],["Ovulation","This is the release of an ovum from the ovary."]]],["A woman in her second trimester feels her uterine muscles tighten for up to two minutes. The tightening is mild and irregular. What is this?",[["Braxton-Hicks contractions","They can occur in the final months or as early as the second trimester and are relatively mild and irregular."],["Real labor contractions","These are frequent, rhythmic, painful, and steadily more intense."],["Stage 1 of labor","This is the dilation of the cervix, marked by regular contractions."],["Stage 3 of labor","This is the expulsion of the placenta."]]],["A student says an epidural speeds up the second stage of labor. How should this be evaluated?",[["Incorrect: an epidural blocks nerve pathways but may slow the second stage of labor","It is a form of regional anesthesia with this possible drawback."],["Correct: it makes the second stage shorter","The notes say it may slow the second stage."],["Correct: it is a form of local anesthesia","It is a form of regional anesthesia, which affects a larger area."],["Incorrect: it is a prepared childbirth method","It is a medical pain-relief method, not a prepared childbirth method."]]],["Contractions become more frequent, rhythmic, painful, and steadily stronger. What are they?",[["Real labor contractions","They are more frequent, rhythmic, painful, and steadily increase in intensity."],["Braxton-Hicks contractions","These are relatively mild and irregular."],["False contractions","These are mild, irregular tightenings before real labor."],["Pudendal blocks","These are a form of local anesthesia, not contractions."]]],["How do Braxton-Hicks contractions differ from real labor contractions?",[["Braxton-Hicks contractions are mild and irregular, while real labor contractions are frequent, rhythmic, painful, and increasingly intense","One is a false alarm, and the other signals real labor."],["Braxton-Hicks contractions are frequent and rhythmic, while real labor contractions are mild and irregular","This reverses the two."],["Both are rhythmic and painful","Only real labor contractions are."],["Both occur only after the baby is born","Both occur before the baby is born."]]],["Which term describes the physical process that ends intrauterine dependency through uterine, cervical, and physiological changes that allow the fetus to enter the external world?",[["The stages of labor","This process moves the fetus from the uterus to the outside world."],["Natural childbirth","This is a method that seeks to prevent pain by eliminating fear."],["Electronic fetal monitoring","This is a method of monitoring the fetal heartbeat."],["A Cesarean delivery","This is surgical delivery of the baby."]]],["A first-time mother has regular contractions for about 13 hours while her cervix shortens and dilates to 10 centimeters. Which stage of labor is this?",[["Stage 1: dilation of the cervix","It is the longest stage, usually lasting 12 to 14 hours for a first-time mother."],["Stage 2: descent and emergence of the baby","This lasts one to two hours and ends when the baby emerges."],["Stage 3: expulsion of the placenta","This lasts between 10 minutes and one hour."],["Parturition","This is the overall process of giving birth."]]],["The baby’s head moves through the cervix into the vaginal canal, and the stage ends when the baby completely emerges. Which stage of labor is this?",[["Stage 2: descent and emergence of the baby","It lasts one to two hours."],["Stage 1: dilation of the cervix","This is the longest stage, when the cervix dilates to 10 centimeters."],["Stage 3: expulsion of the placenta","This follows the baby’s emergence."],["False contractions","These occur before real labor."]]],["After the baby is born, the placenta and the remainder of the umbilical cord are expelled. Which stage of labor is this?",[["Stage 3: expulsion of the placenta","It lasts between 10 minutes and one hour."],["Stage 2: descent and emergence of the baby","This ends when the baby completely emerges."],["Stage 1: dilation of the cervix","This is when the cervix dilates."],["Braxton-Hicks contractions","These are mild contractions before labor."]]],["Which sequence correctly orders the stages of labor?",[["Dilation of the cervix, descent and emergence of the baby, expulsion of the placenta","The stages move from dilation to birth to the placenta."],["Descent and emergence of the baby, dilation of the cervix, expulsion of the placenta","The baby cannot emerge before the cervix dilates."],["Expulsion of the placenta, dilation of the cervix, descent and emergence of the baby","The placenta is expelled last."],["Dilation of the cervix, expulsion of the placenta, descent and emergence of the baby","The placenta is expelled after the baby emerges."]]],["Which row correctly matches each stage of labor with its usual length?",[["Stage 1: 12 to 14 hours for a first-time mother. Stage 2: one to two hours. Stage 3: 10 minutes to one hour","These are the durations given in the notes."],["Stage 1: one to two hours. Stage 2: 12 to 14 hours. Stage 3: 10 minutes to one hour","The lengths of Stages 1 and 2 are swapped."],["Stage 1: 10 minutes to one hour. Stage 2: one to two hours. Stage 3: 12 to 14 hours","Stage 3 is the shortest, not the longest."],["Stage 1: one to two hours. Stage 2: 10 minutes to one hour. Stage 3: 12 to 14 hours","Stage 1 is the longest."]]],["During labor, doctors mechanically track the baby’s heartbeat. What is this called?",[["Electronic fetal monitoring","It is the mechanical monitoring of the fetal heartbeat during labor and delivery."],["A Cesarean delivery","This is surgical removal of the baby from the uterus."],["Kangaroo care","This is skin-to-skin contact after birth."],["An epidural","This is a form of regional anesthesia."]]],["A baby is delivered by surgical removal from the uterus. What is this method called?",[["Cesarean delivery","It is delivery by surgical removal from the uterus."],["Vaginal delivery","This is the standard method of childbirth."],["Natural childbirth","This is a method that seeks to prevent pain by eliminating fear."],["Prepared childbirth","This uses instruction and social support to induce controlled physical responses."]]],["Which method of childbirth is the standard method?",[["Vaginal delivery","It is the standard method of childbirth."],["Cesarean delivery","This is the surgical alternative."],["Forceps delivery","This uses forceps to deliver a baby in a breech position."],["Medicated delivery","This involves analgesics or anesthesia and can be used in either method."]]],["A fetus is positioned so that its feet or buttocks will be delivered first. What is this position called?",[["Breech position","The feet or buttocks are positioned to be delivered first."],["Transverse position","The baby lies crosswise in the uterus."],["Vaginal position","This is not a fetal position in the notes."],["Head-first position","This is the typical position, not the breech one."]]],["A fetus lies crosswise in the uterus. What is this position called?",[["Transverse position","The baby lies crosswise in the uterus."],["Breech position","The feet or buttocks come first."],["Cesarean position","This is not a fetal position."],["Normal vertex position","The baby is positioned head-down, not crosswise."]]],["A method of childbirth seeks to prevent pain by eliminating the mother’s fear through education, training in breathing, and relaxation. What is it called?",[["Natural childbirth","It seeks to prevent pain by eliminating fear through education, breathing, and relaxation."],["Medicated delivery","This includes analgesics or anesthesia."],["Cesarean delivery","This is surgical delivery."],["Electronic fetal monitoring","This is the monitoring of the fetal heartbeat."]]],["A childbirth approach uses instruction and social support to induce controlled physical responses. What is it called?",[["Prepared childbirth","It includes methods like Lamaze, LeBoyer, and Bradley."],["Medicated delivery","This uses analgesics or anesthesia."],["Cesarean delivery","This is surgical delivery."],["Parturition","This is the process of giving birth."]]],["A couple chooses a prepared childbirth method that emphasizes massage and a quiet environment. Which method is it?",[["The LeBoyer method","It emphasizes massage and a quiet environment."],["The Lamaze method","This uses breathing techniques."],["The Bradley method","This emphasizes no medical intervention."],["Natural childbirth only","It is a general method, not the one with massage and quiet."]]],["Which row correctly matches each prepared childbirth method with its emphasis?",[["Lamaze: breathing techniques. LeBoyer: massage and a quiet environment. Bradley: no medical intervention","This matches each method to its emphasis."],["Lamaze: massage. LeBoyer: breathing techniques. Bradley: no medical intervention","Lamaze and LeBoyer are swapped."],["Lamaze: no medical intervention. LeBoyer: breathing techniques. Bradley: massage","These are all mismatched."],["Lamaze: quiet environment. LeBoyer: no medical intervention. Bradley: breathing techniques","These are all mismatched."]]],["A delivery uses central nervous system depressants for pain relief. What is this called?",[["Medicated delivery with analgesics","Medicated delivery includes analgesics, which are central nervous system depressants."],["Natural childbirth","This avoids medication by using education and relaxation."],["Kangaroo care","This is skin-to-skin contact after birth."],["Electronic fetal monitoring","This monitors the heartbeat."]]],["How do local anesthesia and regional anesthesia differ?",[["Local anesthesia, such as pudendal blocks, relieves pain in a small area, while regional anesthesia affects a larger region of the body","The difference is the size of the area numbed."],["Local anesthesia affects a larger region, and regional anesthesia is limited to a small area","This reverses the two."],["Both are central nervous system depressants","That describes analgesics."],["Both are prepared childbirth methods","They are forms of medication, not methods."]]],["A form of regional anesthesia blocks nerve pathways but may slow the second stage of labor. What is it?",[["An epidural","It blocks nerve pathways and may slow the second stage."],["A pudendal block","This is a form of local anesthesia."],["An analgesic","This is a central nervous system depressant."],["A Lamaze method","This uses breathing techniques."]]],["An experienced mentor gives a woman emotional support and information during labor, and hospitals benefit from fewer expensive Cesarean deliveries and better neonatal outcomes. Who is this?",[["A doula","She provides support, and her economic benefit comes from fewer Cesareans and improved outcomes."],["An obstetrician","This is not the mentor role described."],["A midwife who performs Cesareans","This is not what the notes describe."],["A forceps technician","This is not a role in the notes."]]],["A student says Stage 3 of labor is the longest stage. How should this be evaluated?",[["Incorrect: Stage 1, dilation of the cervix, is the longest, while Stage 3 lasts 10 minutes to one hour","Stage 3 is the shortest."],["Correct: Stage 3 is the longest","Stage 3 is the shortest."],["Correct: Stage 2 is the shortest","Stage 3 is the shortest."],["Incorrect: all stages last the same time","The stages differ widely in length."]]]]},{"id":20,"lec":3,"t":"Infancy & Toddlerhood - The Newborn Baby","q":[["From birth to the first month of life, all of a baby’s organ systems make major physiological transitions from intrauterine to extrauterine life. What is this period called?",[["The neonatal period","It runs from birth to the first month of life."],["The germinal period","This is the first two weeks after conception."],["The fetal period","This is from the ninth week of pregnancy until birth."],["Parturition","This is the process of giving birth."]]],["A baby is three weeks old. What is the term for a newborn up to 4 weeks old?",[["A neonate","A neonate is a newborn baby up to 4 weeks old."],["A fetus","This is the unborn child from the ninth week until birth."],["An embryo","This is the developing organism from about 2 to 8 weeks."],["A zygote","This is the single cell formed at fertilization."]]],["A parent notices soft spots on top of her newborn’s head, where the skull bones have not yet met. What are they called?",[["Fontanels","They are soft spots where the bones of the skull have not yet met."],["Lanugo","This is prenatal hair."],["Vernix caseosa","This is an oily protective coating."],["Meconium","This is the baby’s first stool."]]],["A premature newborn has fine prenatal hair covering her body that helps her adapt to the temperature of the environment. What is it called?",[["Lanugo","It is prenatal hair that protects and helps temperature adaptation."],["Vernix caseosa","This is an oily coating against infection."],["Meconium","This is the baby’s first stool."],["Fontanels","These are soft spots on the head."]]],["A newborn is covered with an oily, cheesy coating that protects against infection and dries within the first few days. What is it called?",[["Vernix caseosa","It is also called cheesy varnish."],["Lanugo","This is prenatal hair."],["Meconium","This is the first stool."],["Colic","This is intense, prolonged crying."]]],["How do anoxia and hypoxia differ?",[["Anoxia is a lack of oxygen, and hypoxia is a reduced oxygen supply","One is a complete lack, and the other is a reduction."],["Anoxia is a reduced oxygen supply, and hypoxia is a lack of oxygen","This reverses the two."],["Both mean a high oxygen supply","Both involve a lack of oxygen."],["Both are types of jaundice","They concern oxygen, not the liver."]]],["A student says anoxia means a reduced oxygen supply. How should this be evaluated?",[["Incorrect: anoxia is a lack of oxygen, while hypoxia is a reduced oxygen supply","The two terms differ in degree."],["Correct: anoxia is a reduced oxygen supply","This defines hypoxia."],["Correct: anoxia is an excess of oxygen","Anoxia is a lack of oxygen."],["Incorrect: anoxia is a liver condition","That describes neonatal jaundice."]]],["A newborn’s first bowel movement is stringy, greenish-black waste formed in the fetal intestinal tract. What is it called?",[["Meconium","It is the baby’s first poop."],["Vernix caseosa","This is an oily coating on the skin."],["Lanugo","This is prenatal hair."],["Fontanels","These are soft spots on the skull."]]],["A newborn’s skin and eyeballs appear yellow because her liver is immature. Which condition is this?",[["Neonatal jaundice","It is a yellowing of the skin and eyeballs due to the liver’s immaturity."],["Colic","This is intense, frequent, prolonged crying."],["Anoxia","This is a lack of oxygen."],["A meconium stain","This is green staining of the amniotic fluid."]]],["A student says neonatal jaundice is always harmless. How should this be evaluated?",[["Incorrect: it is usually not serious, but severe untreated cases may result in brain damage","The severity matters."],["Correct: it is never harmful","Severe untreated cases may result in brain damage."],["Correct: it is caused by a lack of oxygen","It is caused by the immaturity of the liver."],["Incorrect: it only affects the feet","It affects the skin and eyeballs."]]],["A healthy, well-fed infant cries intensely, frequently, and for a long time, starting at 2 to 3 weeks of age. What is this?",[["Colic","It peaks around 6 weeks and improves by 3 to 4 months."],["Neonatal jaundice","This is yellowing of the skin and eyes."],["Anoxia","This is a lack of oxygen."],["Hypoxia","This is a reduced oxygen supply."]]],["A baby cries for more than 3 hours a day, more than 3 days a week, and for more than 3 weeks. Which rule identifies this as colic?",[["The rule of 3s","It defines colic by crying more than 3 hours a day, 3 days a week, and 3 weeks."],["The APGAR score","This assesses a baby at 1 and 5 minutes after birth."],["The rule of thumb","This is not a rule in the notes."],["Kangaroo care","This is skin-to-skin contact after birth."]]],["Which timeline correctly describes colic?",[["It starts around 2 to 3 weeks, peaks around 6 weeks, and improves by 3 to 4 months","This is the typical course of colic."],["It starts at birth, peaks at 6 months, and ends at one year","This does not match the notes."],["It starts at 3 months and peaks at 6 weeks","It cannot peak before it starts."],["It starts around 6 weeks and improves by 2 weeks","The timeline is reversed."]]],["A doctor assesses a baby at 1 minute and 5 minutes after birth, scoring each category from 0 to 2. Who developed this assessment, and what is it called?",[["Dr. Virginia Apgar in 1953, the APGAR score","It examines a baby’s condition right after birth."],["Dr. Jean Piaget in 1953, the Piaget scale","Piaget developed a theory of cognitive development."],["Dr. Virginia Apgar in 1953, the Bayley scales","The Bayley scales assess development from 1 month to 3½ years."],["Dr. Arnold Gesell in 1953, the APGAR score","The score was developed by Dr. Virginia Apgar."]]],["In the APGAR score, a doctor checks the baby’s skin color. Which category is this?",[["Appearance","It is the color component."],["Pulse","This is the heart rate component."],["Grimace","This is the reflex irritability component."],["Respiration","This is the breathing component."]]],["In the APGAR score, a doctor checks the baby’s heart rate. Which category is this?",[["Pulse","It is the heart rate component."],["Appearance","This is the color component."],["Activity","This is the muscle tone component."],["Grimace","This is the reflex irritability component."]]],["In the APGAR score, a doctor checks how the baby reacts when stimulated, which is her reflex irritability. Which category is this?",[["Grimace","It is the reflex irritability component."],["Activity","This is the muscle tone component."],["Pulse","This is the heart rate component."],["Respiration","This is the breathing component."]]],["In the APGAR score, a doctor checks the baby’s muscle tone. Which category is this?",[["Activity","It is the muscle tone component."],["Grimace","This is the reflex irritability component."],["Appearance","This is the color component."],["Pulse","This is the heart rate component."]]],["In the APGAR score, a doctor checks the baby’s breathing. Which category is this?",[["Respiration","It is the breathing component."],["Pulse","This is the heart rate component."],["Appearance","This is the color component."],["Activity","This is the muscle tone component."]]],["Which row correctly matches each APGAR category with what it measures?",[["Appearance: color. Pulse: heart rate. Grimace: reflex irritability. Activity: muscle tone. Respiration: breathing","This matches all five categories."],["Appearance: heart rate. Pulse: color. Grimace: muscle tone. Activity: reflex irritability. Respiration: breathing","Several categories are swapped."],["Appearance: breathing. Pulse: muscle tone. Grimace: color. Activity: heart rate. Respiration: reflex irritability","All the categories are mismatched."],["Appearance: muscle tone. Pulse: breathing. Grimace: heart rate. Activity: color. Respiration: reflex irritability","All the categories are mismatched."]]],["A delivery method uses forceps to deliver a baby in a breech position. What is this called?",[["Forceps delivery","Forceps are used to deliver the baby."],["Cesarean delivery","This is surgical removal from the uterus."],["Natural childbirth","This is a method that seeks to prevent pain by eliminating fear."],["Kangaroo care","This is skin-to-skin contact after birth."]]],["The umbilical cord is wrapped around the fetus’s neck, which can cause a loss of oxygen. What is this complication called?",[["Umbilical cord coil","The cord is wrapped around the neck and can cause oxygen loss."],["Meconium stain","This is green staining of the amniotic fluid."],["Neonatal jaundice","This is yellowing of the skin due to an immature liver."],["Colic","This is prolonged crying."]]],["How do meconium and a meconium stain differ?",[["Meconium is the baby’s first stool, and a meconium stain occurs when the baby passes it in the womb, staining the amniotic fluid green and risking inhalation into the lungs","One is a normal first stool, and the other is a complication."],["Meconium is a complication, and a meconium stain is the baby’s first stool","This reverses the two."],["Both are yellowing of the skin","That describes neonatal jaundice."],["They mean the same thing","They are distinct terms."]]],["An antiseptic, temperature-controlled crib is used while a baby is fed through tubes. It is commonly used for low-birth-weight or premature babies. What is it called?",[["An isolette","It is an antiseptic, temperature-controlled crib."],["Kangaroo care","This is skin-to-skin contact between mother and baby."],["An epidural","This is a form of regional anesthesia."],["A fontanel","This is a soft spot on the skull."]]],["A newborn is placed face down between her mother’s breasts for about an hour after birth to help her adjust from the intrauterine environment. What is this practice called?",[["Kangaroo care","It helps the infant adjust to the outside world."],["An isolette","This is an antiseptic crib."],["Forceps delivery","This is a delivery method using forceps."],["Natural childbirth","This is a method of childbirth that eliminates fear."]]]]},{"id":21,"lec":3,"t":"Infancy & Toddlerhood - Early Physical Development","q":[["A baby learns to lift her head and control her neck before she can control her legs. Which principle is this?",[["The cephalocaudal principle","Development occurs from head to tail, with the upper body developing before the lower trunk."],["The proximodistal principle","This is development from the center of the body outward."],["The principle of habituation","This is reduced responsiveness to a familiar stimulus."],["The sweet taste preference","This is the infant’s preference for sweet-tasting foods."]]],["An infant controls her shoulders and arms before she can control her fingers. Which principle is this?",[["The proximodistal principle","Development occurs from the center of the body outward."],["The cephalocaudal principle","This is development from head to tail."],["Auditory discrimination","This is the ability to distinguish sounds."],["Visual acuity","This is the sharpness of vision."]]],["How do the cephalocaudal and proximodistal principles differ?",[["Cephalocaudal development proceeds from head to tail, and proximodistal development proceeds from the center of the body outward","One runs top to bottom, and the other runs from the center to the extremities."],["Cephalocaudal development proceeds from the center outward, and proximodistal development proceeds from head to tail","This reverses the two."],["Both proceed from the extremities inward","Both begin at the head or the center."],["Both proceed only after the first year","They apply from the earliest development."]]],["Which sense is the first to develop and the most mature sensory system during the first several months of life?",[["Touch","It develops first and is the most mature during the first months."],["Vision","This is the least developed sense at birth."],["Taste","This begins developing in the womb but is not the most mature."],["Hearing","This is functional before birth but is not the most mature."]]],["A newborn calms when she is held, rocked, and stroked. Which sensory system is most mature in her first months?",[["The sense of touch","It is the most mature sensory system during the first several months."],["Vision","It is the least developed at birth."],["Smell","It begins developing in the womb, but touch is the most mature."],["Hearing","It is functional before birth, but touch is the most mature."]]],["Which sense begins developing in the womb, alongside taste?",[["Smell","Both smell and taste begin developing before birth."],["Vision","Vision is the least developed sense at birth."],["Touch","Touch is the first to develop, but the notes pair smell with taste."],["Auditory discrimination","This develops rapidly after birth."]]],["An infant’s sense of taste begins developing before birth. Which other sense also begins developing in the womb?",[["Smell","It begins developing in the womb."],["Visual acuity","This is the sharpness of vision, which is poor at birth."],["Pictorial competence","This is the ability to understand pictures, which develops later."],["Neonate visual focus","This is a visual ability, not a sense that begins in the womb."]]],["A baby happily accepts breast milk and other sweet-tasting foods more readily than other flavors. Which preference is this?",[["The sweet taste preference","Infants prefer sweet-tasting foods, such as breast milk."],["The preference for the mother’s smell","This is a preference for the smell of the baby’s own mother."],["Auditory discrimination","This is the ability to distinguish sounds."],["Neonate visual focus","This is the distance at which the newborn’s eyes focus best."]]],["A baby turns toward the smell of her own mother rather than the smell of other women. What does this show?",[["A preference for the mother’s smell","Babies show a preference for the smell of their own mothers."],["The sweet taste preference","This is the preference for sweet-tasting foods."],["Habituation","This is reduced responsiveness to a familiar stimulus."],["Visual acuity","This is the sharpness of vision."]]],["A newborn reacts to her mother’s voice, which she has heard through the womb. Which sense is functional before birth?",[["Hearing","It is functional before birth."],["Vision","It is the least developed sense at birth."],["Touch","Touch develops first, but the example concerns sound."],["Taste","Taste begins developing in the womb but does not explain reacting to a voice."]]],["A two-week-old infant can distinguish between different sounds, an ability that develops rapidly after birth. What is it called?",[["Auditory discrimination","It is the ability to distinguish sounds."],["Visual acuity","This is the sharpness of vision."],["Dishabituation","This is increased responsiveness after a new stimulus."],["Pictorial competence","This is the ability to understand pictures."]]],["Which sense is the least developed at birth?",[["Vision","It is the least developed sense at birth."],["Touch","This is the most mature sense."],["Hearing","This is functional before birth."],["Smell","This begins developing in the womb."]]],["A newborn’s vision is approximately 20/400. About when does it improve to approximately 20/20?",[["By about 8 months","Vision improves to about 20/20 by 8 months."],["By about 1 month","The newborn’s vision is still about 20/400 then."],["By about 2 years","This is later than the notes state."],["At birth","Vision at birth is about 20/400."]]],["A newborn looks most clearly at her caregiver’s face when she is held about one foot away. What does this show?",[["The newborn’s eyes focus best at about one foot","This is the typical distance from the face of a caregiver holding the baby."],["The newborn has 20/20 vision","Newborn vision is about 20/400."],["The newborn’s vision is the most mature sense","Touch is the most mature sense."],["The newborn prefers sweet-tasting foods","This concerns taste, not vision."]]],["A newborn cannot clearly see a toy across the room but studies the face of the person holding her. Why?",[["Her eyes focus best at about one foot","Her vision is about 20/400, and she focuses best at close range."],["Her hearing is not yet functional","Hearing is functional before birth."],["Her vision is more mature than her touch","Vision is the least developed sense at birth."],["Her sense of smell has not developed","Smell begins developing in the womb."]]],["Which statement correctly contrasts the first sense to develop with the least developed sense at birth?",[["Touch is the first sense to develop and the most mature, while vision is the least developed at birth","This is the contrast between the most and least mature senses."],["Vision is the first sense to develop, while touch is the least developed at birth","This reverses the two."],["Hearing is the first sense to develop, while touch is the least developed","This does not match the notes."],["Smell is the first sense to develop, while taste is the least developed","This does not match the notes."]]],["Which list names the senses that begin developing in the womb or are functional before birth?",[["Smell, taste, and hearing","Smell and taste begin in the womb, and hearing is functional before birth."],["Vision, smell, and taste","Vision is the least developed at birth."],["Vision, hearing, and touch","Vision is not among them."],["Touch only","Other senses also develop before birth."]]],["Which statement correctly contrasts the sweet taste preference with the preference for the mother’s smell?",[["One is a preference for sweet-tasting foods such as breast milk, and the other is a preference for the smell of the baby’s own mother","One concerns taste, and the other concerns smell."],["One is the ability to distinguish sounds, and the other is the sharpness of vision","These are auditory discrimination and visual acuity."],["Both are preferences for sweet-tasting foods","Only the first is about taste."],["Both are preferences for the sound of the mother’s voice","Neither concerns hearing."]]],["How does the change in vision from birth to 8 months compare?",[["It improves from approximately 20/400 to approximately 20/20","Visual acuity improves greatly during these months."],["It declines from 20/20 to 20/400","This reverses the change."],["It stays at about 20/400","It improves over time."],["It improves from 20/20 to 20/400","This reverses the numbers."]]],["A student says newborns have 20/20 vision. How should this be evaluated?",[["Incorrect: vision at birth is approximately 20/400, improving to about 20/20 by 8 months","Vision is the least developed sense at birth."],["Correct: newborns see as well as adults","Newborn vision is much poorer."],["Correct: vision is the most mature sense","Touch is the most mature sense."],["Incorrect: newborns cannot see at all","They see poorly, with about 20/400 vision."]]],["A student says the cephalocaudal principle describes development from the center of the body outward. How should this be evaluated?",[["Incorrect: the cephalocaudal principle describes development from head to tail, and the proximodistal principle describes development from the center outward","The two principles run in different directions."],["Correct: both describe development from the center outward","Only the proximodistal principle does."],["Correct: it describes development from the toes upward","It describes development from head to tail."],["Incorrect: it describes development only in the womb","It also describes development after birth."]]],["A newborn sucks eagerly on a sweet solution but grimaces at a bitter one. Which preference does this show?",[["The sweet taste preference","Infants prefer sweet-tasting foods, such as breast milk."],["The preference for the mother’s smell","This is a preference for the smell of the baby’s own mother."],["Auditory discrimination","This is the ability to distinguish sounds."],["Neonate visual focus","This is the distance at which a newborn’s eyes focus best, about one foot."]]],["A student says hearing begins developing only after birth. How should this be evaluated?",[["Incorrect: hearing is functional before birth, and auditory discrimination develops rapidly after birth","Hearing starts in the womb."],["Correct: hearing is the last sense to develop","Vision is the least developed at birth."],["Correct: babies cannot hear until two months","Hearing is functional before birth."],["Incorrect: hearing is the first sense to develop","Touch is the first and most mature sense."]]],["A baby’s head and chest control improve well before she can control her legs and feet. Which principle does this illustrate?",[["The cephalocaudal principle","Development proceeds from head to tail, with the upper parts developing before the lower trunk."],["The proximodistal principle","This is development from the center of the body outward."],["The sweet taste preference","This is the infant’s preference for sweet-tasting foods."],["Visual acuity","This is the sharpness of vision."]]],["A toddler swings her whole arm toward a toy long before she can pinch a small bead between her fingers. Which principle does this illustrate?",[["The proximodistal principle","Body parts near the center develop before the extremities, so the arm comes before the fingers."],["The cephalocaudal principle","This is development from head to tail."],["Auditory discrimination","This is the ability to distinguish sounds."],["The preference for the mother’s smell","This is a preference for the smell of the baby’s own mother."]]]]},{"id":22,"lec":3,"t":"Infancy & Toddlerhood - Cognitive & Early Language Development","q":[["A researcher assesses an infant’s cognitive development through measurement and testing. Which approach is she using?",[["The psychometric approach","It assesses cognitive development through measurement and testing."],["The sociocultural approach","This is Vygotsky’s focus on social and cultural processes."],["The ethological approach","This stresses evolutionary and biologic

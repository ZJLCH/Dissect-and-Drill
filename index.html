iple","Development proceeds from the head toward the tail."],["The proximodistal principle","This is development from the midline outward."],["Implantation","This is the attachment of the blastocyst to the uterine wall."],["Viability","This is the age at which a fetus can survive outside the womb."]]],["A baby born at about 24 weeks can survive outside the womb with medical support. Which concept is this?",[["The age of viability","It is the earliest point at which survival outside the womb is possible."],["Gestational age","This is counted from the first day of the last menstrual cycle."],["Implantation","This is the attachment to the uterine wall."],["Organogenesis","This is the formation of internal organs."]]],["A student says implantation marks the beginning of the fetal period. How should this be evaluated?",[["Incorrect: implantation ends the germinal period, and the fetal period begins at the ninth week","Implantation is the attachment of the blastocyst to the uterine wall."],["Correct: implantation begins the fetal period","The fetal period begins at the ninth week."],["Correct: implantation begins the embryonic period at week 10","The embryonic period starts after implantation, at about week 2."],["Incorrect: implantation happens after birth","It occurs in the first two weeks."]]],["A mother is exposed to a teratogen during week 6 of pregnancy, and her baby has major structural defects. Which factor best explains this?",[["Timing of exposure, since organs were forming during the embryonic period","Exposure when structures form causes the most severe structural defects."],["Dose only","Dose matters, but timing explains the structural pattern here."],["Number of teratogens","The scenario describes one exposure."],["Genetic susceptibility only","The scenario highlights timing."]]],["A baby has retarded growth, malformations of the face and body, and disorders of the central nervous system. Which prenatal exposure is most likely responsible?",[["Alcohol, causing fetal alcohol syndrome","These are the features of fetal alcohol syndrome."],["Thalidomide, causing missing limbs","Thalidomide is associated with stunted or missing limbs and facial deformities."],["Accutane, causing heart defects","Accutane is linked to heart defects and brain and ear abnormalities."],["Moderate exercise","This is recommended in pregnancy."]]],["A baby is born at 36 weeks of gestation weighing 2300 grams. Which two terms describe her?",[["Pre-term and low birth weight","She was born before 37 weeks and weighs under 2500 grams."],["Small-for-date and full term","She was born before 37 weeks, so she is not full term."],["Pre-term and obese","Obesity is not a classification for newborns."],["Full term and low birth weight","She was born before 37 weeks."]]],["A woman smokes throughout her pregnancy. Which set of risks is associated with this?",[["Miscarriage, birth complications, SIDS, ADHD risk, and intergenerational smoking behavior","These are the associated risks."],["Missing limbs and facial deformities","These are linked to thalidomide."],["Heart defects and ear abnormalities","These are linked to Accutane."],["An extra Y chromosome","This is Jacob’s syndrome."]]],["How does the amount of exposure to a teratogen differ from the number of teratogens?",[["Amount of exposure concerns reaching a harmful level, partly based on the mother’s size and metabolism, while number of teratogens concerns exposure to more than one agent","One concerns quantity of one substance, and the other concerns how many agents are involved."],["Amount of exposure concerns exposure to more than one agent, while number of teratogens concerns the mother’s size","This reverses the two."],["Both concern the timing of exposure","Timing is a separate factor."],["They mean the same thing","They are separate factors."]]],["A woman at 38 weeks has contractions every five minutes that are painful and steadily getting stronger. What are these contractions?",[["Real labor contractions","They are frequent, rhythmic, painful, and steadily increase in intensity."],["Braxton-Hicks contractions","These are mild and irregular."],["False contractions","These are mild, irregular tightenings before real labor."],["Pudendal blocks","These are a form of local anesthesia."]]],["The baby has just been born. Which event comes next in the stages of labor?",[["Expulsion of the placenta and the rest of the umbilical cord","It is Stage 3, lasting 10 minutes to one hour."],["Dilation of the cervix to 10 centimeters","This is Stage 1."],["The baby’s head moving through the cervix","This is Stage 2."],["Braxton-Hicks contractions","These occur before labor."]]],["A couple chooses a prepared childbirth method that emphasizes breathing techniques. Which method is it?",[["The Lamaze method","It emphasizes breathing techniques."],["The LeBoyer method","It emphasizes massage and a quiet environment."],["The Bradley method","It emphasizes no medical intervention."],["An epidural","This is medical pain relief, not a prepared childbirth method."]]],["A woman receives pain relief that numbs a large region by blocking nerve pathways, and her second stage of labor slows. Which method is this?",[["An epidural","It is a form of regional anesthesia that blocks nerve pathways and may slow the second stage."],["A pudendal block","This is local anesthesia affecting a small area."],["An analgesic","This is a central nervous system depressant."],["Natural childbirth","This avoids medication through education and relaxation."]]],["A student says the Lamaze method emphasizes massage and a quiet environment. How should this be evaluated?",[["Incorrect: that describes the LeBoyer method, while Lamaze emphasizes breathing techniques","The two methods have different emphases."],["Correct: Lamaze emphasizes massage","That describes the LeBoyer method."],["Correct: Lamaze emphasizes no medical intervention","That describes the Bradley method."],["Incorrect: Lamaze is a form of Cesarean delivery","It is a prepared childbirth method."]]],["One minute and five minutes after birth, a doctor scores a baby’s color, heart rate, reflexes, muscle tone, and breathing from 0 to 2. Which assessment is this?",[["The APGAR score","It was developed by Dr. Virginia Apgar in 1953."],["The Bayley Scales","These assess development from 1 month to 3½ years."],["The HOME inventory","This measures the home environment."],["The rule of 3s","This identifies colic."]]],["A newborn’s amniotic fluid is stained green because she passed her first stool in the womb, and she may inhale it into her lungs. What is this complication called?",[["A meconium stain","It occurs when the baby passes meconium in the womb."],["Neonatal jaundice","This is yellowing of the skin due to an immature liver."],["An umbilical cord coil","This is the cord wrapped around the neck."],["Colic","This is intense, prolonged crying."]]],["An otherwise healthy 4-week-old cries for more than 3 hours a day, more than 3 days a week, for more than 3 weeks. What is this condition called?",[["Colic","It starts around 2 to 3 weeks, peaks around 6 weeks, and improves by 3 to 4 months."],["Neonatal jaundice","This is yellowing of the skin."],["Anoxia","This is a lack of oxygen."],["Hypoxia","This is a reduced oxygen supply."]]],["A premature, low-birth-weight baby is placed in an antiseptic, temperature-controlled crib and fed through tubes. What is the crib called?",[["An isolette","It is an antiseptic, temperature-controlled crib."],["A kangaroo pouch","Kangaroo care is skin-to-skin contact, not a crib."],["A fontanel","This is a soft spot on the skull."],["A placenta","This provides nourishment during pregnancy."]]],["How do vernix caseosa and lanugo differ?",[["Vernix caseosa is an oily, cheesy coating that protects against infection, while lanugo is fine prenatal hair","One is a coating, and the other is hair."],["Vernix caseosa is fine prenatal hair, while lanugo is an oily coating","This reverses the two."],["Both are the baby’s first stool","That describes meconium."],["Both are soft spots on the skull","That describes fontanels."]]],["A newborn watches her mother’s face closely while nursing but ignores a toy held across the room. Why?",[["Her eyes focus best at about one foot","This is the typical distance from the face of a caregiver holding the baby."],["Her vision is 20/20","Newborn vision is about 20/400."],["Her sense of touch is not yet functional","Touch is the most mature sense."],["She cannot hear the toy","Hearing is functional before birth."]]],["Which sense is the first to develop and the most mature during the first several months of life?",[["Touch","It develops first and is the most mature."],["Vision","This is the least developed at birth."],["Taste","This begins developing in the womb but is not the most mature."],["Hearing","This is functional before birth but is not the most mature."]]],["A newborn turns toward the scent of her own mother rather than that of another woman. Which preference is this?",[["The preference for the mother’s smell","Babies prefer the smell of their own mothers."],["The sweet taste preference","This is the preference for sweet-tasting foods."],["Auditory discrimination","This is the ability to distinguish sounds."],["Neonate visual focus","This is the distance at which newborns focus best."]]],["A newborn startles at a sound and quiets when she hears her mother’s voice. Which sense is functional before birth?",[["Hearing","It is functional before birth."],["Vision","This is the least developed sense at birth."],["Touch","This is the first sense to develop."],["Taste","This begins developing in the womb."]]],["Which pair of examples illustrates the cephalocaudal and proximodistal principles, in that order?",[["Head control before leg control, and shoulder control before finger control","The first runs from head to tail, and the second runs from the center outward."],["Shoulder control before finger control, and head control before leg control","This reverses the two principles."],["Finger control before shoulder control, and leg control before head control","Both examples reverse the direction of development."],["Head control before shoulder control, and leg control before finger control","Neither example correctly pairs with its principle."]]],["A psychologist wants to assess motor, language, and cognitive development in a two-year-old. Which tool and age range fit?",[["The Bayley Scales, for children from 1 month to 3½ years","They cover cognitive, language, adaptive behavior, motor, and socio-emotional development."],["An IQ test, for children from 1 month to 3½ years","IQ tests compare performance with standardized norms."],["The APGAR score, for children from 1 month to 3½ years","This is used at 1 and 5 minutes after birth."],["The HOME inventory, for children from 1 month to 3½ years","This measures the home environment."]]],["A baby loses interest in a picture she has seen many times and then looks eagerly when a new picture appears. Which two processes are these, in order?",[["Habituation, then dishabituation","Responsiveness to a familiar stimulus fell, then rose with a new stimulus."],["Dishabituation, then habituation","This reverses the order."],["Habituation, then a scale error","A scale error is a misperception of relative sizes."],["Cooing, then babbling","These are forms of prelinguistic speech."]]],["A toddler says “cookie!” to mean “I want a cookie right now.” What is this called?",[["A holophrase","It is a single word used to express a complete thought."],["Telegraphic speech","This uses a few essential words as a sentence."],["Babbling","This is the repetition of consonant sounds."],["Cooing","This is the repetition of vowel sounds."]]],["A toddler says “Daddy work gone,” using only the essential words. What is this called?",[["Telegraphic speech","It is an early form of sentence use consisting only of a few essential words."],["A holophrase","This is a single word that expresses a complete thought."],["Babbling","This is the repetition of consonant sounds."],["Context-based understanding","This is inferring a word’s meaning from context."]]],["A student says a scale error is the inability to understand pictures. How should this be evaluated?",[["Incorrect: a scale error is a momentary misperception of the relative sizes of objects, and understanding pictures is pictorial competence","The two terms refer to different abilities."],["Correct: a scale error is the inability to understand pictures","That would be a lack of pictorial competence."],["Correct: a scale error is reduced responsiveness to a familiar stimulus","That describes habituation."],["Incorrect: a scale error is a type of cry","It is a cognitive misperception."]]],["A baby’s cry starts suddenly and loudly, without preliminary moaning, and she holds her breath afterward. Which type of cry is this?",[["The pain cry","It is a sudden onset of loud crying, sometimes followed by breath-holding."],["The hunger cry","This is a rhythmic cry."],["The anger cry","This forces excess air through the vocal cords."],["The frustration cry","This is two to three drawn-out cries."]]],["A baby adapts quickly to new foods, keeps regular routines, and is friendly to strangers. Which temperament does she show?",[["Easy temperament","These are its characteristics."],["Slow-to-warm-up temperament","This shows mild reactions and gradual adaptation."],["Difficult temperament","This is the third major category."],["Behavioral inhibition","This is caution toward unfamiliar situations."]]],["A toddler hangs back at a new playground and watches the other children before joining in. Which temperament dimension is this?",[["Behavioral inhibition","It is the degree of caution a child shows toward unfamiliar situations."],["Extraversion/surgency","This is an energetic, positive approach to new experiences."],["Negative affectivity","This is a tendency to be sad, fearful, or irritated."],["Effortful control","This is the ability to focus attention and regulate behavior."]]],["A toddler can shift her attention when asked, wait for her turn, and calm herself when upset. Which temperament dimension is this?",[["Effortful control (self-regulation)","It is the ability to focus and shift attention, control behavior, and regulate emotions."],["Negative affectivity","This is a tendency to be sad or easily frustrated."],["Extraversion/surgency","This is an energetic approach to new experiences."],["Behavioral inhibition","This is caution toward unfamiliar situations."]]],["A toddler is easily frustrated, often fearful, and quickly irritated by small changes. Which temperament dimension is this?",[["Negative affectivity","It is the tendency to be sad, fearful, easily frustrated, or irritated."],["Effortful control","This is the ability to regulate attention and behavior."],["Extraversion/surgency","This is a positive and energetic approach to new experiences."],["Behavioral inhibition","This is caution toward unfamiliar situations."]]],["A 4-year-old screams in the night, calms when her father comforts her, and remembers nothing in the morning. Which sleep disturbance is this?",[["Night terrors","They are a less dysfunctional sleep disturbance that children often forget once comforted."],["Nightmares","These are more dysfunctional and remembered vividly."],["Sleepwalking","This is walking while asleep."],["Sleeptalking","This is talking while asleep."]]],["A 5-year-old carefully cuts along a line with child-safe scissors. Which skill is she using?",[["Fine motor skills","They are the coordination of small muscles for precise movements."],["Gross motor skills","These involve larger muscle groups, such as running and jumping."],["Handedness","This is a preference for one hand over the other."],["Systems of action","These are complex combinations of skills."]]],["A child’s weight is at the 88th percentile for her age. How is this classified?",[["Overweight","Overweight is body weight between the 85th and 95th percentiles."],["Obese","Obesity is body weight above the 95th percentile."],["Wasted","This describes children who are thinner than they should be for their height."],["Stunted","This describes children who are shorter than expected for their age."]]],["A child appears to be of normal weight but is noticeably shorter than expected for her age, with cognitive and physical deficiencies. Which condition is this?",[["Stunted","These are children of normal weight who are shorter than expected."],["Wasted","These children are of appropriate height but thinner than they should be."],["Overweight","This is body weight between the 85th and 95th percentiles."],["Obese","This is body weight above the 95th percentile."]]],["Between ages 3 and 6, which brain areas show the most rapid growth, supporting planning and goal setting?",[["The frontal areas","They are responsible for planning and goal setting."],["The sensory areas","These are not the areas named for planning."],["The visual areas","These are not the areas named for planning."],["The motor areas","These are not the areas named for planning."]]],["A child repeats a three-step instruction in her head while she follows it. Which memory storehouse is she using?",[["Working storage","It is a short-term storehouse for information a person is actively working on."],["Sensory storage","This holds information only for a brief moment."],["Long-term storage","This holds information for long periods."],["Retrieval","This is a process, not a storehouse."]]],["A 3-year-old hears the word “zebra” once while looking at a picture and roughly understands what it means. What is this ability called?",[["Fast mapping","It is learning the approximate meaning of a word after hearing it once or twice."],["Rapid word learning","This is grasping a word’s meaning after only a few exposures."],["Encoding","This is attaching a label to information."],["Context-based understanding","This is inferring meaning from surrounding words or objects."]]],["Two preschoolers sit side by side, each building her own tower, without talking to each other. Which stage of play is this?",[["Parallel play","Children play side by side with similar toys but do not interact."],["Associative play","Children interact and share toys."],["Cooperative play","Children work together toward a shared goal."],["Solitary play","The child plays alone and is unaware of others."]]],["A group of children builds one fort together, each taking a role toward the shared goal. Which stage of play is this?",[["Cooperative play","It is the most advanced stage, with a shared goal."],["Associative play","Children interact but have no common goal."],["Parallel play","Children do not interact."],["Onlooker play","The child watches others without joining."]]],["A child cannot remember where she left her shoes until her mother asks her to think about the last time she wore them. Which memory process was missing until the prompt?",[["Retrieval","It is locating and accessing stored information."],["Encoding","This is attaching a label to information."],["Storage","This is retaining encoded information."],["Habituation","This is reduced responsiveness to a familiar stimulus."]]],["A father kneels down and explains how a lie hurts people’s trust, then helps his son think of ways to make it right. Which technique is he using?",[["Inductive techniques","They guide children to internalize moral standards."],["Power assertion","This relies on authority, force, or punishment."],["Withdrawal of love","This relies on ignoring or rejecting the child."],["Parallel play","This is a stage of social play."]]],["A mother slaps her daughter’s hand and snaps, “Because I said so!” when the girl refuses to share. Which technique is she using?",[["Power assertion","It controls behavior through authority, force, or punishment."],["Inductive techniques","These involve explanations that help the child internalize standards."],["Withdrawal
